<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1016">
<title>Bot Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<script src="../shared/device.js"></script>
<script src="../shared/auto.js"></script>
<script src="../shared/speed.js"></script>
<script>window.GK={}</script>
<script src="../shared/gk2.js"></script>
<style>
  .wrap{max-width:1060px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 20px 60px}
  .top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:11px;color:var(--dim);border-bottom:2px solid var(--paper);padding-bottom:8px}
  .top a{color:var(--paper);text-decoration:none;border:2px solid var(--paper);padding:7px 10px;font-size:10px}
  .top a:hover,.top a:focus-visible{background:var(--amber);color:var(--ink);border-color:var(--amber);outline:none}
  .top .act{margin-left:auto;display:flex;align-items:center;gap:8px}
  h1{font:700 clamp(2.2rem,10vw,4.6rem)/.95 var(--px);text-transform:uppercase;margin:28px 0 30px}
  h1 span{color:var(--amber)}
  h2{font:700 14px var(--px);text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:0 0 10px;display:flex;align-items:center;gap:10px}
  h2::after{content:"";flex:1;height:2px;background:var(--line)}
  svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .grid{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:start}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  /* roster: catalog rows, like the arcade list */
  .roster{display:flex;flex-direction:column;border-top:1px solid var(--line)}
  .bot{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 6px;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
  .bot:hover,.bot:focus-visible{background:var(--ink2);outline:none}
  .bot.sel{background:var(--ink2);box-shadow:inset 4px 0 0 var(--amber)}
  .av{width:44px;height:44px;display:grid;place-items:center;color:var(--ink);border:2px solid var(--paper)}
  .av svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bot b{font:700 13px var(--px);text-transform:uppercase;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bot small{color:var(--dim);font-size:12px}
  .tag{font:700 10px var(--px);padding:3px 6px;background:var(--amber);color:var(--ink)}
  .newb{margin-top:12px;width:100%}
  /* editor */
  .ed{border:2px solid var(--paper);padding:18px;display:grid;grid-template-columns:220px 1fr;gap:20px}
  @media(max-width:620px){.ed{grid-template-columns:1fr;padding:14px}}
  .ed .big{width:100%;aspect-ratio:1;display:grid;place-items:center;color:var(--ink);border:2px solid var(--paper);box-shadow:6px 6px 0 var(--paper)}
  .ed .big svg{width:55%;height:55%;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .ed input[type=text]{width:100%;height:44px;margin-top:16px;padding:0 10px;background:var(--ink);color:var(--paper);border:2px solid var(--paper);font:700 14px var(--px);text-transform:uppercase}
  .ed input[type=text]:focus{outline:2px dashed var(--amber);outline-offset:3px}
  .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
  .acts .btn{min-height:40px;padding:0 12px;font-size:11px}
  .radar{width:100%;max-width:260px;margin:12px auto 0;display:block}
  .sl{display:grid;grid-template-columns:24px 104px 1fr 36px;gap:10px;align-items:center;margin-bottom:10px}
  .sl span{font:700 11px var(--px);text-transform:uppercase}.sl output{font:700 13px var(--mono);text-align:right;color:var(--amber)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--line);border:1px solid var(--paper)}
  input[type=range]::-moz-range-track{height:6px;background:var(--line);border:1px solid var(--paper)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:22px;margin-top:-9px;background:var(--amber);border:2px solid var(--paper);border-radius:0}
  input[type=range]::-moz-range-thumb{width:14px;height:20px;background:var(--amber);border:2px solid var(--paper);border-radius:0}
  input[type=range]:focus-visible{outline:2px dashed var(--amber);outline-offset:2px}
  .picks{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
  .picks button{width:36px;height:36px;display:grid;place-items:center;background:transparent;color:var(--paper);border:2px solid var(--line);cursor:pointer;padding:0}
  .picks button.on{border-color:var(--amber);color:var(--amber)}
  .picks button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .picks .sw{border-color:var(--ink)}.picks .sw.on{outline:2px solid var(--paper);outline-offset:2px}
  /* presets: a dense parts catalogue */
  .presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line);margin-bottom:34px}
  .pre{display:flex;align-items:center;gap:10px;padding:10px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;color:var(--paper);font:700 11px var(--px);text-transform:uppercase;text-align:left;cursor:pointer}
  .pre:hover,.pre:focus-visible{background:var(--amber);color:var(--ink);outline:none}
  .pre svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .sec{margin-top:40px}
  .arena{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .arena select{height:44px;min-width:220px;background:var(--ink);color:var(--paper);border:2px solid var(--paper);font:700 13px var(--mono);padding:0 8px}
  /* race: several bots at once, each in its own live lane */
  .lineup{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-bottom:12px}
  .ln{display:grid;grid-template-columns:30px 1fr auto 40px;gap:10px;align-items:center;padding:6px;border-bottom:1px solid var(--line);font-size:13px}
  .ln .av{width:30px;height:30px}.ln .av svg{width:18px;height:18px}.ln b{font:700 12px var(--px);text-transform:uppercase}.ln small{color:var(--dim)}
  .ln button{width:36px;height:36px;background:transparent;color:var(--paper);border:2px solid var(--line);font:16px/1 var(--mono);cursor:pointer}
  .ln button:hover,.ln button:focus-visible{border-color:var(--red);color:var(--red);outline:none}
  .race{position:fixed;inset:0;z-index:50;background:var(--ink);display:flex;flex-direction:column}
  .rbar{display:flex;align-items:center;gap:8px;padding:8px max(10px,env(safe-area-inset-left));border-bottom:2px solid var(--paper);flex:none;flex-wrap:wrap}
  .rbar .btn{min-height:36px;padding:0 12px;font-size:11px}.rbar .x{margin-left:auto;font:700 13px var(--mono);color:var(--dim)}
  .rbar .sp{display:flex}.rbar .sp button{height:36px;min-width:44px;background:transparent;color:var(--paper);border:2px solid var(--line);margin-left:-2px;font:700 12px var(--mono);cursor:pointer}
  .rbar .sp button.on{background:var(--amber);color:var(--ink);border-color:var(--amber);position:relative}
  .lanes{flex:1;display:grid;gap:2px;background:var(--line);min-height:0}
  .lane{display:flex;flex-direction:column;background:var(--ink);min-height:0;min-width:0}
  .lh{display:grid;grid-template-columns:auto 26px minmax(0,1fr) auto 32px;gap:8px;align-items:center;padding:4px 6px;flex:none;border-bottom:1px solid var(--line)}
  .lh .av{width:26px;height:26px}.lh .av svg{width:16px;height:16px}
  .lh .nm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px}.lh .nm b{font:700 11px var(--px);text-transform:uppercase}.lh .nm small{color:var(--dim)}
  .lh .sc{display:flex;align-items:center;gap:5px;font:700 14px var(--mono);color:var(--amber);white-space:nowrap}.lh .sc .bi svg{width:16px;height:16px;fill:none;stroke:var(--dim);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
  .lh .rk{font:700 11px var(--px);min-width:26px;height:22px;display:grid;place-items:center;background:var(--line);color:var(--paper);padding:0 4px}.lh .rk.one{background:var(--amber);color:var(--ink)}
  .lh a{width:32px;height:28px;display:grid;place-items:center;color:var(--paper);border:2px solid var(--line);text-decoration:none}
  .lh a:hover,.lh a:focus-visible{border-color:var(--amber);color:var(--amber);outline:none}
  .lane iframe{flex:1;width:100%;min-height:0;border:0;display:block;background:#000}
  table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}th{font:700 10px var(--px);text-transform:uppercase;color:var(--dim)}
  td.r{color:var(--amber);font-weight:700}
  .empty{color:var(--dim);padding:14px 0}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <div class="top px"><a href="../">← Arcade</a><span>Bot Workshop · Cat. 02</span><span class="act" id="act"></span></div>
  <h1>Bot<span>Workshop</span></h1>
  <div class="grid">
    <section><h2>Your bots</h2><div class="roster" id="roster"></div><button class="btn ghost newb" id="newb">+ New bot</button></section>
    <section><h2>Build</h2><div class="ed" id="ed"></div></section>
  </div>
  <div class="sec"><h2>Quick presets</h2><div class="presets" id="presets"></div></div>
  <div class="sec"><h2>Arena</h2><div class="arena"><select id="game" aria-label="Game"></select><button class="btn" id="go">Run bot ▸</button></div></div>
  <div class="sec"><h2>Race</h2><div class="lineup" id="lineup"></div>
    <div class="arena"><select id="rbot" aria-label="Bot"></select><select id="rgame" aria-label="Game"></select><button class="btn ghost" id="radd">+ Lane</button><button class="btn ghost" id="rall">All my bots</button><button class="btn" id="rgo">Start race ▸</button></div></div>
  <div class="sec"><h2>Results online</h2><div id="res"><div class="empty">…</div></div></div>
</div>
<script src="../shared/stars.js"></script>
<script>
(function(){
var A=Auto,ICONS=['crown','egg','heart','ball','bolt','shield','flame','coin','leaf','target','hand','gear','dice','star','spiral','sun','drop','moon','trophy','eye','cube','anchor','candle','gem','key','note','flag','cat','skull','bug','fish','bee','bat','moth','tree','flower'];
var STATS=[['rea','Reflex lag','clock'],['acc','Accuracy','target'],['cau','Caution','shield'],['gre','Greed','coin'],['agg','Aggression','sword'],['pat','Patience','leaf'],['mis','Mistakes','dice'],['foc','Focus','eye'],['tem','Tempo','bolt']];
function ic(n,cls){return GK.icoSvg(n,cls||'i')}
var bots=A.bots();if(!bots.length){bots=[mk('ace'),mk('rookie'),mk('pirate')];bots[0].n='Ace';A.saveBots(bots)}
var cur=Math.max(0,bots.findIndex(function(b){return b.n===A.profile.n}));
function mk(pid){var p=A.PRESETS.filter(function(x){return x.id===pid})[0]||A.PRESETS[0];return{n:p.n,p:p.id,i:p.i,c:A.COLORS[A.PRESETS.indexOf(p)%A.COLORS.length],s:Object.assign({},p.s)}}
function save(){A.saveBots(bots);var act=bots.filter(function(b){return b.n===A.profile.n})[0];if(act)A.setProfile(act)}
function uniq(n,skip){var base=n.slice(0,12)||'Bot',name=base,k=2;while(bots.some(function(b,i){return i!==skip&&b.n.toLowerCase()===name.toLowerCase()}))name=base.slice(0,10)+' '+(k++);return name}
/* roster */
function roster(){var el=document.getElementById('roster');el.innerHTML='';bots.forEach(function(b,i){var r=document.createElement('button');r.className='bot'+(i===cur?' sel':'');
    r.innerHTML='<span class="av" style="background:'+b.c+'">'+GK.icoSvg(b.i)+'</span><span><b>'+esc(b.n)+'</b><small>'+esc((A.PRESETS.filter(function(p){return p.id===b.p})[0]||{n:'Custom'}).n)+'</small></span>'+(b.n===A.profile.n?'<span class="tag">Active</span>':'');
    r.onclick=function(){cur=i;draw()};el.appendChild(r)});
  document.getElementById('act').innerHTML='<span class="av" style="width:26px;height:26px;background:'+A.profile.c+'">'+GK.icoSvg(A.profile.i)+'</span>'+esc(A.profile.n)}
function esc(t){var d=document.createElement('span');d.textContent=t;return d.innerHTML}
/* editor */
var shown=null;
function editor(){var b=bots[cur],ed=document.getElementById('ed');ed.innerHTML='';
  var left=document.createElement('div');left.innerHTML='<div class="big" style="background:'+b.c+'">'+GK.icoSvg(b.i)+'</div>';var nm=document.createElement('input');nm.type='text';nm.maxLength=12;nm.value=b.n;nm.setAttribute('aria-label','Bot name');
  nm.onchange=function(){var was=b.n;b.n=uniq(nm.value.trim()||'Bot',cur);if(A.profile.n===was){A.setProfile(b)}save();draw()};left.appendChild(nm);
  var acts=document.createElement('div');acts.className='acts';function act(t,cls,fn){var x=document.createElement('button');x.className='btn '+(cls||'');x.textContent=t;x.onclick=fn;acts.appendChild(x)}
  act(b.n===A.profile.n?'Active ✓':'Make active','',function(){A.setProfile(b);draw()});act('Copy','ghost',function(){if(bots.length>=24)return;var c=JSON.parse(JSON.stringify(b));c.n=uniq(b.n);bots.splice(cur+1,0,c);cur++;save();draw()});
  act('Delete','ghost',function(){if(bots.length<2)return;var wasActive=b.n===A.profile.n;bots.splice(cur,1);cur=Math.max(0,cur-1);if(wasActive)A.setProfile(bots[cur]);save();draw()});left.appendChild(acts);
  var rad=document.createElementNS('http://www.w3.org/2000/svg','svg');rad.setAttribute('viewBox','-110 -110 220 220');rad.setAttribute('class','radar');rad.setAttribute('aria-hidden','true');left.appendChild(rad);ed.appendChild(left);
  var right=document.createElement('div');STATS.forEach(function(st){var row=document.createElement('label');row.className='sl';row.innerHTML=ic(st[2])+'<span>'+st[1]+'</span>';var r=document.createElement('input');r.type='range';r.min=0;r.max=100;r.value=b.s[st[0]];var o=document.createElement('output');o.textContent=b.s[st[0]];
    r.oninput=function(){b.s[st[0]]=+r.value;o.textContent=r.value;b.p='custom';save();roster()};row.append(r,o);right.appendChild(row)});
  right.insertAdjacentHTML('beforeend','<h2 style="margin-top:16px">Look</h2>');var pk=document.createElement('div');pk.className='picks';ICONS.forEach(function(n){var x=document.createElement('button');x.className=n===b.i?'on':'';x.title=n;x.innerHTML=GK.icoSvg(n);x.onclick=function(){b.i=n;save();draw()};pk.appendChild(x)});right.appendChild(pk);
  var cs=document.createElement('div');cs.className='picks';A.COLORS.forEach(function(c){var x=document.createElement('button');x.className='sw'+(c===b.c?' on':'');x.style.background=c;x.title=c;x.onclick=function(){b.c=c;save();draw()};cs.appendChild(x)});right.appendChild(cs);ed.appendChild(right);
  radar(rad,b.s)}
/* the personality chart morphs to its new shape: the page's one motion */
function radar(svg,s){var N=STATS.length,from=shown?Object.assign({},shown):Object.assign({},s),t0=performance.now();
  var grid='';for(var g=1;g<=4;g++){var pts=[];for(var i=0;i<N;i++){var a=-Math.PI/2+i/N*Math.PI*2;pts.push((Math.cos(a)*g*22).toFixed(1)+','+(Math.sin(a)*g*22).toFixed(1))}grid+='<polygon points="'+pts.join(' ')+'" fill="none" stroke="#2b3744" stroke-width="1"/>'}
  STATS.forEach(function(st,i){var a=-Math.PI/2+i/N*Math.PI*2;grid+='<line x1="0" y1="0" x2="'+(Math.cos(a)*88)+'" y2="'+(Math.sin(a)*88)+'" stroke="#2b3744"/><g transform="translate('+(Math.cos(a)*100-9)+','+(Math.sin(a)*100-9)+') scale(.82)" color="#8d9aa5">'+GK.icoSvg(st[2],'').replace('<svg','<svg width="22" height="22"')+'</g>'});
  svg.innerHTML=grid+'<polygon id="pg" fill="#ffb000" fill-opacity=".85" stroke="#efe6d2" stroke-width="2"/>';var pg=svg.querySelector('#pg');
  (function f(){var k=Math.min(1,(performance.now()-t0)/420),e=1-Math.pow(1-k,3),pts=[],cur2={};STATS.forEach(function(st,i){var v=from[st[0]]+(s[st[0]]-from[st[0]])*e;cur2[st[0]]=v;var a=-Math.PI/2+i/N*Math.PI*2,r=8+v*.8;pts.push((Math.cos(a)*r).toFixed(1)+','+(Math.sin(a)*r).toFixed(1))});
    pg.setAttribute('points',pts.join(' '));shown=cur2;if(k<1)requestAnimationFrame(f)})()}
function presets(){var el=document.getElementById('presets');A.PRESETS.forEach(function(p){var b=document.createElement('button');b.className='pre';b.innerHTML=GK.icoSvg(p.i)+'<span>'+p.n+'</span>';
  b.onclick=function(){var bot=bots[cur],keepName=!A.PRESETS.some(function(q){return q.n===bot.n});bot.s=Object.assign({},p.s);bot.p=p.id;bot.i=p.i;if(!keepName){var was=bot.n;bot.n=uniq(p.n,cur);if(A.profile.n===was)A.setProfile(bot)}save();draw();document.getElementById('ed').scrollIntoView({behavior:'smooth',block:'nearest'})};el.appendChild(b)})}
function draw(){roster();editor();if(document.getElementById('rbot'))botOpts()}
document.getElementById('newb').onclick=function(){if(bots.length>=24)return;var p=A.PRESETS[1+Math.floor(Math.random()*(A.PRESETS.length-1))],b=mk(p.id);b.n=uniq(p.n);bots.push(b);cur=bots.length-1;save();draw()};
/* arena: run the active bot in any game */
fetch('../games.json').then(function(r){return r.json()}).then(function(list){GAMES=list;var rg=document.getElementById('rgame');list.forEach(function(g){var o=document.createElement('option');o.value=g.id;o.textContent=g.title;rg.appendChild(o)});lineupDraw();var sel=document.getElementById('game');list.forEach(function(g){var o=document.createElement('option');o.value=g.id;o.textContent=g.title;sel.appendChild(o)});try{var l=localStorage.getItem('galaxicaArena');if(l)sel.value=l}catch(e){}});
document.getElementById('go').onclick=function(){var g=document.getElementById('game').value;try{localStorage.setItem('galaxicaArena',g)}catch(e){}A.setProfile(bots[cur]);A.set(true);location.href='../games/'+g+'/'};
/* race: several bots at once. Each lane is the game in an iframe with ?bot=, which gives it its own profile, muted sound and
   throwaway saves (see auto.js); lanes report scores back here by postMessage. */
var GAMES=[],MAXL=Device.mobile?4:9,lineup=[];try{lineup=JSON.parse(localStorage.getItem('galaxicaRace')||'[]')}catch(e){}
function rsave(){try{localStorage.setItem('galaxicaRace',JSON.stringify(lineup))}catch(e){}}
function gname(id){var g=GAMES.filter(function(x){return x.id===id})[0];return g?g.title:id}
function lineupDraw(){var el=document.getElementById('lineup');el.innerHTML='';if(!lineup.length)el.innerHTML='<div class="empty">0 / '+MAXL+'</div>';
  lineup.forEach(function(l,i){var r=document.createElement('div');r.className='ln';r.innerHTML='<span class="av" style="background:'+l.b.c+'">'+GK.icoSvg(l.b.i)+'</span><span><b>'+esc(l.b.n)+'</b> <small>'+esc(gname(l.g))+'</small></span><span></span>';
    var x=document.createElement('button');x.textContent='×';x.title='Remove';x.onclick=function(){lineup.splice(i,1);rsave();lineupDraw()};r.appendChild(x);el.appendChild(r)});
  document.getElementById('radd').disabled=document.getElementById('rall').disabled=lineup.length>=MAXL;document.getElementById('rgo').disabled=!lineup.length}
function botOpts(){var el=document.getElementById('rbot'),v=el.value;el.innerHTML='';var g1=document.createElement('optgroup');g1.label='Your bots';bots.forEach(function(b,i){var o=document.createElement('option');o.value='b'+i;o.textContent=b.n;g1.appendChild(o)});el.appendChild(g1);
  var g2=document.createElement('optgroup');g2.label='Presets';A.PRESETS.forEach(function(p){var o=document.createElement('option');o.value='p'+p.id;o.textContent=p.n;g2.appendChild(o)});el.appendChild(g2);if(v)el.value=v;if(!el.value)el.value='b'+cur}
function pickBot(v){if(v[0]==='b')return JSON.parse(JSON.stringify(bots[+v.slice(1)]||bots[0]));var b=mk(v.slice(1));b.n=b.n.slice(0,12);return b}
function addLane(b){if(lineup.length>=MAXL)return;lineup.push({b:b,g:document.getElementById('rgame').value});rsave();lineupDraw()}
document.getElementById('radd').onclick=function(){addLane(pickBot(document.getElementById('rbot').value))};
document.getElementById('rall').onclick=function(){bots.forEach(function(b){addLane(JSON.parse(JSON.stringify(b)))})};
var race=null;
function startRace(){if(!lineup.length)return;var sp=1,t0=Date.now(),n=lineup.length,wide=innerWidth>innerHeight;
  var cols=n<2?1:n<=2?(wide?2:1):n<=4?2:3,rows=Math.ceil(n/cols);var R=document.createElement('div');R.className='race';
  R.innerHTML='<div class="rbar px"><button class="btn ghost" id="rstop">← Stop</button><span class="sp"></span><span class="x" id="rclock">0:00</span></div><div class="lanes" style="grid-template-columns:repeat('+cols+',minmax(0,1fr));grid-template-rows:repeat('+rows+',minmax(0,1fr))"></div>';
  var L=R.querySelector('.lanes'),SP=R.querySelector('.sp'),lanes=[];
  [1,2,5,10,20].forEach(function(v){var b=document.createElement('button');b.textContent=v+'×';b.className=v===1?'on':'';b.onclick=function(){sp=v;SP.querySelectorAll('button').forEach(function(x){x.className=x===b?'on':''});lanes.forEach(function(l){try{l.f.contentWindow.postMessage({pin:'speed',v:v},'*')}catch(e){}})};SP.appendChild(b)});
  lineup.forEach(function(l,i){var d=document.createElement('div');d.className='lane';var h=document.createElement('div');h.className='lh';
    h.innerHTML='<span class="rk">–</span><span class="av" style="background:'+l.b.c+'">'+GK.icoSvg(l.b.i)+'</span><span class="nm"><b>'+esc(l.b.n)+'</b> <small>'+esc(gname(l.g))+'</small></span><span class="sc">–</span>';
    var a=document.createElement('a');a.href='../games/'+l.g+'/';a.title='Watch full size';a.innerHTML='<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 3h6v6M17 3l-8 8M8 4H3v13h13v-5"/></svg>';
    a.onclick=function(){A.setProfile(l.b);A.set(true)};h.appendChild(a);
    var f=document.createElement('iframe');f.title=l.b.n+' plays '+gname(l.g);f.src='../games/'+l.g+'/?bot='+encodeURIComponent(JSON.stringify(l.b))+'&lane='+i+'&x=1';
    d.append(h,f);L.appendChild(d);lanes.push({l:l,f:f,h:h,boards:{},first:null,ticks:0})});
  document.body.appendChild(R);document.body.style.overflow='hidden';
  function rank(){var same=lanes.every(function(x){return x.l.g===lanes[0].l.g});lanes.forEach(function(x){x.h.querySelector('.rk').className='rk'});if(!same)return;
    var key=null;lanes.some(function(x){key=x.first;return key});if(!key)return;
    var low=lanes.some(function(x){return x.boards[key]&&x.boards[key].low});
    var sorted=lanes.filter(function(x){return x.boards[key]}).sort(function(p,q){return low?p.boards[key].score-q.boards[key].score:q.boards[key].score-p.boards[key].score});
    lanes.forEach(function(x){var k=sorted.indexOf(x),el=x.h.querySelector('.rk');el.textContent=k<0?'–':(k+1);el.className='rk'+(k===0?' one':'')})}
  function onMsg(e){var d=e.data;if(!d||d.lane==null)return;var x=lanes[+d.lane];if(!x||e.source!==x.f.contentWindow)return;
    if(d.t==='tick'){x.ticks=d.ticks;return}
    if(d.t==='score'){x.boards[d.board]={score:d.score,fmt:d.fmt,low:d.low,ic:d.ic};if(!x.first)x.first=d.board;var sc=x.h.querySelector('.sc'),b=x.boards[x.first];
      sc.innerHTML=(b.ic?'<span class="bi" title="'+esc(x.first)+'">'+GK.icoSvg(b.ic)+'</span>':'')+Online.fmt(b.score,b.fmt);rank()}}
  addEventListener('message',onMsg);
  var clk=setInterval(function(){var s=Math.floor((Date.now()-t0)/1000);document.getElementById('rclock').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},1000);
  function stop(){clearInterval(clk);removeEventListener('message',onMsg);removeEventListener('keydown',key);R.remove();document.body.style.overflow='';race=null;results()}
  function key(e){if(e.key==='Escape')stop()}addEventListener('keydown',key);
  R.querySelector('#rstop').onclick=stop;race={stop:stop}}
document.getElementById('rgo').onclick=startRace;
/* results: where my bots rank on the online boards */
function results(){var el=document.getElementById('res');if(!window.Online){setTimeout(results,300);return}
  fetch('/api/mine?kind=bot&pid='+Online.pid()).then(function(r){return r.json()}).then(function(j){if(!j.rows||!j.rows.length){el.innerHTML='<div class="empty">0</div>';return}
    var t='<table><tr><th></th><th>Bot</th><th>Game</th><th>Board</th><th>Score</th><th>Rank</th></tr>';j.rows.forEach(function(r){t+='<tr><td><span class="av" style="width:24px;height:24px;background:'+(r.bot&&r.bot.c||'#ffb000')+'">'+GK.icoSvg(r.bot&&r.bot.i||'gear')+'</span></td><td>'+esc(r.name)+'</td><td>'+esc(r.game)+'</td><td>'+esc(r.board)+'</td><td>'+(Math.round(r.score*100)/100)+'</td><td class="r">'+r.rank+' / '+r.total+'</td></tr>'});el.innerHTML=t+'</table>'}).catch(function(){el.innerHTML='<div class="empty">offline</div>'})}
presets();draw();botOpts();lineupDraw();results();
})();
</script>
