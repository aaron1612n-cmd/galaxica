<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1114">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap" rel="stylesheet">

<style>
/* Chirp: chalk on a blackboard cave. Slate, chalk white, chalk yellow, one coral. */
:root{--gk-bg:#0e1114;--gk-ink:#eae6da;--gk-acc:#ff5d4a;--gk-font:"Gochi Hand","Comic Sans MS",cursive;--gk-bw:2px;--gk-r:6px 3px 7px 4px;--gk-sh:none;--gk-h:38px}
body{background:#0e1114}
#stage{padding:0}
canvas#c{cursor:none;touch-action:none}
.gk-b{font-size:16px}
.gk-b.gk-auto:not(.ghost){color:#0e1114}
</style>
</head>
<body>
<div id="app"><div id="stage"><canvas id="c"></canvas></div><div id="bar"></div></div>
<script>
GK.id('chirp');
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
var W=480,H=720,TS=16,SLATE='#0e1114',CHALK='#eae6da',YEL='#f2d66b',CORAL='#ff5d4a';
var best=GK.ls.get('best',{level:0,moths:0});
/* ============ cave generation ============ */
var MW=0,MH=0,MAP=null,seen=null,echoes=[],moths=[],spiders=[],owls=[],stalac=[],exitP=null,startP=null,bat=null,cam={x:0,y:0},G=null,mode='title',T=0,rings=[],ptr={x:W/2,y:H/2,down:false},dist=null;
function genCave(level,seed,small){var rn=GK.rng(seed*7919+level);MW=small?24:36+Math.min(30,level*3);MH=small?42:72+Math.min(50,level*5);
  var m=new Uint8Array(MW*MH),i,x,y;for(i=0;i<m.length;i++){x=i%MW;y=(i/MW)|0;m[i]=(x<2||y<2||x>=MW-2||y>=MH-2)?1:(rn()<.46?1:0)}
  for(var it=0;it<5;it++){var n2=new Uint8Array(m.length);for(y=1;y<MH-1;y++)for(x=1;x<MW-1;x++){var c=0;for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++)c+=m[(y+dy)*MW+x+dx];n2[y*MW+x]=(c>=5)?1:0}for(i=0;i<m.length;i++){x=i%MW;y=(i/MW)|0;if(x<2||y<2||x>=MW-2||y>=MH-2)n2[i]=1}m=n2}
  /* guaranteed start room and a winding route to the top */ var sx=(MW/2)|0,sy=MH-6;carve(m,sx,sy,3);var px=sx,py=sy;while(py>5){var step=3+((rn()*3)|0);var tx=GK.clamp(px+(((rn()*2-1)*7)|0),4,MW-5);var ny=py-step;line(m,px,py,tx,ny,2);px=tx;py=ny}carve(m,px,py,3);
  /* flood from start, keep the largest region */ var reach=flood(m,sx,sy);for(i=0;i<m.length;i++)if(!m[i]&&reach[i]<0)m[i]=1;
  var far=0,fp=[sx,sy];for(i=0;i<m.length;i++)if(reach[i]>far&&(i/MW|0)<MH*.35){far=reach[i];fp=[i%MW,(i/MW)|0]}
  MAP=m;dist=reach;startP={x:sx*TS+TS/2,y:sy*TS+TS/2};exitP={x:fp[0]*TS+TS/2,y:fp[1]*TS+TS/2,tx:fp[0],ty:fp[1]};seen=new Uint8Array(m.length);echoes=[];rings=[];
  moths=[];var open=[];for(i=0;i<m.length;i++)if(!m[i]&&reach[i]>14&&Math.hypot(i%MW-sx,(i/MW|0)-sy)>6)open.push(i);
  var nm=Math.max(3,Math.min(26,Math.floor(open.length/90)));for(var k=0;k<nm&&open.length;k++){var oi=open.splice((rn()*open.length)|0,1)[0];moths.push({x:(oi%MW)*TS+TS/2,y:((oi/MW|0))*TS+TS/2,ph:rn()*6,alive:true,seenT:-999})}
  spiders=[];owls=[];stalac=[];if(!small){
    var cand=[];for(y=4;y<MH-8;y++)for(x=3;x<MW-3;x++){if(!m[y*MW+x]&&m[(y-1)*MW+x]&&reach[y*MW+x]>25)cand.push([x,y])}
    var ns=Math.min(10,Math.floor(level*1.5)+(level>1?1:0));for(k=0;k<ns&&cand.length;k++){var c2=cand.splice((rn()*cand.length)|0,1)[0];var len=0;while(!m[(c2[1]+len+1)*MW+c2[0]]&&len<6)len++;if(len>=2)spiders.push({x:c2[0]*TS+TS/2,y0:c2[1]*TS,len:len*TS,ph:rn()*6,seenT:-999,yy:0})}
    var no=level>=3?Math.min(5,level-2):0;for(k=0;k<no;k++){var oi2=open[(rn()*open.length)|0];if(oi2==null)break;owls.push({x:(oi2%MW)*TS+TS/2,y:((oi2/MW|0))*TS+TS/2,vx:rn()<.5?-.8:.8,vy:0,seenT:-999})}
    var nst=Math.min(12,level*2);for(k=0;k<nst&&cand.length;k++){var c3=cand.splice((rn()*cand.length)|0,1)[0];stalac.push({x:c3[0]*TS+TS/2,y:c3[1]*TS+TS-2,y0:c3[1]*TS+TS-2,state:0,t:0,seenT:-999})}}}
function carve(m,cx,cy,r){for(var y=-r;y<=r;y++)for(var x=-r;x<=r;x++){var xx=cx+x,yy=cy+y;if(xx>2&&yy>2&&xx<MW-3&&yy<MH-3)m[yy*MW+xx]=0}}
function line(m,x0,y0,x1,y1,r){var n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0),1);for(var i=0;i<=n;i++)carve(m,Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),r)}
function flood(m,sx,sy){var d=new Int16Array(m.length).fill(-1),q=[sy*MW+sx],h=0;d[q[0]]=0;while(h<q.length){var c=q[h++],x=c%MW,y=(c/MW)|0;[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(o){var xx=x+o[0],yy=y+o[1];if(xx<0||yy<0||xx>=MW||yy>=MH)return;var j=yy*MW+xx;if(!m[j]&&d[j]<0){d[j]=d[c]+1;q.push(j)}})}return d}
function solid(x,y){var tx=Math.floor(x/TS),ty=Math.floor(y/TS);return tx<0||ty<0||tx>=MW||ty>=MH||MAP[ty*MW+tx]===1}
function los(x0,y0,x1,y1){var n=Math.ceil(Math.hypot(x1-x0,y1-y0)/6);for(var i=1;i<n;i++){if(solid(x0+(x1-x0)*i/n,y0+(y1-y0)*i/n))return false}return true}
/* ============ run ============ */
function newRun(){G={level:0,energy:100,moths:0,eaten:0,t:0,hurt:0,chirpCd:0,deadT:0,tut:false,flying:true};nextLevel()}
function nextLevel(small){G.level++;genCave(G.level,G.seedBase=(G.seedBase||((Math.random()*1000)|0)),small);bat={x:startP.x,y:startP.y,vx:0,vy:-.6,a:0,flap:0};cam.x=bat.x-W/2;cam.y=bat.y-H*.6;G.energy=Math.min(100,G.energy+30);G.win=0;mode='play'}
/* ============ input ============ */
GK.pointer(cv,{hover:true,down:function(x,y,e){ptr.x=x;ptr.y=y;ptr.down=true;if(mode==='title'||mode==='over'){if(mode==='over'&&G.deadT<45)return;if(!tut.active)newRun();return}chirp()},move:function(x,y){ptr.x=x;ptr.y=y},up:function(){ptr.down=false},key:function(c,d){if(!d)return;if(c==='Space'){if(mode==='title'||mode==='over'){if(!tut.active)newRun()}else chirp()}}});
var KEYS=GK.keys;
/* ============ echolocation ============ */
function chirp(){if(!G||mode!=='play'||G.chirpCd>0||G.win)return;G.chirpCd=26;G.energy-=1.2;rings.push({x:bat.x,y:bat.y,r:0,t:0});if(tut.active)tutFlag.chirp=1;
  var A=GK.audio;if(A.ctx&&!A.mute&&Speed.v<=2.5){var t=A.ctx.currentTime,o=A.ctx.createOscillator(),g=A.ctx.createGain();o.type='sine';o.frequency.setValueAtTime(5200,t);o.frequency.exponentialRampToValueAtTime(1400,t+.09);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+.1);o.connect(g);g.connect(A.ctx.destination);o.start(t);o.stop(t+.12)}
  /* reveal tiles line-of-sight within range; schedule their light by distance */ var R=15,bx=Math.floor(bat.x/TS),by=Math.floor(bat.y/TS),SP=5.2;
  for(var dy=-R;dy<=R;dy++)for(var dx=-R;dx<=R;dx++){var tx=bx+dx,ty=by+dy;if(tx<0||ty<0||tx>=MW||ty>=MH||MAP[ty*MW+tx]!==1)continue;var d=Math.hypot(dx,dy)*TS;if(d>R*TS)continue;
    /* only wall tiles that touch open space are surfaces */ var surf=false;for(var o2=0;o2<4;o2++){var ox=[1,-1,0,0][o2],oy=[0,0,1,-1][o2],nx=tx+ox,ny=ty+oy;if(nx>=0&&ny>=0&&nx<MW&&ny<MH&&MAP[ny*MW+nx]===0){surf=true;break}}if(!surf)continue;
    /* ray to the tile's centre must hit this tile first */ var cx=tx*TS+TS/2,cy=ty*TS+TS/2;var hit=true,n=Math.ceil(d/5);for(var i=1;i<n;i++){var px=bat.x+(cx-bat.x)*i/n,py=bat.y+(cy-bat.y)*i/n;var ttx=Math.floor(px/TS),tty=Math.floor(py/TS);if(MAP[tty*MW+ttx]===1&&!(ttx===tx&&tty===ty)){hit=false;break}}
    if(hit)echoes.push({tx:tx,ty:ty,t0:T+d/SP,life:110,k:'wall',d:d})}
  /* creatures */ function ping(list,kind){list.forEach(function(o){var d=Math.hypot(o.x-bat.x,o.y-bat.y);if(d<R*TS&&los(bat.x,bat.y,o.x,o.y)){echoes.push({x:o.x,y:o.y+(o.yy||0),t0:T+d/SP,life:130,k:kind,d:d,o:o})}})}
  ping(moths.filter(function(m){return m.alive}),'moth');ping(spiders,'spider');ping(owls,'owl');ping(stalac.filter(function(s){return s.state===0}),'stalac');
  if(Math.hypot(exitP.x-bat.x,exitP.y-bat.y)<R*TS*1.4)echoes.push({x:exitP.x,y:exitP.y,t0:T+Math.hypot(exitP.x-bat.x,exitP.y-bat.y)/SP,life:200,k:'exit',d:0});
  /* the cave answers: a few clicks panned left/right, pitch tells distance */ if(A.ctx&&!A.mute&&Speed.v<=2.5){var ang;for(ang=0;ang<6;ang++){var a=(ang/6)*6.28,rx=Math.cos(a),ry=Math.sin(a),dd=0;while(dd<R*TS&&!solid(bat.x+rx*dd,bat.y+ry*dd))dd+=6;if(dd<R*TS){var delay=dd/SP/60*2;var tt=A.ctx.currentTime+delay,o3=A.ctx.createOscillator(),g3=A.ctx.createGain(),pn=A.ctx.createStereoPanner?A.ctx.createStereoPanner():null;o3.type='triangle';o3.frequency.value=900-dd*2.2;g3.gain.setValueAtTime(.0001,tt);g3.gain.linearRampToValueAtTime(.025*(1-dd/(R*TS)),tt+.004);g3.gain.exponentialRampToValueAtTime(.0001,tt+.06);o3.connect(g3);if(pn){pn.pan.value=Math.max(-1,Math.min(1,rx));g3.connect(pn);pn.connect(A.ctx.destination)}else g3.connect(A.ctx.destination);o3.start(tt);o3.stop(tt+.08)}}}}
/* ============ sim ============ */
function step(){T++;if(mode==='title'){if(Auto.on&&!tut.active)newRun();return}
  if(mode==='over'){G.deadT++;if(Auto.on&&G.deadT>100)newRun();return}if(mode!=='play')return;G.t++;if(G.chirpCd>0)G.chirpCd--;if(G.hurt>0)G.hurt--;
  G.energy-=.012;if(G.energy<=0){die();return}
  if(Auto.on&&!tut.active)botSteer();
  /* steering */ var ax=0,ay=0;
  if(!Auto.on||tut.active){var tx=ptr.x+cam.x,ty=ptr.y+cam.y,dx=tx-bat.x,dy=ty-bat.y,d=Math.hypot(dx,dy);if(d>10){ax=dx/d*.11;ay=dy/d*.11}if(KEYS.ArrowLeft||KEYS.KeyA)ax-=.12;if(KEYS.ArrowRight||KEYS.KeyD)ax+=.12;if(KEYS.ArrowUp||KEYS.KeyW)ay-=.12;if(KEYS.ArrowDown||KEYS.KeyS)ay+=.12}
  else{ax=bot.ax;ay=bot.ay}
  bat.vx=(bat.vx+ax)*.965;bat.vy=(bat.vy+ay+.012)*.965;var sp=Math.hypot(bat.vx,bat.vy);if(sp>2.5){bat.vx*=2.5/sp;bat.vy*=2.5/sp}
  moveBat();bat.flap+=.3;bat.a=Math.atan2(bat.vy,bat.vx);
  cam.x+=(bat.x-W/2-cam.x)*.1;cam.y+=(bat.y-H*.55-cam.y)*.1;cam.x=GK.clamp(cam.x,0,Math.max(0,MW*TS-W));cam.y=GK.clamp(cam.y,0,Math.max(0,MH*TS-H));
  /* moths */ moths.forEach(function(m){if(!m.alive)return;m.ph+=.08;m.x+=Math.sin(m.ph)*.3;m.y+=Math.cos(m.ph*1.3)*.25;if(solid(m.x,m.y)){m.x-=Math.sin(m.ph)*.3;m.y-=Math.cos(m.ph*1.3)*.25}
    if(Math.hypot(m.x-bat.x,m.y-bat.y)<14){m.alive=false;G.eaten++;G.energy=Math.min(100,G.energy+22);GK.audio.tone(1100,.08,'sine',.05);GK.audio.tone(1500,.1,'sine',.04,1,GK.audio.ctx&&GK.audio.ctx.currentTime+.06);if(tut.active)tutFlag.moth=1}});
  /* spiders */ spiders.forEach(function(s){s.ph+=.03;s.yy=(Math.sin(s.ph)*.5+.5)*s.len;if(Math.hypot(s.x-bat.x,(s.y0+s.yy)-bat.y)<11)hurt(25)});
  /* owls patrol */ owls.forEach(function(o){var nx=o.x+o.vx;if(solid(nx+Math.sign(o.vx)*10,o.y)){o.vx=-o.vx}else o.x=nx;var d=Math.hypot(o.x-bat.x,o.y-bat.y);if(d<160&&los(o.x,o.y,bat.x,bat.y)){o.y+=Math.sign(bat.y-o.y)*.3;o.x+=Math.sign(bat.x-o.x)*.25}if(d<14)hurt(30)});
  /* stalactites */ stalac.forEach(function(s){if(s.state===0){if(Math.abs(bat.x-s.x)<14&&bat.y>s.y&&bat.y-s.y<TS*8&&los(s.x,s.y,bat.x,bat.y)){s.state=1;s.t=0}}else if(s.state===1){s.t++;s.x+=Math.sin(s.t*2)*.4;if(s.t>26){s.state=2;s.vy=0}}else if(s.state===2){s.vy+=.35;s.y+=s.vy;if(solid(s.x,s.y+6)||s.y>MH*TS){s.state=3;s.t=0}if(Math.hypot(s.x-bat.x,s.y-bat.y)<11)hurt(30)}else{if(++s.t>400){s.state=0;s.y=s.y0;s.x=Math.round(s.x/TS)*TS+TS/2}}});
  /* exit */ if(Math.hypot(exitP.x-bat.x,exitP.y-bat.y)<22&&!G.win){G.win=1;GK.audio.tone(523,.2,'triangle',.06);[659,784,1047].forEach(function(f,i){GK.audio.tone(f,.3,'triangle',.06,1,GK.audio.ctx&&GK.audio.ctx.currentTime+.12*(i+1))});if(tut.active){tutFlag.exit=1}else{if(G.level>best.level){best.level=G.level;best.moths=G.eaten;GK.ls.set('best',best)}setTimeout(function(){if(G&&mode==='play')nextLevel()},700)}}
  /* rings */ for(var i=rings.length-1;i>=0;i--){var r=rings[i];r.t++;r.r+=5.2;if(r.r>15*TS)rings.splice(i,1)}
  for(i=echoes.length-1;i>=0;i--){var e=echoes[i];if(T-e.t0>e.life)echoes.splice(i,1);else if(T>=e.t0&&e.k==='wall'&&!e.seen){e.seen=1;seen[e.ty*MW+e.tx]=1}}
  tut.tick()}
function moveBat(){var nx=bat.x+bat.vx,ny=bat.y+bat.vy;var r=6;
  if(solid(nx-r,bat.y)||solid(nx+r,bat.y)){bat.vx*=-.5;thud();nx=bat.x}if(solid(nx,ny-r)||solid(nx,ny+r)){bat.vy*=-.5;thud();ny=bat.y}bat.x=nx;bat.y=ny}
function thud(){if(G.hurt>0)return;G.energy-=1.5;GK.audio.tone(90,.1,'triangle',.05,.6)}
function hurt(n){if(G.hurt>0)return;G.energy-=n;G.hurt=70;GK.audio.tone(130,.35,'sawtooth',.06,.4);GK.audio.noise(.2,.1)}
function die(){mode='over';G.deadT=0;if(G.level>best.level||G.eaten>best.moths){best.level=Math.max(best.level,G.level);best.moths=Math.max(best.moths,G.eaten);GK.ls.set('best',best)}GK.audio.tone(140,.7,'sawtooth',.06,.4)}
/* ============ AUTO: knows the map, steers along BFS to moths when hungry, else to the exit ============ */
var bot={ax:0,ay:0,path:null,pt:0,goal:null};
function pathTo(tx,ty){var sx=Math.floor(bat.x/TS),sy=Math.floor(bat.y/TS),d=new Int16Array(MW*MH).fill(-1),par=new Int32Array(MW*MH).fill(-1),q=[ty*MW+tx],h=0;d[q[0]]=0;
  var hazard=new Uint8Array(MW*MH);spiders.forEach(function(s){for(var y=Math.floor(s.y0/TS);y<=Math.floor((s.y0+s.len)/TS);y++)for(var x=-1;x<=1;x++){var xx=Math.floor(s.x/TS)+x;if(xx>=0&&y>=0&&y<MH&&xx<MW)hazard[y*MW+xx]=1}});owls.forEach(function(o){for(var dx=-3;dx<=3;dx++)for(var dy=-2;dy<=2;dy++){var xx=Math.floor(o.x/TS)+dx,yy=Math.floor(o.y/TS)+dy;if(xx>=0&&yy>=0&&xx<MW&&yy<MH)hazard[yy*MW+xx]=1}});stalac.forEach(function(s){if(s.state===0){for(var y=Math.floor(s.y/TS);y<Math.floor(s.y/TS)+8;y++){var xx=Math.floor(s.x/TS);if(y<MH&&MAP[y*MW+xx]===0)hazard[y*MW+xx]=1}}});
  while(h<q.length){var c=q[h++],x=c%MW,y=(c/MW)|0;if(x===sx&&y===sy)break;[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(o){var xx=x+o[0],yy=y+o[1];if(xx<0||yy<0||xx>=MW||yy>=MH)return;var j=yy*MW+xx;if(MAP[j]===0&&d[j]<0&&(!hazard[j]||j===sy*MW+sx)){d[j]=d[c]+1;par[j]=c;q.push(j)}})}
  var cur=sy*MW+sx;if(d[cur]<0)return null;var p=[];while(cur!==q[0]&&cur>=0){cur=par[cur];if(cur<0)break;p.push(cur)}return p}
function botSteer(){if(T%12===0||!bot.path){var goal=null;if(G.energy<55){var best2=null,bd=1e9;moths.forEach(function(m){if(m.alive){var d=Math.hypot(m.x-bat.x,m.y-bat.y);if(d<bd){bd=d;best2=m}}});if(best2)goal=[Math.floor(best2.x/TS),Math.floor(best2.y/TS)]}if(!goal)goal=[exitP.tx,exitP.ty];bot.path=pathTo(goal[0],goal[1])}
  if(T%26===0)chirp();
  var p=bot.path;if(p&&p.length){var tgt=p[Math.min(2,p.length-1)],tx=(tgt%MW)*TS+TS/2,ty=((tgt/MW)|0)*TS+TS/2,dx=tx-bat.x,dy=ty-bat.y,d=Math.hypot(dx,dy)||1;bot.ax=dx/d*.13;bot.ay=dy/d*.13}else{bot.ax=0;bot.ay=-.02}}
/* ============ drawing: chalk ============ */
function jitter(i,a){var v=Math.sin(i*12.9898+Math.floor(T/9)*78.233)*43758.5453;return(v-Math.floor(v)-.5)*a}
function render(){var v=GK.view;ctx.setTransform(v.dpr*v.s,0,0,v.dpr*v.s,0,0);ctx.fillStyle=SLATE;ctx.fillRect(0,0,W,H);
  if(!G){drawTitle();return}
  ctx.save();ctx.translate(-Math.round(cam.x),-Math.round(cam.y));
  /* memory: faint chalk dust where you have heard walls */ var x0=Math.max(0,Math.floor(cam.x/TS)),x1=Math.min(MW-1,Math.ceil((cam.x+W)/TS)),y0=Math.max(0,Math.floor(cam.y/TS)),y1=Math.min(MH-1,Math.ceil((cam.y+H)/TS));
  ctx.fillStyle='rgba(234,230,218,.1)';for(var y=y0;y<=y1;y++)for(var x=x0;x<=x1;x++){if(seen[y*MW+x]){ctx.fillRect(x*TS+3,y*TS+3,TS-6,TS-6)}}
  /* live echoes: brighter chalk outline */ echoes.forEach(function(e,i){if(T<e.t0)return;var a=1-(T-e.t0)/e.life;if(a<=0)return;
    if(e.k==='wall'){ctx.globalAlpha=Math.min(1,a*1.4);ctx.strokeStyle=CHALK;ctx.lineWidth=2.4;ctx.lineJoin='round';var px=e.tx*TS+jitter(i,2),py=e.ty*TS+jitter(i+3,2);ctx.strokeRect(px+1,py+1,TS-2,TS-2);ctx.beginPath();ctx.moveTo(px+3,py+3);ctx.lineTo(px+TS-3,py+TS-3);ctx.stroke();ctx.globalAlpha=1}
    else{ctx.globalAlpha=Math.min(1,a*1.5);var X=e.k==='moth'||e.k==='spider'||e.k==='owl'||e.k==='stalac'?e.o.x:e.x,Y=e.k==='spider'?e.o.y0+e.o.yy:e.k==='moth'||e.k==='owl'||e.k==='stalac'?e.o.y:e.y;X=e.x;Y=e.y;ctx.lineWidth=2.6;ctx.lineCap='round';
      if(e.k==='moth'){ctx.strokeStyle=YEL;ctx.beginPath();ctx.arc(X,Y,5,0,6.3);ctx.moveTo(X-8,Y-4);ctx.lineTo(X-3,Y);ctx.moveTo(X+8,Y-4);ctx.lineTo(X+3,Y);ctx.stroke()}
      else if(e.k==='spider'){ctx.strokeStyle=CORAL;ctx.beginPath();ctx.moveTo(X,e.o.y0);ctx.lineTo(X,Y);ctx.moveTo(X-8,Y+5);ctx.lineTo(X,Y);ctx.lineTo(X+8,Y+5);ctx.moveTo(X-8,Y-5);ctx.lineTo(X,Y);ctx.lineTo(X+8,Y-5);ctx.stroke();ctx.beginPath();ctx.arc(X,Y,4,0,6.3);ctx.stroke()}
      else if(e.k==='owl'){ctx.strokeStyle=CORAL;ctx.beginPath();ctx.ellipse(X,Y,11,9,0,0,6.3);ctx.moveTo(X-5,Y-2);ctx.arc(X-5,Y-2,2,0,6.3);ctx.moveTo(X+7,Y-2);ctx.arc(X+5,Y-2,2,0,6.3);ctx.stroke()}
      else if(e.k==='stalac'){ctx.strokeStyle=CORAL;ctx.beginPath();ctx.moveTo(X-5,Y-8);ctx.lineTo(X,Y+6);ctx.lineTo(X+5,Y-8);ctx.stroke()}
      else if(e.k==='exit'){ctx.strokeStyle=YEL;ctx.lineWidth=3;ctx.beginPath();ctx.arc(X,Y,12+Math.sin(T*.2)*2,0,6.3);ctx.stroke();ctx.beginPath();ctx.arc(X,Y,5,0,6.3);ctx.stroke()}
      ctx.globalAlpha=1}});
  /* falling stalactites are heard as streaks */ stalac.forEach(function(s){if(s.state===2||s.state===1){ctx.strokeStyle=CORAL;ctx.lineWidth=2.4;ctx.globalAlpha=.55;ctx.beginPath();ctx.moveTo(s.x-4,s.y-8);ctx.lineTo(s.x,s.y+5);ctx.lineTo(s.x+4,s.y-8);ctx.stroke();ctx.globalAlpha=1}});
  /* rings */ rings.forEach(function(r){ctx.strokeStyle='rgba(234,230,218,'+(1-r.r/(15*TS))*.5+')';ctx.lineWidth=2;ctx.beginPath();for(var a=0;a<=24;a++){var ang=a/24*6.28,rr=r.r+jitter(a+r.t,3);var px=r.x+Math.cos(ang)*rr,py=r.y+Math.sin(ang)*rr;a?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.stroke()});
  drawBat();
  ctx.restore();
  /* hud: energy as a chalk line, moths */ ctx.strokeStyle='rgba(234,230,218,.25)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(16,H-18);ctx.lineTo(W-16,H-18);ctx.stroke();ctx.strokeStyle=G.energy<25?CORAL:CHALK;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(16,H-18);ctx.lineTo(16+(W-32)*Math.max(0,G.energy)/100,H-18);ctx.stroke();
  ctx.fillStyle=CHALK;ctx.font='28px "Gochi Hand"';ctx.textAlign='left';ctx.fillText(String(G.level),16,36);ctx.fillStyle=YEL;ctx.textAlign='right';ctx.fillText(String(G.eaten),W-16,36);
  /* cursor */ if(!Auto.on){ctx.strokeStyle=CHALK;ctx.lineWidth=2;ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(ptr.x,ptr.y,8,0,6.3);ctx.stroke();ctx.globalAlpha=1}
  if(G.chirpCd>0&&mode==='play'){ctx.strokeStyle='rgba(234,230,218,.35)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(W/2,H-50,10,-Math.PI/2,-Math.PI/2+6.28*(1-G.chirpCd/26));ctx.stroke()}
  if(mode==='over'){ctx.fillStyle='rgba(14,17,20,'+Math.min(.8,G.deadT/40)+')';ctx.fillRect(0,0,W,H);ctx.fillStyle=CHALK;ctx.font='100px "Gochi Hand"';ctx.textAlign='center';ctx.fillText(String(G.level),W/2,H/2);ctx.fillStyle=YEL;ctx.font='40px "Gochi Hand"';ctx.fillText(String(G.eaten),W/2,H/2+50)}
  if(tut.active)tutDraw()}
function drawBat(){var hb=G.hurt>0&&Math.floor(G.hurt/4)%2;if(hb)return;ctx.save();ctx.translate(bat.x,bat.y);ctx.strokeStyle=CHALK;ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';var f=Math.sin(bat.flap)*7;
  ctx.fillStyle=SLATE;ctx.beginPath();ctx.ellipse(0,0,6,4.5,0,0,6.3);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-2,-3);ctx.quadraticCurveTo(-12,-10-f,-20,-4-f*.6);ctx.lineTo(-13,-2);ctx.lineTo(-8,2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-2,3);ctx.quadraticCurveTo(-12,10+f,-20,4+f*.6);ctx.lineTo(-13,2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(4,-3);ctx.lineTo(7,-8);ctx.lineTo(8,-2);ctx.stroke();ctx.restore()}
function drawTitle(){var t=T;ctx.save();ctx.translate(W/2,H/2);ctx.strokeStyle=CHALK;ctx.lineWidth=2.4;for(var k=1;k<=3;k++){ctx.globalAlpha=1-((t*.02+k*.3)%1);ctx.beginPath();ctx.arc(0,0,((t*.8+k*50)%160),0,6.3);ctx.stroke()}ctx.globalAlpha=1;ctx.restore();
  var f=Math.sin(t*.2)*7;ctx.save();ctx.translate(W/2,H/2);ctx.strokeStyle=CHALK;ctx.lineWidth=2.4;ctx.beginPath();ctx.ellipse(0,0,6,4.5,0,0,6.3);ctx.stroke();ctx.beginPath();ctx.moveTo(-2,-3);ctx.quadraticCurveTo(-12,-10-f,-20,-4);ctx.stroke();ctx.beginPath();ctx.moveTo(2,-3);ctx.quadraticCurveTo(12,-10-f,20,-4);ctx.stroke();ctx.restore();
  ctx.fillStyle=CHALK;ctx.font='40px "Gochi Hand"';ctx.textAlign='center';ctx.fillText(best.level+' · '+best.moths,W/2,H-120);if(Auto.on&&!tut.active)newRun()}
/* ============ tutorial ============ */
var tutFlag={chirp:0,moth:0,exit:0};
var tut=GK.tutorial({parent:document.getElementById('stage'),onStart:function(){G={level:0,energy:100,moths:0,eaten:0,t:0,hurt:0,chirpCd:0,deadT:0,tut:true};G.level=1;genCave(1,3,true);moths=moths.slice(0,1);bat={x:startP.x,y:startP.y,vx:0,vy:-.6,a:0,flap:0};cam.x=0;cam.y=bat.y-H*.6;tutFlag={chirp:0,moth:0,exit:0};mode='play';G.energy=100},onEnd:function(){mode='title';G=null},
  steps:[{done:function(){return tutFlag.chirp}},{done:function(){return tutFlag.moth||moths.every(function(m){return!m.alive})}},{done:function(){return tutFlag.exit}}]});
function tutDraw(){var t=tut.t;ctx.save();ctx.translate(-Math.round(cam.x),-Math.round(cam.y));if(tut.i===0)GK.pulse(ctx,bat.x,bat.y,t,CORAL,12);else if(tut.i===1){var m=moths.find(function(m){return m.alive});if(m){var seenM=echoes.some(function(e){return e.k==='moth'});if(seenM)GK.pulse(ctx,m.x,m.y,t,YEL,10);else GK.pulse(ctx,bat.x,bat.y,t,CORAL,12)}}else GK.pulse(ctx,exitP.x,exitP.y,t,YEL,14);ctx.restore()}
/* ============ bar ============ */
var R=GK.controls(document.getElementById('bar'),{onHelp:function(){tut.start()},extra:[
  {id:'ch',html:'<svg viewBox="0 0 22 22"><path d="M5 11c0-4 3-6 6-6M5 11c0 4 3 6 6 6M8 11c0-2 1-3 3-3M8 11c0 2 1 3 3 3"/></svg>',title:'Chirp (Space)',fn:function(){chirp()}},
  {id:'rs',html:GK.icon('restart'),title:'New cave',fn:function(){if(!tut.active)newRun()}}]});
function fit(){GK.fit(cv,stage,W,H,1.4)}addEventListener('resize',fit);addEventListener('orientationchange',fit);fit();
GK.loop(step,render);tut.maybe();
window.__g={stats:function(){return G?{mode:mode,level:G.level,energy:Math.round(G.energy),eaten:G.eaten,best:best.level,tut:tut.active,moths:moths.filter(function(m){return m.alive}).length,echoes:echoes.length}:{mode:mode}},tut:tut,newRun:function(){newRun()}};
</script>
