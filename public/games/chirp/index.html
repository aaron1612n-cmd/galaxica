  var m=new Uint8Array(MW*MH),i,x,y;for(i=0;i<m.length;i++){x=i%MW;y=(i/MW)|0;m[i]=(x<2||y<2||x>=MW-2||y>=MH-2)?1:(rn()<.46?1:0)}

    var ns=Math.min(10,Math.floor(level*1.5)+(level>1?1:0));for(k=0;k<ns&&cand.length;k++){var c2=cand.splice((rn()*cand.length)|0,1)[0];var len=0;while(!m[(c2[1]+len+1)*MW+c2[0]]&&len<6)len++;if(len>=2)spiders.push({x:c2[0]*TS+TS/2,y0:c2[1]*TS,len:len*TS,ph:rn()*6,seenT:-999,yy:0})}

  for(var i=0;i<G.pick.length;i++){var k=G.pick[i],x=cardX(i),y=260+(1-e)*50,lv=pk(k);ctx.save();ctx.translate(x+64,y+90);ctx.strokeStyle=G.sel===i?YEL:CHALK;ctx.lineWidth=G.sel===i?3.4:2.4;ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(-64+jitter(i,3),-90);ctx.lineTo(64,-90+jitter(i+1,3));ctx.lineTo(64+jitter(i+2,3),90);ctx.lineTo(-64,90+jitter(i+3,3));ctx.closePath();ctx.stroke();

function nextLevel(small){if(MODE==='daily'&&G.level>=5&&!G.tut){G.done=1;die();return}G.level++;G.lvlHurt=0;genCave(MODE==='feast'?6:G.level,G.seedBase=(G.seedBase||((Math.random()*1000)|0)),small);if(MODE==='feast'){crystals=[];stalac=[]}bat={x:startP.x,y:startP.y,vx:0,vy:-.6,a:0,flap:0};cam.x=bat.x-W/2;cam.y=bat.y-H*.6;G.energy=Math.min(100,G.energy+30);G.win=0;mode='play'}
/* ============ input ============ */
var stick=GK.stick(50),touchUsed=false;GK.pointer(cv,{hover:true,down:function(x,y,e){if(e.pointerType!=='mouse'){touchUsed=true;if(mode==='play'){stick.down(x,y);return}}ptr.x=x;ptr.y=y;ptr.down=true;if(mode==='pick'){clickPick(x,y);return}if(mode==='title'||mode==='over'){if(mode==='over'&&G.deadT<45)return;if(!tut.active)newRun();return}chirp()},move:function(x,y){if(stick.on){stick.move(x,y);return}ptr.x=x;ptr.y=y},up:function(){if(stick.on){if(stick.up())chirp();return}ptr.down=false},key:function(c,d){if(!d)return;if(mode==='pick'){var n=c==='Digit1'?0:c==='Digit2'?1:c==='Digit3'?2:-1;if(c==='ArrowLeft'||c==='KeyA')G.sel=(G.sel+G.pick.length-1)%G.pick.length;if(c==='ArrowRight'||c==='KeyD')G.sel=(G.sel+1)%G.pick.length;if(c==='Space'||c==='Enter')n=G.sel;if(n>=0&&G.pick[n]&&G.pickT>25)choose(G.pick[n]);return}if(c==='Space'){if(mode==='title'||mode==='over'){if(!tut.active)newRun()}else chirp()}}});
var KEYS=GK.keys;
/* ============ echolocation ============ */
function chirp(free){if(!G||mode!=='play'||(G.chirpCd>0&&!free)||G.win)return;if(!free){G.chirpCd=26-5*pk('quick');if(MODE!=='feast')G.energy-=1.2}rings.push({x:bat.x,y:bat.y,r:0,t:0});if(tut.active)tutFlag.chirp=1;
  var A=GK.audio;if(A.ctx&&!A.mute&&Speed.v<=2.5){var t=A.ctx.currentTime,o=A.ctx.createOscillator(),g=A.ctx.createGain();o.type='sine';o.frequency.setValueAtTime(5200,t);o.frequency.exponentialRampToValueAtTime(1400,t+.09);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+.1);o.connect(g);g.connect(A.ctx.destination);o.start(t);o.stop(t+.12)}
  /* reveal tiles line-of-sight within range; schedule their light by distance */ var R=chirpR(),LF=(MODE==='dark'?.5:1)*(1+.35*pk('glow')),bx=Math.floor(bat.x/TS),by=Math.floor(bat.y/TS),SP=5.2;
  for(var dy=-R;dy<=R;dy++)for(var dx=-R;dx<=R;dx++){var tx=bx+dx,ty=by+dy;if(tx<0||ty<0||tx>=MW||ty>=MH||MAP[ty*MW+tx]!==1)continue;var d=Math.hypot(dx,dy)*TS;if(d>R*TS)continue;
    /* only wall tiles that touch open space are surfaces */ var surf=false;for(var o2=0;o2<4;o2++){var ox=[1,-1,0,0][o2],oy=[0,0,1,-1][o2],nx=tx+ox,ny=ty+oy;if(nx>=0&&ny>=0&&nx<MW&&ny<MH&&MAP[ny*MW+nx]===0){surf=true;break}}if(!surf)continue;
    /* ray to the tile's centre must hit this tile first */ var cx=tx*TS+TS/2,cy=ty*TS+TS/2;var hit=true,n=Math.ceil(d/5);for(var i=1;i<n;i++){var px=bat.x+(cx-bat.x)*i/n,py=bat.y+(cy-bat.y)*i/n;var ttx=Math.floor(px/TS),tty=Math.floor(py/TS);if(MAP[tty*MW+ttx]===1&&!(ttx===tx&&tty===ty)){hit=false;break}}

/* ============ sim ============ */
