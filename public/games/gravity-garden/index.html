<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#eee6d1">
<meta name="mobile-web-app-capable" content="yes">
<title>Gravity Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="../../shared/device.js"></script>
<script src="../../shared/auto.js"></script>
<script src="../../shared/speed.js"></script>
<style>
/* Gravity Garden: an orrery plate. Paper, ink, one rust accent (themes swap the three). Hairlines, no glow. */
:root{--paper:#eee6d1;--ink:#1c2233;--rust:#cf4a2c;--dim:#7b7a70;--rule:rgba(28,34,51,.14);
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;--mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font:12px/1.4 var(--mono);overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:var(--ink);background:transparent;cursor:pointer;padding:0;border-radius:0}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{position:relative;min-width:0;min-height:0;border-right:1px solid var(--ink);overflow:hidden}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#side{display:flex;flex-direction:column;min-height:0;overflow-y:auto;overflow-x:hidden}
.sec{padding:12px 16px;border-bottom:1px solid var(--rule)}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-bottom:6px}
h1{font:italic 400 40px/.88 var(--serif);margin:0;letter-spacing:-.01em}
h1 span{display:block;font-style:normal;color:var(--rust);padding-left:.8em}
#spark{width:84px;height:34px;display:block}
.ledger{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);margin-top:8px}
.ledger div{padding:5px 0 2px;border-bottom:1px solid var(--rule)}
.ledger span{display:block;color:var(--dim);font-size:10px;letter-spacing:.04em}
.ledger b{font:400 25px/1 var(--serif);font-variant-numeric:tabular-nums}
.ib{display:flex;align-items:center;justify-content:center;height:40px;min-width:0;border:1px solid var(--ink);text-decoration:none;color:var(--ink);position:relative}
.ib svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.ib svg .f{fill:currentColor;stroke:none}
.ib:hover:not(.sel):not(.on){background:var(--rule)}
.ib.sel,.ib.on{background:var(--ink);color:var(--paper)}
.ib:focus-visible,.tl:focus-visible,.spd input:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.ib .x{display:none}.ib.off .x{display:inline}.ib.off .w{display:none}
.ib .pl{display:none}.ib.paused .pl{display:inline}.ib.paused .pa{display:none}
.ib.q{font:italic 400 24px/1 var(--serif)}
.ib.auto{font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.ib.auto:not(.ghost){background:var(--rust);border-color:var(--rust);color:var(--paper)}
.ib .dot{position:absolute;top:3px;right:3px;width:6px;height:6px;background:var(--rust)}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--ink)}
#tabs .ib{border:0;border-right:1px solid var(--ink);height:38px}#tabs .ib:last-child{border-right:0}
#pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:10px}
.tl{height:50px;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;position:relative}
.tl canvas{width:34px;height:34px;display:block;pointer-events:none}
.tl svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.tl:hover{border-color:var(--ink)}
.tl.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--rule)}
.tl i{position:absolute;left:3px;bottom:1px;font:normal 9px var(--mono);color:var(--dim)}
#sizes{display:flex;gap:6px;margin-top:8px}
#sizes .ib{flex:1;height:30px}
#sizes svg{width:22px;height:22px}
.rows{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rows+.rows{margin-top:6px}
.spd{display:flex;align-items:center;gap:4px;grid-column:1/-1;min-width:0;padding:3px;border:1px solid transparent}
.spd input{width:48px;height:32px;background:transparent;color:var(--ink);border:1px solid var(--ink);font:500 12px var(--mono);text-align:center;padding:0;border-radius:0}
.spd b{color:var(--dim);font-weight:400;margin-right:auto}
.spd .btn{height:32px;padding:0 6px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:500 11px var(--mono)}
.spd .btn:not(.ghost){background:var(--ink);color:var(--paper)}
.spd.nudge{border-color:var(--rust);animation:nud .9s steps(1) infinite}
@keyframes nud{50%{border-color:transparent}}
.back{margin:auto 16px 14px;padding-top:10px;font:italic 400 20px var(--serif);color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink);align-self:flex-start}
#skip{position:absolute;right:14px;bottom:14px;height:36px;padding:0 14px;border:1px solid var(--ink);background:var(--paper);font:italic 400 20px var(--serif)}
#mini{display:none;position:absolute;left:12px;top:10px;pointer-events:none;font:italic 400 22px/1 var(--serif)}
#mini b{font-weight:400;color:var(--rust)}
/* inspector */
#insp{position:absolute;top:12px;right:12px;width:236px;background:var(--paper);border:1px solid var(--ink);padding:10px 12px;display:flex;flex-direction:column;gap:7px}
#insp[hidden]{display:none}
#insp .top{display:flex;gap:10px;align-items:center}
#insp canvas.gl{width:54px;height:54px;flex:none;border:1px solid var(--rule)}
#insp .nm{font:italic 400 24px/1 var(--serif)}
#insp .sub{color:var(--dim);font-size:11px}
#insp .pips{display:flex;gap:3px}#insp .pips i{width:14px;height:6px;border:1px solid var(--ink)}#insp .pips i.on{background:var(--rust);border-color:var(--rust)}
#insp .kv{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:11px}#insp .kv span{color:var(--dim)}#insp .kv b{font-weight:500;text-align:right}
#insp .bar{height:6px;border:1px solid var(--ink);position:relative}#insp .bar i{position:absolute;inset:0 auto 0 0;background:var(--rust)}#insp .bar u{position:absolute;top:-3px;bottom:-3px;border-left:1px solid var(--ink);border-right:1px solid var(--ink);background:var(--rule)}
#insp .sp{display:flex;gap:8px;align-items:center;border-top:1px solid var(--rule);padding-top:6px}#insp .sp canvas{width:48px;height:34px}
#insp .acts{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}#insp .acts .ib{height:32px}
/* modals */
.modal{position:fixed;inset:0;z-index:20;background:rgba(20,22,30,.45);display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px 14px}
.modal[hidden]{display:none}
.sheet{background:var(--paper);border:1px solid var(--ink);width:min(760px,100%);max-height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:6px 6px 0 var(--ink)}
.sheet h2{font:italic 400 30px/1 var(--serif);margin:0;display:flex;justify-content:space-between;align-items:center}
.sheet h2 .ib{height:34px;width:34px;font:400 22px var(--serif)}
.grid{display:grid;gap:8px}
.pre{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.pre button{border:1px solid var(--rule);padding:6px;display:flex;flex-direction:column;gap:4px;align-items:center;font:italic 400 17px/1 var(--serif)}
.pre button:hover{border-color:var(--ink);background:var(--rule)}.pre canvas{width:100%;aspect-ratio:1;display:block}
.stamps{grid-template-columns:repeat(auto-fill,minmax(66px,1fr))}
.stamp{aspect-ratio:1;border:1px dashed var(--rule);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--dim)}
.stamp svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.stamp b{font:400 18px/1 var(--serif)}
.stamp.got{border:1px solid var(--rust);color:var(--rust)}
.slots{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.slot{border:1px solid var(--ink);padding:6px;display:flex;flex-direction:column;gap:6px}
.slot canvas,.slot .none{width:100%;aspect-ratio:4/3;border:1px solid var(--rule);display:block}
.slot .r{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.slot .ib{height:30px}
textarea{width:100%;height:70px;background:transparent;color:var(--ink);border:1px solid var(--ink);font:11px var(--mono);padding:6px;resize:none;user-select:text;-webkit-user-select:text}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input[type=text]{height:34px;width:130px;background:transparent;color:var(--ink);border:1px solid var(--ink);font:500 13px var(--mono);padding:0 8px;border-radius:0;user-select:text;-webkit-user-select:text}
.tg{grid-template-columns:repeat(auto-fill,minmax(54px,1fr))}.tg .ib{height:50px}
.sw{width:50px;height:50px;border:1px solid var(--ink);padding:5px}.sw i{display:block;width:100%;height:100%;border:1px solid var(--ink)}
.sw.sel{box-shadow:inset 0 0 0 2px var(--rust)}
#cx{width:100%;height:auto;display:block;border:1px solid var(--rule);touch-action:manipulation}
#cxi{min-height:34px;font:italic 400 20px/1.2 var(--serif)}
.dim{color:var(--dim)}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:5}
.tst{display:flex;align-items:center;gap:8px;background:var(--rust);color:var(--paper);padding:6px 12px 6px 8px;animation:st 2.8s steps(1) forwards;font:400 24px/1 var(--serif)}
.tst svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
@keyframes st{0%{transform:scale(.4) rotate(-6deg);opacity:0}8%{transform:scale(1.15) rotate(2deg);opacity:1}14%{transform:scale(1) rotate(0)}90%{opacity:1}100%{opacity:0}}
@media(max-width:760px),(max-aspect-ratio:1/1){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  #stage{border-right:0;border-bottom:1px solid var(--ink)}
  #side{overflow:visible;flex-direction:column}
  .hdr,.ledger,.back{display:none}
  .sec{padding:6px 8px;border:0}
  #pal{display:flex;overflow-x:auto;gap:5px;margin-top:6px;padding-bottom:2px;scrollbar-width:none}
  .tl{flex:0 0 46px;height:46px}
  #sizes{margin-top:6px}#sizes .ib{height:26px}
  .rows{grid-template-columns:repeat(6,1fr)}
  .ib{height:38px}
  #mini{display:block}
  #insp{top:38px;left:8px;right:8px;width:auto;padding:8px 10px}#insp .kv,#insp .sp,#insp .bar{display:none}#insp .acts .ib{height:34px}
  #r3{display:flex;gap:6px}#r3 .auto{width:64px;flex:none}#r3 .spd{flex:1}
  .sheet{padding:12px}
}
@media(max-height:520px) and (min-aspect-ratio:1/1){
  #app{grid-template-columns:minmax(0,1fr) 250px}.hdr,.ledger{display:none}#mini{display:block}#pal{grid-template-columns:repeat(auto-fill,minmax(40px,1fr))}.tl{height:42px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="c"></canvas><div id="mini">Gravity Garden · <b id="mb">0</b></div><div id="toast"></div><div id="insp" hidden></div><button id="skip" hidden>skip</button></div>
  <aside id="side">
    <div class="sec">
      <div class="hdr"><h1>Gravity<span>Garden</span></h1><canvas id="spark"></canvas></div>
      <div class="ledger"><div><span>planets</span><b id="lp">0</b></div><div><span>garden</span><b id="lb">0</b></div><div><span>best</span><b id="lbest">0</b></div><div><span>years</span><b id="lage">0</b></div></div>
    </div>
    <div class="sec"><div id="tabs"></div><div id="pal"></div><div id="sizes"></div></div>
    <div class="sec"><div class="rows" id="r1"></div><div class="rows" id="r2"></div><div class="rows" id="r3"><span data-speed></span></div></div>
    <a class="back" href="../../">&larr; arcade</a>
  </aside>
</div>
<div id="modals"></div>
<script src="gg-core.js"></script>
<script src="gg-view.js"></script>
<script src="gg-ui.js"></script>
</body>
</html>
