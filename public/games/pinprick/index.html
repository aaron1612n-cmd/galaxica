<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1016">
<meta name="mobile-web-app-capable" content="yes">
<title>Pinprick</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/theme.css">
<script src="../../shared/device.js"></script>
<script src="../../shared/auto.js"></script>
<script src="../../shared/speed.js"></script>
<script src="../../shared/kit.js"></script>
</head>
<body>
<script>
var W=480,H=640,SP=5,FOC=2,CS=5,LIVES=[3,1,1],DM=[.65,1,1.4];
var K=Kit.mount({W:W,H:H,pad:true,
  nav:[{label:'Menu',title:'Back to menu',fn:function(){tut=null;K.showSkip(false);toMenu()}},{label:'Restart',title:'Restart this run',fn:function(){if(state==='play'&&!tut)newRun()}}],
  tutStart:function(){startTut()},tutSkip:function(){endTut()}});
var ctx=K.ctx,keys=Kit.keys,cv=K.cv;
K.pad.innerHTML='<div class="grp"></div><div class="grp"><button class="pb" id="bSlow" title="Hold to move slowly">SLOW</button></div>';
var bSlow=document.getElementById('bSlow');Kit.holdBtn(bSlow,'Slow');
var state='menu',diff=Kit.lsGet('pinDiff',1),s=null,tut=null,seen=Kit.lsGet('pinTut',0),touch=null,anchor=null,menuWait=0,t=0;
function best(d){return Kit.lsGet('pinBest'+d,0)}
function fmt(f){var sec=f/60;return Math.floor(sec/60)+':'+('0'+(sec%60).toFixed(1)).slice(-4)}

/* ---------- run ---------- */
function blank(){return{t:0,x:240,y:550,b:[],lives:LIVES[diff],ic:0,graze:0,a1:0,a2:0,a3:0,moved:0,focused:0,overT:0,rank:0,bestSaved:false}}
function newRun(){s=blank();state='play';touch=null;anchor=null;plan=null}
function toMenu(){s=blank();state='menu';tut=null}
function startTut(){s=blank();state='play';tut={k:0,t:0};plan=null;K.showSkip(true)}
function endTut(){tut=null;K.showSkip(false);Kit.lsSet('pinTut',1);seen=1;toMenu()}
function mk(x,y,ang,sp,r,c){if(s.b.length<1100)s.b.push({x:x,y:y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,ax:0,ay:0,r:r,c:c,g:0})}
function level(){return Math.min(8,Math.floor(s.t/900))}
function emit(){
  var tt=s.t,L=level(),dm=DM[diff];
  if(tut){if(tut.k===2&&tt%7===0){s.a1+=.21;mk(W/2,70,s.a1,1.6,4,'#ffb000');mk(W/2,70,s.a1+Math.PI,1.6,4,'#ffb000')}return}
  if(tt%Math.max(2,Math.round(4/dm))===0){s.a1+=.19;for(var arm=0;arm<2;arm++)mk(W/2,70,s.a1+arm*Math.PI,2+L*.08,4,'#ffb000')}
  if(L>=1&&tt%Math.round(70/dm)===0){var rx=100+Math.random()*280;for(var i=0;i<20;i++)mk(rx,90,i/20*6.2832+s.a2,1.8,4,'#ff5a36');s.a2+=.3}
  if(L>=2&&tt%Math.round(60/dm)===0){var a0=Math.atan2(s.y-70,s.x-W/2);for(var j=-3;j<=3;j++)mk(W/2,70,a0+j*.12,3,3,'#efe6d2')}
  if(L>=3&&tt%Math.round(40/dm)===0){var gc=W/2+Math.sin(tt/110)*150,gw=Math.max(64,92-L*4);for(var x=8;x<W;x+=16)if(Math.abs(x-gc)>gw/2&&s.b.length<1100)s.b.push({x:x,y:-8,vx:0,vy:2.2,ax:0,ay:0,r:5,c:'#6ec3c9',g:0})}
  if(L>=4&&Math.random()<.22*dm*(1+(L-4)/3)&&s.b.length<1100)s.b.push({x:Math.random()*W,y:-8,vx:0,vy:1.2,ax:0,ay:.03,r:3,c:'#8d9aa5',g:0});
  if(L>=5&&tt%Math.max(3,Math.round(6/dm))===0){s.a3-=.23;mk(W/2,70,s.a3,2.4,3,'#6ec3c9')}
}

/* ---------- bot: time-expanded reachability planner over exact bullet trajectories ---------- */
var GW=Math.floor(W/CS)+1,GH=Math.floor(H/CS)+1,NC=GW*GH,KH=34;
var X0=2,X1=Math.floor((W-10)/CS),Y0=30,Y1=Math.floor((H-15)/CS);
var safe=new Uint8Array(KH*NC),par=new Uint8Array(KH*NC),vis=new Int32Array(NC),curL=new Int32Array(NC),nxtL=new Int32Array(NC),plan=null,planIdx=0;
var MV=[];for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++)MV.push([dx,dy]);
function makePlan(){
  safe.fill(0);
  for(var i=0;i<s.b.length;i++){var b=s.b[i],R=(b.r+3)*1.4143+2,rc=Math.ceil(R/CS);
    for(var k=1;k<=KH;k++){var bx=b.x+b.vx*k+b.ax*k*(k+1)/2,by=b.y+b.vy*k+b.ay*k*(k+1)/2;
      if(bx<-R||bx>W+R||by<-R||by>H+R)continue;
      var c0=Math.max(X0,Math.floor((bx-R)/CS)),c1=Math.min(X1,Math.ceil((bx+R)/CS)),r0=Math.max(Y0,Math.floor((by-R)/CS)),r1=Math.min(Y1,Math.ceil((by+R)/CS)),base=(k-1)*NC;
      for(var cy=r0;cy<=r1;cy++){var ddy=cy*CS-by;for(var cx=c0;cx<=c1;cx++){var ddx=cx*CS-bx;if(ddx*ddx+ddy*ddy<R*R)safe[base+cy*GW+cx]=1}}}}
  var sx=Math.max(X0,Math.min(X1,Math.round(s.x/CS))),sy=Math.max(Y0,Math.min(Y1,Math.round(s.y/CS))),n=1,deep=0,stamp=1;
  curL[0]=sy*GW+sx;vis.fill(0);
  for(var t=1;t<=KH;t++){var m=0,base2=(t-1)*NC;stamp++;
    for(var q=0;q<n;q++){var c=curL[q],cx2=c%GW,cy2=(c/GW)|0;
      for(var mi=0;mi<9;mi++){var nx=cx2+MV[mi][0],ny=cy2+MV[mi][1];if(nx<X0||nx>X1||ny<Y0||ny>Y1)continue;var nc=ny*GW+nx;
        if(vis[nc]===stamp||safe[base2+nc])continue;vis[nc]=stamp;par[base2+nc]=mi;nxtL[m++]=nc}}
    if(!m)break;deep=t;var tmp=curL;curL=nxtL;nxtL=tmp;n=m}
  if(!deep)return null;
  var bestC=curL[0],bestS=1e9,sb=(deep-1)*NC;
  for(var q2=0;q2<n;q2++){var c2=curL[q2],cx3=c2%GW,cy3=(c2/GW)|0,clear=0;
    for(var yy=-3;yy<=3;yy++)for(var xx=-3;xx<=3;xx++){var qx=cx3+xx,qy=cy3+yy;if(qx<X0||qx>X1||qy<Y0||qy>Y1)continue;if(!safe[sb+qy*GW+qx])clear++}
    var sc=-clear+.004*Math.hypot(cx3*CS-W/2,cy3*CS-(H-110));if(sc<bestS){bestS=sc;bestC=c2}}
  var moves=new Array(deep),cc=bestC;
  for(var t2=deep;t2>=1;t2--){var mm=par[(t2-1)*NC+cc];moves[t2-1]=mm;cc-=MV[mm][1]*GW+MV[mm][0]}
  return moves}
function botMove(){
  if(!plan||planIdx>=Math.min(4,plan.length)){plan=makePlan();planIdx=0}
  if(!plan)return[0,0];var m=MV[plan[planIdx++]];return m}

/* ---------- tick ---------- */
var HAND=['...XX...','...XX...','...XX...','.XXXXXX.','XXXXXXXX','XXXXXXXX','.XXXXXX.','..XXXX..'];
function tick(){
  t++;
  if(Auto.on&&tut)endTut();
  if(state==='menu'){if(Auto.on&&++menuWait>45){menuWait=0;newRun()}return}
  if(state==='over'){s.overT++;if(Auto.on&&s.overT>100)toMenu();return}
  s.t++;
  var focus=keys.ShiftLeft||keys.ShiftRight||keys.Slow,ax=0,ay=0,spd=focus?FOC:SP;
  if(Auto.on&&!tut){var mv=botMove();ax=mv[0];ay=mv[1];spd=SP}
  else{ax=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);ay=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0)}
  var ox=s.x,oy=s.y;
  if(touch&&anchor&&!(Auto.on&&!tut)){var lim=focus?3.2:8,tx=anchor.px+(touch.x-anchor.x),ty=anchor.py+(touch.y-anchor.y);
    s.x+=Math.max(-lim,Math.min(lim,tx-s.x));s.y+=Math.max(-lim,Math.min(lim,ty-s.y))}
  else{s.x+=ax*spd;s.y+=ay*spd}
  s.x=Math.max(10,Math.min(W-10,s.x));s.y=Math.max(150,Math.min(H-15,s.y));
  if(flash>0)flash--;
  s.moved+=Math.abs(s.x-ox)+Math.abs(s.y-oy);if(focus)s.focused++;
  emit();
  if(s.ic>0)s.ic--;
  var b=s.b,w=0;
  for(var i=0;i<b.length;i++){var q=b[i];q.vx+=q.ax;q.vy+=q.ay;q.x+=q.vx;q.y+=q.vy;
    if(q.y>H+20||q.y<-40||q.x<-40||q.x>W+40)continue;
    var dx=q.x-s.x,dy=q.y-s.y,d2=dx*dx+dy*dy,hr=q.r+3;
    if(Math.abs(dx)<hr&&Math.abs(dy)<hr&&s.ic<=0){hit();if(state!=='play')return;continue}
    if(!q.g&&d2<(q.r+14)*(q.r+14)){q.g=1;s.graze++;Kit.tone(1500,.02,'square',.012)}
    b[w++]=q}
  b.length=w;
  if(!tut&&s.t>=18000)finish(true);
  if(tut)tutStep()}
function finish(win){state='over';s.overT=0;s.win=!!win;var bt=best(diff);s.rank=s.t>bt?1:0;if(s.t>bt)Kit.lsSet('pinBest'+diff,s.t);plan=null;if(win){Kit.tone(660,.2,'square',.05);Kit.tone(990,.3,'square',.05,1,Kit.ac()&&Kit.ac().currentTime+.15)}}
var flash=0;
function hit(){if(!tut)s.lives--;s.ic=tut?45:90;flash=8;Kit.noise(.3,.14);Kit.tone(150,.3,'sawtooth',.07,.4);
  var w=0;for(var i=0;i<s.b.length;i++){var q=s.b[i];if(Math.hypot(q.x-s.x,q.y-s.y)>70)s.b[w++]=q}s.b.length=w;
  if(!tut&&s.lives<=0)finish(false)}
function tutStep(){tut.t++;
  if(tut.k===0&&s.moved>260)tut.k=1;
  else if(tut.k===1&&s.focused>45)tut.k=2;
  else if(tut.k===2&&tut.t>900)endTut()}

/* ---------- input ---------- */
cv.addEventListener('pointerdown',function(e){Kit.ac();var p=Kit.pt(e);
  if(state==='menu'){for(var i=0;i<3;i++){var cx=W/2+(i-1)*110;if(Math.abs(p.x-cx)<50&&Math.abs(p.y-330)<60){diff=i;Kit.lsSet('pinDiff',i)}}
    if(Math.abs(p.x-W/2)<110&&Math.abs(p.y-530)<30)newRun();return}
  if(state==='over'){if(s.overT>40)toMenu();return}
  cv.setPointerCapture(e.pointerId);touch=p;anchor={x:p.x,y:p.y,px:s.x,py:s.y}});
cv.addEventListener('pointermove',function(e){if(touch)touch=Kit.pt(e)});
['pointerup','pointercancel'].forEach(function(n){cv.addEventListener(n,function(){touch=null;anchor=null})});
Kit.onPress=function(c){
  if(state==='menu'){if(c==='ArrowLeft'||c==='KeyA'){diff=(diff+2)%3;Kit.lsSet('pinDiff',diff)}if(c==='ArrowRight'||c==='KeyD'){diff=(diff+1)%3;Kit.lsSet('pinDiff',diff)}if(c==='Space'||c==='Enter')newRun();return}
  if(state==='over'){if((c==='Space'||c==='Enter')&&s.overT>40)toMenu();return}
  if(c==='KeyR'&&!tut)newRun()};

/* ---------- drawing ---------- */
function txt(a,x,y,z,c,al){Kit.txt(ctx,a,x,y,z,c,al)}
function spr(m,cx,cy,u,col){ctx.fillStyle=col;var ox=cx-m[0].length*u/2|0,oy=cy-m.length*u/2|0;for(var r=0;r<m.length;r++)for(var q=0;q<m[r].length;q++)if(m[r][q]==='X')ctx.fillRect(ox+q*u,oy+r*u,u,u)}
var SHIP=['...X...','..XXX..','..XXX..','.XXXXX.','XX.X.XX'];
function arrowK(cx,cy,dir,col){ctx.fillStyle=col;for(var i=0;i<4;i++){var h=(i+1)*3,x=dir<0?cx-8+i*4:cx+5-i*4;ctx.fillRect(x,cy-h/2,4,h)}}
function keyK(cx,cy,w,h,hi){ctx.fillStyle=hi?'#ffb000':'#0b1016';ctx.fillRect(cx-w/2,cy-h/2,w,h);ctx.strokeStyle='#efe6d2';ctx.lineWidth=2;ctx.strokeRect(cx-w/2,cy-h/2,w,h)}
function tutDraw(){var k=tut.k,ph=(tut.t/28|0)%2;
  txt(['MOVE','SLOW','DODGE'][k],W/2,230,28,'#ffb000','center');for(var i=0;i<3;i++){ctx.fillStyle=i<=k?'#ffb000':'#2b3744';ctx.fillRect(W/2-36+i*26,244,18,5)}
  if(k===0){if(Device.mobile){var fx=W/2+Math.sin(tut.t/22)*100;spr(HAND,fx,300,5,'#efe6d2')}else{keyK(W/2-34,290,40,34,!ph);arrowK(W/2-34,290,-1,ph?'#efe6d2':'#0b1016');keyK(W/2+34,290,40,34,!!ph);arrowK(W/2+34,290,1,ph?'#0b1016':'#efe6d2')}}
  if(k===1&&!Device.mobile){keyK(W/2,290,120,34,!!ph);txt('SHIFT',W/2,296,12,ph?'#0b1016':'#efe6d2','center')}}
function drawPlay(){
  s.b.forEach(function(q){ctx.fillStyle=q.c;ctx.fillRect(q.x-q.r|0,q.y-q.r|0,q.r*2,q.r*2);ctx.fillStyle='#0b1016';ctx.fillRect(q.x-1|0,q.y-1|0,2,2)});
  if(!(s.ic>0&&(s.t>>2)&1)){spr(SHIP,s.x,s.y+2,2,'#efe6d2')}
  var focus=keys.ShiftLeft||keys.ShiftRight||keys.Slow;if(focus){ctx.strokeStyle='#ffb000';ctx.lineWidth=2;ctx.strokeRect(s.x-10,s.y-10,20,20)}
  ctx.fillStyle='#ff5a36';ctx.fillRect(s.x-3|0,s.y-3|0,6,6);ctx.fillStyle='#fff';ctx.fillRect(s.x-1|0,s.y-1|0,2,2);
  ctx.fillStyle='#0b1016';ctx.fillRect(0,0,W,40);ctx.fillStyle='#2b3744';ctx.fillRect(0,40,W,2);
  txt(fmt(s.t),14,27,16,'#efe6d2');txt('G'+s.graze,W/2+10,27,13,'#8d9aa5');
  for(var l=0;l<s.lives;l++){ctx.fillStyle='#ffb000';ctx.fillRect(W-22-l*17,15,11,11)}
  if(flash>0){ctx.globalAlpha=flash/12;ctx.fillStyle='#ff5a36';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
  if(tut)tutDraw()}
function drawMenu(){
  ctx.font='700 44px Silkscreen,monospace';var a=ctx.measureText('PINPR').width,b=ctx.measureText('ICK').width,x0=(W-a-b)/2;txt('PINPR',x0,130,44,'#efe6d2');txt('ICK',x0+a,130,44,'#ffb000');
  for(var i=0;i<3;i++){var cx=W/2+(i-1)*110,sel=diff===i;
    if(sel){ctx.strokeStyle='#ffb000';ctx.lineWidth=3;ctx.strokeRect(cx-46,272,92,116)}
    ctx.fillStyle=sel?'#ff5a36':'#5b6670';var n=6+i*6;for(var j=0;j<n;j++){var an=j/n*6.2832+t/80*(i+1)*.3;ctx.fillRect(cx+Math.cos(an)*(14+i*4)-2|0,324+Math.sin(an)*(14+i*4)-2|0,4,4)}
    ctx.fillStyle='#ff5a36';ctx.fillRect(cx-3,321,6,6);
    for(var l=0;l<LIVES[i];l++){ctx.fillStyle=sel?'#ffb000':'#5b6670';ctx.fillRect(cx-LIVES[i]*7+l*14+1,358,10,10)}
    txt(best(i)?fmt(best(i)):'--',cx,382,12,sel?'#efe6d2':'#5b6670','center')}
  keyK(W/2,530,220,54,true);txt('PLAY',W/2,538,22,'#0b1016','center')}
function drawOver(){ctx.fillStyle='rgba(11,16,22,.9)';ctx.fillRect(0,0,W,H);txt(s.win?'CLEAR':'DOWN',W/2,200,36,s.win?'#ffb000':'#ff5a36','center');txt(fmt(s.t),W/2,270,30,'#efe6d2','center');
  txt('GRAZE',150,340,14,'#8d9aa5');txt(String(s.graze),W-150,340,14,'#efe6d2','right');txt('BEST',150,372,14,'#8d9aa5');txt(fmt(best(diff)),W-150,372,14,'#efe6d2','right');
  if(s.rank&&(s.overT>>4&1)===0)txt('NEW BEST',W/2,460,16,'#ffb000','center')}
function draw(){
  ctx.fillStyle='#0b1016';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#131b24';for(var i=0;i<36;i++)ctx.fillRect((i*97)%W,((i*61+t*(1+i%3)*.25)%H)|0,2,2);
  if(state==='menu')drawMenu();else{drawPlay();if(state==='over')drawOver()}}
/* expose a no-render fast tick for tests */
toMenu();if(!seen)startTut();
Kit.run(tick,draw,function(){K.pad.style.visibility=state==='play'?'visible':'hidden';bSlow.classList.toggle('pulse',!!tut&&tut.k===1&&Device.mobile)});
document.addEventListener('visibilitychange',function(){});
</script>
<script src="../../shared/stars.js"></script>
<script src="../../shared/online.js"></script>
<script>(function(){var B=[0,1,2].map(function(d){return{key:'time'+d,fmt:'time',label:String(d+1),read:function(r){var t=r('pinBest'+d);return t?t/60:null}}});Online.watch('pinprick',B);function mount(){var h=document.querySelectorAll('.cl')[document.querySelectorAll('.cl').length-1];if(!h){var bs=document.querySelectorAll('button');for(var i=bs.length-1;i>=0;i--){if(bs[i].offsetParent&&bs[i].parentNode&&bs[i].parentNode.querySelectorAll('button').length>2){h=bs[i].parentNode;break}}}Online.button('pinprick',B,h)}if(document.readyState==='complete')setTimeout(mount,300);else addEventListener('load',function(){setTimeout(mount,300)})})();</script>
<script src="../../shared/guide.js"></script>
<script>Guide.set({title:'Pinprick',goal:'Dodge every bullet for five minutes.',
 how:['Only the tiny square at your centre can be hit. Everything around it is safe.','Hold slow to move precisely through tight gaps.','Brushing past bullets (grazing) adds to your graze count.','The patterns get harder every 15 seconds. Easy gives three lives, the other two levels give one.'],
 keys:[['Arrows / W A S D','move'],['Shift','slow']],touch:[['Drag anywhere','move (your finger stays off the ship)'],['SLOW button','slow']],
 legend:[{pic:Guide.letter('■','#ffb000'),name:'Your core',note:'the only part that can be hit'},{pic:Guide.letter('●','#ff5a36'),name:'Bullet',note:'square hitbox, as drawn'},{pic:Guide.letter('~','#efe6d2'),name:'Graze',note:'near miss: points'}],
 tips:['Small movements beat big ones; watch the gaps, not the bullets.']});Guide.attach('button[title="Replay tutorial"]');</script>
</body>
</html>
