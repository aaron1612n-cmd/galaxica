<html lang="en">

<style>
/* Rube Garden: a Victorian glasshouse. Pale glass, wrought iron, moss, one terracotta. */
:root{--gk-bg:#e4ebe2;--gk-ink:#1f2321;--gk-acc:#c8643b;--gk-font:"Old Standard TT",Georgia,serif;--gk-bw:2px;--gk-r:0;--gk-pr:4px;--gk-sh:none;--gk-h:42px;--gk-ty:12;--gk-toy:80}
body{background:#e4ebe2}
#stage{padding:6px}
canvas#c{touch-action:none;cursor:pointer}
/* bar skin: seed packets (flap cut on top), hung along a top rail */
.gk-bar{border-bottom:3px solid #1f2321}
.gk-bar .gk-b{background:#f3f0e4;border:2px solid #1f2321;clip-path:polygon(0 8px,50% 0,100% 8px,100% 100%,0 100%);padding-top:6px;height:calc(var(--gk-h) + 6px)}
.gk-names .gk-bar .gk-b[data-cap]{padding-top:9px}
.gk-b.on,.gk-b.md.on,.gk-b.gk-auto:not(.ghost){background:#c8643b;color:#f3f0e4;border-color:#1f2321}
.lvls{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
.lv{aspect-ratio:1;border:2px solid #1f2321;background:#f3f0e4;color:#1f2321;font:700 18px "Old Standard TT";display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;clip-path:polygon(0 8px,50% 0,100% 8px,100% 100%,0 100%)}
.lv i{display:flex;gap:2px}.lv i s{width:7px;height:7px;border-radius:50%;border:1.4px solid #1f2321}.lv i s.on{background:#c8643b;border-color:#c8643b}
.lv.lock{opacity:.3;pointer-events:none}.lv.cur{background:#c8643b;color:#f3f0e4}
</style>
</head>
<body>
<div id="app"><div id="stage"><canvas id="c"></canvas></div><div id="bar"></div></div>
<script>
GK.id('rubegarden');
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
var GLASS='#e4ebe2',GLASS2='#d6e0d5',IRON='#1f2321',TERRA='#c8643b',MOSS='#6f8f5a',WATER='#5f8fa0',TS=44,TOP=80,TRAY=78,NLV=40;
/* cells: 0 empty 1 iron beam 2 ramp / 3 ramp \ 4 plank 5 spring 6 fan > 7 fan < 8 pot 9 thorns */
var PIECES=[2,3,4,5,6,7],PIC={2:'/',3:'\\',4:'_',5:'s',6:'>',7:'<'};
var MODE=GK.ls.get('mode','glass'),prog=GK.ls.get('prog',{done:0,stars:{}}),ST=GK.ls.get('st',{cleared:0,stars:0,seeds:0,placed:0,springs:0,par:0,daily:0,endless:0,runs:0});
function saveST(){GK.ls.set('st',ST)}
/* ============ the drop's rules (deterministic, one cell per step) ============ */
function supports(c){return c>=1&&c<=7}
function run(L,P,cap){/* P: placed pieces map; returns {path,win,seeds} */ var w=L.w,h=L.h,x=L.fx,y=0,d=0,hm=0,u=0,path=[[x,y]],seen={},seeds={},win=false;function cell(cx,cy){if(cx<0||cx>=w)return 1;if(cy<0)return 0;if(cy>=h)return-1;var i=cy*w+cx;return P[i]!=null?P[i]:L.g[i]}
  for(var s=0;s<(cap||500);s++){var key=x+','+y+','+d+','+hm+','+u;if(seen[key])break;seen[key]=1;var c;
    if(d===3){var c3=cell(x,y-1);if(y-1<0||supports(c3)){d=0}else{y--;u--;if(u<=0)d=0;path.push([x,y]);continue}}
    if(d===0){c=cell(x,y+1);if(c===-1)break;
      if(c===0||c===8||c===9){y++}else if(c===2){y++;d=1;hm=-1}else if(c===3){y++;d=2;hm=1}else if(c===5){d=3;u=3}else if(c===6){d=2;hm=1}else if(c===7){d=1;hm=-1}else{if(hm===0)break;d=hm<0?1:2}}
    else{var dx=d===1?-1:1;c=cell(x+dx,y);
      if(c===1||c===4||c===5||(c===2&&dx>0)||(c===3&&dx<0)){d=d===1?2:1;hm=-hm;var c2=cell(x+(d===1?-1:1),y);if(c2===1||c2===4||c2===5)break;continue}
      x+=dx;if(c===2||c===3){d=0}else if(c===6){d=2;hm=1}else if(c===7){d=1;hm=-1}else{var b=cell(x,y+1);if(!supports(b)&&b!==-1){d=0}else if(b===-1){d=0}}}
    path.push([x,y]);var cc=cell(x,y);if(L.seeds.indexOf(y*w+x)>=0)seeds[y*w+x]=1;if(cc===8){win=true;break}if(cc===9)break}
  return{path:path,win:win,seeds:seeds}}
/* ============ levels are built forward from a working contraption ============ */
function gen(n,seed){var rn=GK.rng(seed),w=7+Math.min(2,Math.floor(n/14)),h=9+Math.min(4,Math.floor(n/8)),types=[2,3].concat(n>=3?[4]:[],n>=6?[5]:[],n>=10?[6,7]:[]),want=Math.min(6,1+Math.floor(n/5));
  for(var att=0;att<400;att++){var g=new Uint8Array(w*h),i,k;var nb=2+((rn()*(3+Math.min(5,n/4)))|0);for(k=0;k<nb;k++){var by=3+((rn()*(h-4))|0),bx=(rn()*w)|0,bl=1+((rn()*3)|0);for(var q=0;q<bl;q++)if(bx+q<w)g[by*w+bx+q]=1}
    if(n>=12){for(k=0;k<1+Math.floor(n/12);k++){var ti=((rn()*w)|0)+(h-1)*w;g[ti]=9}}
    var L={n:n,w:w,h:h,g:g,fx:1+((rn()*(w-2))|0),seeds:[]};L0w=w;if(g[L.fx]||g[w+L.fx])continue;
    /* walk the drop, sometimes dropping a piece into the cell it is about to enter */ var P={},used=0,visited={},x=L.fx,y=0,ok=false,steps=0;visited[0*w+x]=1;
    for(var tries=0;tries<12&&!ok;tries++){var r=run(L,P,400),path=r.path,last=path[path.length-1];path.forEach(function(p){visited[p[1]*w+p[0]]=1});
      var cand=[];for(k=2;k<path.length;k++){var p=path[k],ci=p[1]*w+p[0];if(g[ci]===0&&P[ci]==null&&p[1]>0&&!seenBefore(path,k,ci))cand.push([k,ci])}
      if(used>=want&&path.length>10){/* pot at a cell the drop reaches */ var endIdx=path.length-1;var e=path[endIdx];var ei=e[1]*w+e[0];if(g[ei]===0&&e[1]>2&&Math.abs(e[0]-L.fx)+e[1]>5){L.goal=ei;g[ei]=8;ok=true;break}
        for(k=path.length-1;k>8;k--){var pp=path[k],pi=pp[1]*w+pp[0];if(g[pi]===0&&pp[1]>2&&P[pi]==null&&!seenBefore(path,k,pi)){g[pi]=8;L.goal=pi;ok=true;break}}if(ok)break}
      if(!cand.length)break;var pick=cand[Math.min(cand.length-1,(rn()*Math.min(cand.length,10))|0)];P[pick[1]]=types[(rn()*types.length)|0];used++}
    if(!ok)continue;var fin=run(L,P,500);if(!fin.win)continue;
    /* the puzzle must not already solve itself, and every piece must matter */ if(run(L,{},500).win)continue;
    Object.keys(P).forEach(function(kk){var P2=Object.assign({},P);delete P2[kk];if(run(L,P2,500).win)delete P[kk]});if(!run(L,P,500).win)continue;
    var inv={};Object.keys(P).forEach(function(kk){inv[P[kk]]=(inv[P[kk]]||0)+1});var sp=run(L,P,500).path.filter(function(p){var c=g[p[1]*w+p[0]];return c===0&&P[p[1]*w+p[0]]==null&&p[1]>1});if(sp.length>4){for(k=0;k<Math.min(2,1+Math.floor(n/8));k++){var s2=sp[(rn()*sp.length)|0];var si=s2[1]*w+s2[0];if(L.seeds.indexOf(si)<0)L.seeds.push(si)}}
    L.inv=inv;L.sol=P;L.par=Object.keys(P).length;if(L.par<Math.min(want,2)&&n>3)continue;return L}
  return gen(Math.max(1,n-2),seed+7)}
function seenBefore(path,k,ci){var w=L0w;for(var j=0;j<k;j++){if(path[j][1]*w+path[j][0]===ci)return true}return false}
var L0w=7;
/* ============ state ============ */
var L=null,P={},sel=2,lvN=1,inTut=-1,T=0,drop=null,won=0,winT=0,failT=0,eseed=1;
function load(n){inTut=-1;lvN=n;var seed=MODE==='daily'?GK.daily.seed()*29+3:MODE==='endless'?eseed*977+n:n*5813+11;L=gen(MODE==='daily'?22:MODE==='endless'?Math.min(40,3+n*2):n,seed);reset()}
function tutL(){var w=7,h=8,g=new Uint8Array(w*h);for(var x=0;x<w;x++)g[5*w+x]=1;g[4*w+5]=8;return{n:0,w:w,h:h,g:g,fx:1,seeds:[],inv:{3:1},sol:{22:3},par:1,goal:4*w+5}}
function reset(){P={};drop=null;won=0;winT=0;failT=0;var ks=Object.keys(L.inv);sel=ks.length?+ks[0]:2;layout();GK.fx.clear()}
function left(t){var c=L.inv[t]||0;for(var k in P)if(P[k]===t)c--;return c}
function layout(){fit()}
function W(){return L.w*TS+20}function H(){return L.h*TS+TOP+TRAY+10}
function fit(){if(L)GK.fit(cv,stage,W(),H(),1.5)}
function ox(){return 10}
/* ============ input ============ */
GK.pointer(cv,{down:function(x,y){if(won){if(winT>40)next();return}if(Auto.on)return;
    if(y>TOP+L.h*TS+6){/* tray */ var ks=Object.keys(L.inv),tw=60,x0=W()/2-ks.length*tw/2+tw/2;ks.forEach(function(k,i){if(Math.abs(x-(x0+i*tw))<28)sel=+k});var px=W()-36;if(Math.abs(x-px)<30)play();return}
    if(drop){drop=null;return}var cx=Math.floor((x-ox())/TS),cy=Math.floor((y-TOP)/TS);if(cx<0||cy<0||cx>=L.w||cy>=L.h)return;var i=cy*L.w+cx;if(L.g[i]||(cy===0&&cx===L.fx))return;
    if(P[i]!=null){delete P[i];GK.audio.tone(260,.05,'triangle',.03);return}if(left(sel)<=0){var ks2=Object.keys(L.inv).filter(function(k){return left(+k)>0});if(!ks2.length){GK.fx.shake(2,5);return}sel=+ks2[0]}P[i]=sel;if(inTut<0)ST.placed++;GK.audio.tone(520,.06,'triangle',.04);GK.fx.burst(ox()+cx*TS+TS/2,TOP+cy*TS+TS/2,6,{col:IRON,speed:1.6,life:12,size:2})},
  key:function(c,d){if(!d)return;if(c==='Space'||c==='Enter'){if(won)next();else play()}if(c==='KeyR')reset();var n=parseInt(c.replace('Digit',''),10);if(n>=1){var ks=Object.keys(L.inv);if(ks[n-1])sel=+ks[n-1]}}});
function play(){if(won)return;if(drop){drop=null;return}var r=run(L,P,600);drop={r:r,t:0};failT=0;if(inTut<0)ST.runs++;GK.audio.tone(330,.2,'sine',.04,1.4)}
function next(){if(inTut>=0){if(inTut===0){inTut=1;L=gen(2,99);reset()}else tut.end();return}if(MODE==='daily'){load(1);return}load(MODE==='glass'?Math.min(NLV,lvN+1):lvN+1)}
function win(){won=1;winT=0;var seedsGot=Object.keys(drop.r.seeds).length,used=Object.keys(P).length;var st=1+(seedsGot>=L.seeds.length?1:0)+(used<=L.par?1:0);L.st=st;[392,523,659,784,1047].forEach(function(f,i){GK.audio.tone(f,.35,'triangle',.05,1,GK.audio.ctx&&GK.audio.ctx.currentTime+i*.08)});
  var g=L.goal;for(var k=0;k<3;k++)GK.fx.burst(ox()+(g%L.w)*TS+TS/2,TOP+((g/L.w)|0)*TS+TS/2,16,{col:[TERRA,MOSS,WATER][k],speed:4,life:36,shape:'ci',size:3,up:2,grav:.1});
  if(inTut>=0)return;ST.seeds+=seedsGot;if(st===3)ST.par++;for(var q in P)if(P[q]===5)ST.springs++;
  if(MODE==='glass'){var k0=prog.stars[lvN]||0;if(st>k0){ST.stars+=st-k0;prog.stars[lvN]=st}if(lvN>prog.done){prog.done=lvN;ST.cleared=Math.max(ST.cleared,lvN)}GK.ls.set('prog',prog)}else if(MODE==='endless')ST.endless=Math.max(ST.endless,lvN);else ST.daily=GK.daily.claim(st*100-used).n;saveST()}
/* ============ AUTO: builds the known contraption, then opens the tap ============ */
var botT=0;function bot(){if(won){if(winT>70)next();return}if(drop){return}if(++botT<16)return;botT=0;
  for(var k in P){if(L.sol[k]!==P[k]){delete P[k];return}}for(var k2 in L.sol){if(P[k2]!==L.sol[k2]){P[k2]=L.sol[k2];GK.audio.tone(520,.06,'triangle',.04);return}}play()}
/* ============ tick ============ */
function step(){T++;GK.goals.tick();if(!L)return;
  if(drop){drop.t+=.2;var r=drop.r;if(drop.t>=r.path.length-1){if(r.win&&!won)win();else if(!r.win){failT++;if(failT===1){var e=r.path[r.path.length-1];GK.fx.burst(ox()+e[0]*TS+TS/2,TOP+e[1]*TS+TS/2,12,{col:WATER,speed:2.6,life:22,shape:'ci',size:2.6,grav:.1});GK.audio.tone(150,.3,'triangle',.05,.6)}if(failT>50)drop=null}}}
  if(won)winT++;if(Auto.on)bot();tut.tick()}
/* ============ drawing: glasshouse ironwork ============ */
function render(){var v=GK.view,so=GK.fx.offset(),w=W(),hh=H();ctx.setTransform(v.dpr*v.s,0,0,v.dpr*v.s,0,0);ctx.fillStyle=GLASS;ctx.fillRect(0,0,w,hh);if(!L)return;ctx.translate(so.x,so.y);
  var X0=ox(),gw=L.w*TS,gh=L.h*TS;
  /* glazing bars and arched panes */ ctx.fillStyle=GLASS2;for(var y=0;y<L.h;y++)for(var x=0;x<L.w;x++)if((x+y)%2)ctx.fillRect(X0+x*TS,TOP+y*TS,TS,TS);
  ctx.strokeStyle='rgba(31,35,33,.18)';ctx.lineWidth=1;for(x=0;x<=L.w;x++){ctx.beginPath();ctx.moveTo(X0+x*TS,TOP);ctx.lineTo(X0+x*TS,TOP+gh);ctx.stroke()}for(y=0;y<=L.h;y++){ctx.beginPath();ctx.moveTo(X0,TOP+y*TS);ctx.lineTo(X0+gw,TOP+y*TS);ctx.stroke()}
  ctx.strokeStyle=IRON;ctx.lineWidth=3;ctx.strokeRect(X0,TOP,gw,gh);ctx.beginPath();for(x=0;x<L.w;x++){ctx.moveTo(X0+x*TS,TOP);ctx.arc(X0+x*TS+TS/2,TOP,TS/2,Math.PI,0)}ctx.lineWidth=1.5;ctx.stroke();
  /* tap */ var fx=X0+L.fx*TS+TS/2;ctx.fillStyle=IRON;ctx.fillRect(fx-16,TOP-30,22,7);ctx.fillRect(fx-5,TOP-30,10,30);ctx.fillRect(fx-22,TOP-36,4,13);ctx.fillRect(fx-27,TOP-36,14,4);
  for(var i=0;i<L.w*L.h;i++){var c=P[i]!=null?P[i]:L.g[i],cx=X0+(i%L.w)*TS,cy=TOP+((i/L.w)|0)*TS;if(c)drawCell(c,cx,cy,P[i]!=null)}
  L.seeds.forEach(function(si){if(drop&&drop.r.seeds[si]&&drop.t>=indexOf(drop.r.path,si))return;var sx=X0+(si%L.w)*TS+TS/2,sy=TOP+((si/L.w)|0)*TS+TS/2+Math.sin(T*.06+si)*1.5;ctx.fillStyle=MOSS;ctx.beginPath();ctx.ellipse(sx,sy,5,8,.4,0,6.3);ctx.fill();ctx.strokeStyle=IRON;ctx.lineWidth=1.2;ctx.stroke()});
  /* the drop and its wet trail */ if(drop){var r=drop.r,k=Math.min(r.path.length-1,Math.floor(drop.t)),f=drop.t-k,a=r.path[k],b=r.path[Math.min(r.path.length-1,k+1)];ctx.fillStyle='rgba(95,143,160,.35)';for(var q=0;q<=k;q++){var p=r.path[q];ctx.beginPath();ctx.arc(X0+p[0]*TS+TS/2,TOP+p[1]*TS+TS/2,3,0,6.3);ctx.fill()}
    var dx=X0+(a[0]+(b[0]-a[0])*f)*TS+TS/2,dy=TOP+(a[1]+(b[1]-a[1])*f)*TS+TS/2;ctx.fillStyle=WATER;ctx.strokeStyle=IRON;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(dx,dy-11);ctx.quadraticCurveTo(dx+9,dy+3,dx,dy+8);ctx.quadraticCurveTo(dx-9,dy+3,dx,dy-11);ctx.fill();ctx.stroke()}
  drawTray();GK.fx.draw(ctx);drawHud();if(won)drawWin();if(tut.active&&!won)tutDraw()}
function indexOf(path,si){for(var q=0;q<path.length;q++)if(path[q][1]*L.w+path[q][0]===si)return q;return 1e9}
function drawCell(c,x,y,placed){var m=6;ctx.lineCap='round';ctx.strokeStyle=IRON;ctx.fillStyle=IRON;
  if(c===1){ctx.fillRect(x+1,y+TS/2-8,TS-2,16);ctx.strokeStyle=GLASS;ctx.lineWidth=1.5;ctx.beginPath();for(var k=4;k<TS-4;k+=10){ctx.moveTo(x+k,y+TS/2-6);ctx.lineTo(x+k+6,y+TS/2+6);ctx.moveTo(x+k+6,y+TS/2-6);ctx.lineTo(x+k,y+TS/2+6)}ctx.stroke();return}
  if(placed){ctx.fillStyle='rgba(200,100,59,.12)';ctx.fillRect(x+2,y+2,TS-4,TS-4)}
  ctx.lineWidth=6;if(c===2){ctx.beginPath();ctx.moveTo(x+m,y+TS-m);ctx.lineTo(x+TS-m,y+m);ctx.stroke()}else if(c===3){ctx.beginPath();ctx.moveTo(x+m,y+m);ctx.lineTo(x+TS-m,y+TS-m);ctx.stroke()}
  else if(c===4){ctx.fillStyle='#8a6a48';ctx.fillRect(x+3,y+TS/2-5,TS-6,10);ctx.strokeStyle=IRON;ctx.lineWidth=2;ctx.strokeRect(x+3,y+TS/2-5,TS-6,10)}

    var gr=won?Math.min(1,winT/40):.3;ctx.strokeStyle=MOSS;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(px,py-24);ctx.lineTo(px,py-24-26*gr);ctx.stroke();if(gr>.5){ctx.fillStyle=MOSS;ctx.beginPath();ctx.ellipse(px-6,py-34,6,3,-.5,0,6.3);ctx.ellipse(px+6,py-40,6,3,.5,0,6.3);ctx.fill();ctx.fillStyle=TERRA;for(var pe=0;pe<6;pe++){ctx.beginPath();ctx.arc(px+Math.cos(pe)*6,py-24-26*gr+Math.sin(pe)*6,4,0,6.3);ctx.fill()}}}

  /* tap handle: opens the water */ var px=W()-36,py=ty+(TRAY-10)/2;ctx.fillStyle=TERRA;ctx.beginPath();ctx.arc(px,py,21,0,6.3);ctx.fill();ctx.strokeStyle=IRON;ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=GLASS;if(drop){ctx.fillRect(px-7,py-7,14,14)}else{ctx.beginPath();ctx.moveTo(px,py-12);ctx.quadraticCurveTo(px+10,py+3,px,py+10);ctx.quadraticCurveTo(px-10,py+3,px,py-12);ctx.fill()}}
function drawHud(){ctx.fillStyle=IRON;ctx.font='700 30px "Old Standard TT"';ctx.textAlign='left';ctx.fillText(inTut>=0||MODE!=='glass'?'':String(lvN),12,36);if(MODE!=='glass'||inTut>=0)GK.icoDraw(ctx,inTut>=0?'eye':MODE==='daily'?'sun':'infinity',26,28,22,IRON,1.8);
  if(MODE==='glass'&&inTut<0){var bs=prog.stars[lvN]||0;for(var k=0;k<3;k++)GK.icoDraw(ctx,'flower',66+k*17,28,14,k<bs?TERRA:'rgba(31,35,33,.25)',1.8)}
  ctx.textAlign='right';ctx.font='22px "Old Standard TT"';ctx.fillText(Object.keys(P).length+' / '+L.par,W()-12,36)}
function drawWin(){if(winT<30)return;var a=Math.min(1,(winT-30)/20);ctx.fillStyle='rgba(228,235,226,'+.85*a+')';ctx.fillRect(0,0,W(),H());ctx.globalAlpha=a;if(inTut<0)for(var k=0;k<3;k++)GK.icoDraw(ctx,'flower',W()/2-56+k*56,H()/2,k<L.st?48:30,k<L.st?TERRA:'rgba(31,35,33,.3)',1.8);ctx.globalAlpha=1;GK.pulse(ctx,W()/2,H()/2+70,winT,TERRA,10)}
/* ============ tutorial: one ramp, then two ============ */
var tut=GK.tutorial({parent:stage,onStart:function(){inTut=0;L=tutL();reset()},onEnd:function(){load(MODE==='glass'?Math.min(NLV,Math.max(1,prog.done+1)):1)},steps:[{done:function(){return Object.keys(P).length>0||inTut>0}},{done:function(){return inTut>0||won}},{done:function(){return inTut===1&&won&&winT>45}}]});
function tutDraw(){var t=tut.t;for(var k in L.sol){if(P[k]!==L.sol[k]){var i=+k;GK.pulse(ctx,ox()+(i%L.w)*TS+TS/2,TOP+((i/L.w)|0)*TS+TS/2,t,TERRA,12);return}}if(!drop)GK.pulse(ctx,W()-36,TOP+L.h*TS+10+(TRAY-10)/2,t,TERRA,14)}
/* ============ level list ============ */
function openLevels(){var m=document.createElement('div');m.className='gk-modal';var sh=document.createElement('div');sh.className='gk-sheet';var hd=document.createElement('div');hd.className='gk-mh';hd.innerHTML='<span>'+prog.done+' / '+NLV+'</span>';var x=document.createElement('button');x.className='gk-b';x.textContent='×';x.onclick=function(){m.remove()};hd.appendChild(x);sh.appendChild(hd);
  var g=document.createElement('div');g.className='lvls';for(var n=1;n<=NLV;n++)(function(n){var b=document.createElement('button'),s=prog.stars[n]||0;b.className='lv'+(n>prog.done+1?' lock':'')+(n===lvN&&MODE==='glass'?' cur':'');b.innerHTML=n+'<i>'+[0,1,2].map(function(k){return'<s class="'+(k<s?'on':'')+'"></s>'}).join('')+'</i>';b.onclick=function(){m.remove();if(tut.active)tut.end();if(MODE!=='glass'){MODE='glass';GK.ls.set('mode','glass');paint()}load(n)};g.appendChild(b)})(n);
  sh.appendChild(g);m.appendChild(sh);m.onpointerdown=function(e){if(e.target===m)m.remove()};document.body.appendChild(m)}
/* ============ bar ============ */
var R=GK.controls(document.getElementById('bar'),{bar:'top',onHelp:function(){tut.start()},extra:[
  {id:'rs',html:GK.icon('restart'),title:'Clear (R)',fn:function(){reset()}},
  {id:'lv',html:GK.icoSvg('flag'),title:'Glasshouses',fn:openLevels},
  {id:'m_glass',cls:'md',html:GK.icoSvg('flower'),title:'Levels',fn:function(){setMode('glass')}},
  {id:'m_endless',cls:'md',html:GK.icoSvg('infinity'),title:'Endless',fn:function(){setMode('endless')}},
  {id:'m_daily',cls:'md',html:GK.icoSvg('sun'),title:'Daily',fn:function(){setMode('daily')}}]});
function setMode(m){if(tut.active)return;MODE=m;GK.ls.set('mode',m);paint();if(m==='endless')eseed=(Math.random()*1e6)|0;load(m==='glass'?Math.min(NLV,Math.max(1,prog.done+1)):1)}
function paint(){['glass','endless','daily'].forEach(function(k){R['m_'+k].classList.toggle('on',MODE===k)})}paint();
GK.goals.setup({metrics:function(){return ST},defs:{cleared:{ic:'flag',t:[1,5,10,20,30,40]},stars:{ic:'flower',t:[3,15,45,90,120]},seeds:{ic:'leaf',t:[1,10,40,100]},placed:{ic:'wrench',t:[10,100,500]},springs:{ic:'up',t:[1,10,40]},par:{ic:'target',t:[1,10,25,40]},runs:{ic:'drop',t:[10,100,500]},endless:{ic:'infinity',t:[3,10,25]},daily:{ic:'sun',t:[1,3,7,14,30]}}});
GK.goals.mount(R);GK.online.mount(R,{game:'rube-garden',boards:[{key:'cleared',m:'cleared',ic:'flag'},{key:'stars',m:'stars',ic:'flower'},{daily:{}}]});
addEventListener('resize',fit);addEventListener('orientationchange',fit);
eseed=(Math.random()*1e6)|0;load(MODE==='glass'?Math.min(NLV,Math.max(1,prog.done+1)):1);GK.loop(step,render);tut.maybe();
window.__g={st:ST,setMode:setMode,load:load,gen:gen,run:run,tut:tut,stats:function(){return{MODE:MODE,lv:lvN,tut:inTut,size:L.w+'x'+L.h,par:L.par,inv:JSON.stringify(L.inv),placed:Object.keys(P).length,won:won,seeds:L.seeds.length,done:prog.done}}};
