<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galaxica</title>
<style>
  html,body{margin:0;height:100%;background:#07070f;color:#e8e8ff;font-family:system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  canvas{background:#0b0b1c;border:1px solid #2a2a50;max-width:100%;touch-action:none}
  a{color:#6cf}
</style>
</head>
<body>
<canvas id="c" width="480" height="640"></canvas>
<div><a href="../../">&larr; Arcade</a> &middot; Arrows/A-D move, Space fires, tap left/right/center on touch</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=false);
cv.addEventListener('pointerdown',e=>{const x=(e.clientX-cv.getBoundingClientRect().left)/cv.clientWidth;keys.TL=x<.33;keys.TR=x>.66;keys.Space=x>=.33&&x<=.66});
addEventListener('pointerup',()=>{keys.TL=keys.TR=keys.Space=false});
let s;
function reset(){s={x:W/2,cd:0,bullets:[],foes:[],t:0,score:0,lives:3,over:false}}
reset();
function step(){
  if(s.over){if(keys.Space||keys.Enter)reset();return}
  s.t++;
  const v=(keys.ArrowLeft||keys.KeyA||keys.TL?-1:0)+(keys.ArrowRight||keys.KeyD||keys.TR?1:0);
  s.x=Math.max(20,Math.min(W-20,s.x+v*5));
  if(s.cd>0)s.cd--;
  if(keys.Space&&s.cd===0){s.bullets.push({x:s.x,y:H-50});s.cd=12}
  if(s.t%Math.max(18,60-Math.floor(s.t/300)*4)===0)s.foes.push({x:20+Math.random()*(W-40),y:-20,vy:1.5+Math.random()+s.t/3000});
  s.bullets.forEach(b=>b.y-=9);s.foes.forEach(f=>f.y+=f.vy);
  for(const f of s.foes)for(const b of s.bullets)
    if(!f.dead&&!b.dead&&Math.abs(f.x-b.x)<16&&Math.abs(f.y-b.y)<16){f.dead=b.dead=true;s.score+=10}
  for(const f of s.foes)if(!f.dead&&f.y>H-30){f.dead=true;if(--s.lives<=0)s.over=true}
  s.bullets=s.bullets.filter(b=>!b.dead&&b.y>-10);s.foes=s.foes.filter(f=>!f.dead);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#6cf';ctx.beginPath();ctx.moveTo(s.x,H-45);ctx.lineTo(s.x-16,H-15);ctx.lineTo(s.x+16,H-15);ctx.fill();
  ctx.fillStyle='#fe6';s.bullets.forEach(b=>ctx.fillRect(b.x-2,b.y,4,12));
  ctx.fillStyle='#f66';s.foes.forEach(f=>{ctx.beginPath();ctx.arc(f.x,f.y,12,0,7);ctx.fill()});
  ctx.fillStyle='#e8e8ff';ctx.font='16px system-ui';ctx.fillText('Score '+s.score+'   Lives '+s.lives,10,22);
  if(s.over){ctx.textAlign='center';ctx.font='28px system-ui';ctx.fillText('GAME OVER',W/2,H/2);ctx.font='16px system-ui';ctx.fillText('Space to restart',W/2,H/2+30);ctx.textAlign='left'}
}
(function loop(){step();draw();requestAnimationFrame(loop)})();
</script>
</body>
</html>
