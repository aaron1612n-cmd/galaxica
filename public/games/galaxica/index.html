<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1016">
<meta name="mobile-web-app-capable" content="yes">
<title>Galaxica</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/theme.css">
<script src="../../shared/device.js"></script>
<script src="../../shared/auto.js"></script>

<style>
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #wrap{position:relative;border:2px solid var(--paper);box-shadow:6px 6px 0 var(--amber);background:var(--ink)}
  canvas#c{display:block;touch-action:none;image-rendering:pixelated}
  .bar{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--dim);flex-wrap:wrap;justify-content:center;padding:0 10px}
  html[data-device=mobile] .cl{padding:4px 6px;gap:6px}
  html[data-device=mobile] .spd .btn{padding:0 6px}
  html[data-device=mobile] .spd input{width:48px}
  .btn{min-height:40px;padding:0 12px}
  #pad{display:none;justify-content:space-between;align-items:center;min-height:68px}
  html[data-device=mobile] #pad{display:flex}
  html[data-device=mobile] .bar .btn{min-height:34px;padding:0 9px;font-size:10px;box-shadow:3px 3px 0 var(--paper)}
  html[data-device=mobile] .bar{gap:8px}
  html[data-device=mobile] #fs{display:none}
  html[data-device=mobile] #pad{min-height:56px}
  html[data-device=mobile] #fire,html[data-device=mobile] #bomb{height:50px}
  #fire{width:96px;height:60px;border:2px solid var(--paper);
    background:var(--amber);color:var(--ink);font:700 13px var(--px);box-shadow:4px 4px 0 var(--paper);touch-action:none}
  #fire.pulse{animation:pk .5s steps(1) infinite}
  @keyframes pk{50%{background:var(--red)}}
  #fire.on{transform:translate(4px,4px);box-shadow:none;background:var(--red)}
  #bomb{width:84px;height:60px;border:2px solid var(--paper);background:var(--ink);color:var(--red);font:700 11px var(--px);box-shadow:4px 4px 0 var(--paper);touch-action:none}
  #bomb.pulse{animation:bk .5s steps(1) infinite}@keyframes bk{50%{background:var(--red);color:var(--ink)}}
  #bomb:active{transform:translate(4px,4px);box-shadow:none}
  html[data-device=desktop] #fire,html[data-device=desktop] #bomb{display:none}
  #rot{display:none;position:fixed;inset:0;z-index:5;background:var(--ink);align-items:center;
    justify-content:center;text-align:center;padding:30px;font:700 14px var(--px);text-transform:uppercase}

<body>
<canvas id="stars"></canvas>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="pad"><button id="bomb" aria-label="Bomb">BOMB</button><button id="fire" aria-label="Fire">FIRE</button></div>
<div class="bar">
  <div class="cl"><a class="btn ghost" href="../../">← Arcade</a></div>
  <div class="cl"><button class="btn ghost" id="bot" title="Auto-play: the game plays itself">AUTO</button><span data-speed></span></div>
  <div class="cl">
    <button class="btn ghost" id="auto" data-show="mobile" hidden title="Hold-to-fire on/off">AUTOFIRE ON</button>
    <button class="btn ghost ic" id="snd" title="Sound on/off" aria-label="Sound"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z"/><path class="w" d="M11 5h1v6h-1zM13 3h1v10h-1z"/><path class="x" d="M11 6h1v1h-1zM15 6h1v1h-1zM12 7h1v1h-1zM14 7h1v1h-1zM13 8h1v1h-1zM12 9h1v1h-1zM14 9h1v1h-1zM11 10h1v1h-1zM15 10h1v1h-1z"/></svg></button>

    <button class="btn ghost ic" id="fs" title="Fullscreen" aria-label="Fullscreen"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 2h4v1H3v3H2zM10 2h4v4h-1V3h-3zM2 10h1v3h3v1H2zM13 10h1v3h-3v1h4z"/></svg></button>
    <button class="btn ghost ic" id="tutb" title="Replay tutorial" aria-label="Tutorial">?</button>
    <button class="btn" id="skip" hidden>Skip</button>
  </div>
</div>

<script>
var W=480,H=640,cv=document.getElementById('c'),ctx=cv.getContext('2d');
var dpr=Math.min(devicePixelRatio||1,2),scale=1;
function fit(){
  var pd=document.getElementById('pad'),bar=document.querySelector('.bar').offsetHeight+30+(Device.mobile?pd.offsetHeight+28:0);
  scale=Math.min(innerWidth*.98/W,(innerHeight-bar)/H);
  scale=Math.max(.3,Math.min(scale,Device.mobile?3:1.6));
  pd.style.width=W*scale+'px';cv.style.width=W*scale+'px';cv.style.height=H*scale+'px';
  cv.width=W*scale*dpr;cv.height=H*scale*dpr;
  
}
fit();Device.onChange(fit);addEventListener('load',fit);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);

/* ---------- storage / config / rng ---------- */
function lsGet(k,d){try{var v=localStorage[k];return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage[k]=JSON.stringify(v)}catch(e){}}
var cfg=Object.assign({mute:false,diff:1,ship:0,mode:0,crt:false},lsGet('galaxicaCfg',{}));
function saveCfg(){lsSet('galaxicaCfg',cfg)}
var rng=Math.random;function R(){return rng()}
function seeded(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pad(n,l){return String(n).padStart(l,'0')}

/* ---------- audio (synth sfx + chiptune loop) ---------- */
var AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,vol,slide,when){if(cfg.mute)return;var a=AC;if(!a)return;var t=when||a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}
function noise(d,vol){if(cfg.mute||!AC)return;var n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),x=b.getChannelData(0);
  for(var i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);var src=AC.createBufferSource(),g=AC.createGain();src.buffer=b;g.gain.value=vol||.1;src.connect(g);g.connect(AC.destination);src.start()}
var SFX={shoot:()=>tone(900,.05,'square',.02,.5),boom:()=>noise(.25,.12),big:()=>{noise(.7,.2);tone(120,.6,'sawtooth',.08,.3)},
  pup:()=>{tone(520,.08,'square',.05);tone(780,.12,'square',.05,1,AC&&AC.currentTime+.07)},hit:()=>{noise(.3,.18);tone(160,.3,'sawtooth',.08,.4)},
  dash:()=>tone(300,.15,'triangle',.06,3),bomb:()=>{noise(.9,.22);tone(90,.8,'sawtooth',.1,.3)},graze:()=>tone(1400,.03,'square',.015),
  charge:()=>tone(200,.3,'sawtooth',.07,4),ach:()=>{[0,4,7,12].forEach((n,i)=>tone(440*Math.pow(2,n/12),.12,'square',.04,1,AC&&AC.currentTime+i*.08))},
  life:()=>{[0,7,12].forEach((n,i)=>tone(330*Math.pow(2,n/12),.14,'triangle',.07,1,AC&&AC.currentTime+i*.09))}};
function sfx(n){if(AC&&!cfg.mute&&Speed.v<=2.5&&!Speed.ff)SFX[n]()}
function buzz(ms){if(Device.mobile&&!cfg.mute&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}}
var BASS=[[0,0,7,5,0,0,10,7],[0,3,5,3,0,3,7,5],[0,0,5,7,3,3,5,7],[0,7,3,5,0,7,10,12]],mNext=0,mStep=0;
function music(){var a=AC;if(!a||cfg.mute||Speed.v>1.5||Speed.ff||s.state!=='play'||paused)return;if(mNext<a.currentTime)mNext=a.currentTime+.05;
  while(mNext<a.currentTime+.15){var n=BASS[sector()%4][mStep%8],f=55*Math.pow(2,n/12);
    tone(f,.16,'triangle',.07,1,mNext);if(mStep%2)tone(f*4,.08,'square',.012,1,mNext);mStep++;mNext+=boss()?.13:.17}}

/* ---------- sprites ---------- */
var SHIPS=[['...XX...','...XX...','..XXXX..','.XXXXXX.','XXXXXXXX','XX.XX.XX','X..XX..X'],
  ['...XX...','...XX...','...XX...','..XXXX..','..XXXX..','.XXXXXX.','XX.XX.XX','X..XX..X'],
  ['.XXXXXX.','XXXXXXXX','XXXXXXXX','XX.XX.XX','XXXXXXXX','.XX..XX.','XX....XX']];
var M_DRONE=['..X..X..','...XX...','..XXXX..','.XX..XX.','XXXXXXXX','X.X..X.X','X......X'],
  M_CRAB=['X..XX..X','.XXXXXX.','XX.XX.XX','XXXXXXXX','.XXXXXX.','.X.XX.X.','X......X'],
  M_DART=['...XX...','..XXXX..','..XXXX..','.XXXXXX.','.X.XX.X.','X..XX..X'],
  M_BIG=['.XXXXXX.','XXXXXXXX','XX.XX.XX','XXXXXXXX','XXXXXXXX','X.X..X.X','X.X..X.X'],
  M_BOSS=['X..XXXX..X','XXXXXXXXXX','XX.XXXX.XX','XXXXXXXXXX','.XXX..XXX.','.X.XXXX.X.','X..X..X..X'],
  HAND=['...XX...','...XX...','...XX...','.XXXXXX.','XXXXXXXX','XXXXXXXX','.XXXXXX.','..XXXX..'];
var ICON_MODE=[['.XX.XX.','X..X..X','X..X..X','.XX.XX.'],['.XXXXX.','XXXXXXX','X.XXX.X','XXXXXXX','.X.X.X.','.XXXXX.'],['X..X..X','.X.X.X.','..XXX..','XXXXXXX','..XXX..','.X.X.X.','X..X..X']];
var T={drone:{hp:1,m:M_DRONE,u:3,c:'#ff5a36',pts:10,r:13},zig:{hp:1,m:M_CRAB,u:3,c:'#c9d6a3',pts:15,r:13},wave:{hp:1,m:M_CRAB,u:3,c:'#ff8f6b',pts:15,r:13},
  dive:{hp:1,m:M_DART,u:3,c:'#6ec3c9',pts:20,r:12},shoot:{hp:3,m:M_DRONE,u:4,c:'#ff5a36',pts:30,r:16},tank:{hp:9,m:M_BIG,u:5,c:'#8d9aa5',pts:80,r:22},
  split:{hp:2,m:M_BIG,u:3,c:'#c9d6a3',pts:25,r:14},homer:{hp:1,m:M_DART,u:3,c:'#ff5a36',pts:20,r:12},shield:{hp:3,m:M_CRAB,u:4,c:'#6ec3c9',pts:35,r:16},
  miner:{hp:3,m:M_BIG,u:3,c:'#ff8f6b',pts:40,r:14}};
var PUP={S:'#ffb000',R:'#ff5a36',H:'#6ec3c9',B:'#ff5a36',L:'#efe6d2',Z:'#c9d6a3',M:'#ff8f6b',T:'#6ec3c9',G:'#ffb000',X:'#efe6d2',W:'#c9d6a3',P:'#ff8f6b','*':'#ffb000'};
var TIMED='SRHZMTGXWP';
var SH=[{lives:3,spd:5.5,cd:12,dmg:1,m:SHIPS[0]},{lives:2,spd:7.5,cd:9,dmg:1,m:SHIPS[1]},{lives:4,spd:4.2,cd:16,dmg:2,m:SHIPS[2]}];
var DF=[.8,1,1.3];
var SEC=[{bg:'#0b1016',st:'#1a2430',pl:'#16222c'},{bg:'#0f130b',st:'#232b18',pl:'#1b2413'},{bg:'#140d0f',st:'#2c1b1f',pl:'#241519'},{bg:'#0a1317',st:'#17282f',pl:'#112027'}];
var ACH={first:'FIRST BLOOD',boss:'BOSS DOWN',combo10:'COMBO 10',clean:'CLEAN SWEEP',k100:'100 KILLS',bomber:'BOMBER'};
var achv=lsGet('galaxicaAch',{});
var toast=null;
function unlock(id){if(achv[id]||tut)return;achv[id]=1;lsSet('galaxicaAch',achv);toast={t:ACH[id],l:150};sfx('ach')}

/* ---------- state ---------- */
var keys={},auto=Device.mobile,paused=false,touch=null,tut=null,seen=lsGet('galaxicaTut',0);
var s,hitstop=0,shake=0,flash=0,lastTap=0,fireEdge=false,gpPrev={};
var best=lsGet('galaxicaBest',0);
function sector(){return Math.max(0,Math.floor((s.wave-1)/5))}
function boss(){return s&&s.boss}
function newGame(){var sh=SH[cfg.ship];
  if(cfg.mode===2){var d=new Date();rng=seeded(d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate())}else rng=Math.random;
  s={state:'play',x:W/2,y:H-70,cd:0,t:0,score:0,lives:sh.lives+(cfg.diff===0?1:0),bombs:2,lvl:1,pb:[],eb:[],foes:[],pups:[],parts:[],rings:[],pops:[],rocks:[],miss:[],trail:[],boss:null,buff:{},
    wave:0,toSpawn:0,spawnCd:0,waveDelay:40,banner:0,combo:0,comboT:0,charge:0,iframes:0,dash:0,dashCd:0,dvx:0,dvy:0,mvx:0,mvy:-1,kills:0,shots:0,hits:0,hitWave:false,nextLife:5000,ldx:1,
    wing:[{x:W/2,y:H-60},{x:W/2,y:H-60}],overT:0,rank:-1}}
function toMenu(){newGame();s.state='menu';touch=null}
var skip=document.getElementById('skip');
function startTut(){newGame();tut={k:0,moved:0,fired:0,t:0,foe:false,got:0,dashed:0,bombed:0};skip.hidden=false}
function endTut(){tut=null;skip.hidden=true;lsSet('galaxicaTut',1);seen=1;toMenu()}
skip.onclick=endTut;document.getElementById('tutb').onclick=function(){startTut()};
function tutStep(){var T=tut;T.t++;
  if(T.k===0&&T.moved>200){T.k=1;T.fired=0}
  else if(T.k===1&&T.fired){T.k=2;T.foe=false}
  else if(T.k===2){if(!T.foe&&!s.foes.length){spawn('drone',W/2,90,{vy:.5});T.foe=true}
    if(T.foe&&!s.foes.length){T.k=3;T.t=0;T.got=0}}
  else if(T.k===3){if(!T.got&&!s.pups.length)dropPup(60+R()*(W-120),230,'S');
    if(T.got){T.k=4;T.t=0;T.dashed=0;s.foes=[];s.eb=[];spawn('shoot',W/2,-20,{hp:99999})}}
  else if(T.k===4&&T.dashed){T.k=5;T.t=0;T.bombed=0;s.foes=[];s.eb=[];s.bombs=1;for(var i=-1;i<=1;i++)spawn('drone',W/2+i*90,40,{vy:.5})}
  else if(T.k===5&&T.bombed){T.k=6;T.t=0}
  else if(T.k===6&&T.t>70)endTut()}
if(!seen)startTut();else toMenu();

/* ---------- input ---------- */
function pt(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H,off:e.pointerType==='touch'?70:0}}
function startGame(){newGame()}
function menuTap(p){
  for(var i=0;i<3;i++){var cx=W/2+(i-1)*110;
    if(Math.abs(p.x-cx)<50&&Math.abs(p.y-300)<48){cfg.ship=i;saveCfg()}
    if(Math.abs(p.x-cx)<40&&Math.abs(p.y-392)<30){cfg.mode=i;saveCfg()}
    var dx=W/2+(i-1)*80;if(Math.abs(p.x-dx)<32&&Math.abs(p.y-468)<30){cfg.diff=i;saveCfg()}}
  if(Math.abs(p.x-W/2)<110&&Math.abs(p.y-550)<30)startGame()}
cv.addEventListener('pointerdown',function(e){ac();cv.setPointerCapture(e.pointerId);var p=pt(e);
  if(paused){paused=false;return}
  if(s.state==='menu'){menuTap(p);return}
  if(s.state==='over'){if(s.overT>40)toMenu();return}
  /* touch steers relatively: the ship copies the thumb's movement from wherever the thumb lands */ p.rel=e.pointerType!=='mouse';p.sx=p.x;p.sy=p.y;p.ox=s.x;p.oy=s.y;touch=p;var n=performance.now();if(n-lastTap<280)doDash();lastTap=n});
cv.addEventListener('pointermove',function(e){if(touch){var q=pt(e);touch.x=q.x;touch.y=q.y}});
/* the empty part of the pad row under the screen works as a trackpad too */ (function(){var pad=document.getElementById('pad');if(!pad)return;pad.addEventListener('pointerdown',function(e){if(e.target!==pad||s.state!=='play'||paused)return;ac();try{pad.setPointerCapture(e.pointerId)}catch(_){}var p=pt(e);p.rel=true;p.sx=p.x;p.sy=p.y;p.ox=s.x;p.oy=s.y;touch=p});pad.addEventListener('pointermove',function(e){if(touch&&touch.rel){var q=pt(e);touch.x=q.x;touch.y=q.y}});['pointerup','pointercancel'].forEach(function(n){pad.addEventListener(n,function(){touch=null})});pad.style.touchAction='none'})();
['pointerup','pointercancel'].forEach(function(n){cv.addEventListener(n,function(){touch=null})});
var fire=document.getElementById('fire'),bombB=document.getElementById('bomb');
fire.addEventListener('pointerdown',function(e){e.preventDefault();ac();keys.Fire=true;fireEdge=true;fire.classList.add('on')});
['pointerup','pointercancel','pointerleave'].forEach(function(n){fire.addEventListener(n,function(){keys.Fire=false;fire.classList.remove('on')})});
bombB.addEventListener('pointerdown',function(e){e.preventDefault();ac();useBomb()});
addEventListener('keydown',function(e){ac();if(!e.repeat)onPress(e.code);keys[e.code]=true;
  if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].indexOf(e.code)>-1)e.preventDefault()});
addEventListener('keyup',function(e){keys[e.code]=false});
function onPress(c){
  if(c==='KeyM'){toggleSnd();return}
  if(c==='KeyP'||c==='Escape'){if(s.state==='play')paused=!paused;return}
  if(s.state==='menu'&&!tut){
    if(c==='ArrowLeft'||c==='KeyA'){cfg.ship=(cfg.ship+2)%3;saveCfg()}
    if(c==='ArrowRight'||c==='KeyD'){cfg.ship=(cfg.ship+1)%3;saveCfg()}
    if(c==='ArrowUp'||c==='KeyW'){cfg.mode=(cfg.mode+2)%3;saveCfg()}
    if(c==='ArrowDown'||c==='KeyS'){cfg.mode=(cfg.mode+1)%3;saveCfg()}
    if(c==='Space'||c==='Enter')startGame();return}
  if(s.state==='over'){if((c==='Space'||c==='Enter')&&s.overT>40)toMenu();return}
  if(paused){paused=false;return}
  if(c==='Space')fireEdge=true;
  if(c==='ShiftLeft'||c==='ShiftRight')doDash();
  if(c==='KeyB')useBomb()}

var ab=document.getElementById('auto');ab.onclick=function(){auto=!auto;ab.textContent='AUTOFIRE '+(auto?'ON':'OFF')};
document.getElementById('fs').onclick=function(){var f=document.fullscreenElement;f?document.exitFullscreen():(document.documentElement.requestFullscreen||function(){}).call(document.documentElement)};
Auto.bind(document.getElementById('bot'));
var sndB=document.getElementById('snd'),crtB=document.getElementById('crt');
function toggleSnd(){cfg.mute=!cfg.mute;saveCfg();sndB.style.opacity=cfg.mute?.45:1;sndB.classList.toggle('off',cfg.mute)}
function toggleCrt(){cfg.crt=!cfg.crt;saveCfg();crtB.style.opacity=cfg.crt?1:.45}
sndB.onclick=function(){ac();toggleSnd()};crtB.onclick=toggleCrt;sndB.style.opacity=cfg.mute?.45:1;sndB.classList.toggle('off',cfg.mute);crtB.style.opacity=cfg.crt?1:.45;
function padIn(){var g=navigator.getGamepads&&navigator.getGamepads()[0];if(!g)return null;
  var dz=function(v){return Math.abs(v)>.25?v:0},b=function(i){return !!(g.buttons[i]&&g.buttons[i].pressed)},o={ax:dz(g.axes[0]||0)+(b(15)?1:0)-(b(14)?1:0),ay:dz(g.axes[1]||0)+(b(13)?1:0)-(b(12)?1:0),fire:b(0)||b(7)};
  [[1,'dash'],[2,'bomb'],[9,'pause'],[0,'a']].forEach(function(x){var n=b(x[0]);if(n&&!gpPrev[x[1]]){
    if(x[1]==='dash')doDash();if(x[1]==='bomb')useBomb();if(x[1]==='pause'&&s.state==='play')paused=!paused;if(x[1]==='a'){if(s.state==='menu'&&!tut)startGame();else if(s.state==='over'&&s.overT>40)toMenu();else fireEdge=true}}gpPrev[x[1]]=n});return o}


/* ---------- auto mode bot ---------- */
function botDanger(x,y){var d=0,i,b,f;
  for(i=0;i<s.eb.length;i++){b=s.eb[i];for(var t=0;t<=24;t+=6){var bx=b.x+b.vx*t,by=b.y+b.vy*t,dd=Math.hypot(bx-x,by-y);if(dd<b.r+20)d+=(30-t)}}
  for(i=0;i<s.foes.length;i++){f=s.foes[i];for(var t2=0;t2<=24;t2+=8){var fx=f.x+(f.vx||0)*t2,fy=f.y+(f.vy||0)*t2,dd2=Math.hypot(fx-x,fy-y);if(dd2<f.r+24)d+=(36-t2)*1.5}}
  for(i=0;i<s.rocks.length;i++){f=s.rocks[i];if(Math.hypot(f.x+f.vx*10-x,f.y+f.vy*10-y)<f.r+22)d+=30}
  if(s.boss&&Math.hypot(s.boss.x-x,s.boss.y-y)<s.boss.r+30)d+=60;
  return d}
