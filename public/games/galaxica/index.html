<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04040c">
<meta name="mobile-web-app-capable" content="yes">
<title>Galaxica</title>
<link rel="stylesheet" href="../../shared/theme.css">
<script src="../../shared/device.js"></script>
<style>
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #wrap{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);
    box-shadow:0 0 50px rgba(160,107,255,.35),0 0 120px rgba(94,231,255,.15);background:rgba(6,6,20,.7)}
  canvas#c{display:block;touch-action:none}
  .bar{display:flex;gap:10px;align-items:center;font-size:.85rem;color:var(--dim);flex-wrap:wrap;justify-content:center;padding:0 8px}
  .btn{min-height:40px;padding:0 16px}
  #fire{position:absolute;right:14px;bottom:14px;width:76px;height:76px;border-radius:50%;
    border:1px solid var(--pink);background:rgba(255,95,210,.18);color:#fff;font-weight:700;
    box-shadow:0 0 26px rgba(255,95,210,.5);touch-action:none}
  #fire.on{background:rgba(255,95,210,.45)}
  html[data-device=desktop] #fire{display:none}
  #rot{display:none;position:fixed;inset:0;z-index:5;background:rgba(4,4,12,.92);align-items:center;
    justify-content:center;text-align:center;padding:30px;font-size:1.1rem}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="wrap"><canvas id="c"></canvas><button id="fire" aria-label="Fire">FIRE</button></div>
<div class="bar">
  <a class="btn" href="../../">← Arcade</a>
  <span data-show="desktop" hidden>← → / A D move · Space fires · P pauses</span>
  <span data-show="mobile" hidden>Drag anywhere to steer · hold FIRE (or auto-fire)</span>
  <button class="btn" id="auto" data-show="mobile" hidden>Auto-fire: ON</button>
  <button class="btn" id="fs">Fullscreen</button>
</div>
<div id="rot">Rotate your phone to portrait for the best view 📱</div>
<script src="../../shared/stars.js"></script>
<script>
var W=480,H=640,cv=document.getElementById('c'),ctx=cv.getContext('2d'),wrap=document.getElementById('wrap');
var dpr=Math.min(devicePixelRatio||1,2),scale=1;
function fit(){
  var bar=document.querySelector('.bar').offsetHeight+30;
  scale=Math.min(innerWidth*.98/W,(innerHeight-bar)/H);
  scale=Math.max(.3,Math.min(scale,Device.mobile?3:1.6));
  cv.style.width=W*scale+'px';cv.style.height=H*scale+'px';
  cv.width=W*scale*dpr;cv.height=H*scale*dpr;
  document.getElementById('rot').style.display=(Device.mobile&&!Device.portrait()&&innerHeight<420)?'flex':'none';
}
fit();Device.onChange(fit);

var keys={},auto=Device.mobile,paused=false,touchX=null;
addEventListener('keydown',function(e){keys[e.code]=true;if(e.code==='KeyP')paused=!paused;
  if(['Space','ArrowLeft','ArrowRight'].indexOf(e.code)>-1)e.preventDefault()});
addEventListener('keyup',function(e){keys[e.code]=false});
function px(e){var r=cv.getBoundingClientRect();return (e.clientX-r.left)/r.width*W}
cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);touchX=px(e);if(s.over)reset()});
cv.addEventListener('pointermove',function(e){if(touchX!==null)touchX=px(e)});
['pointerup','pointercancel'].forEach(function(n){cv.addEventListener(n,function(){touchX=null})});
var fire=document.getElementById('fire');
fire.addEventListener('pointerdown',function(e){e.preventDefault();keys.Fire=true;fire.classList.add('on');if(s.over)reset()});
['pointerup','pointercancel','pointerleave'].forEach(function(n){fire.addEventListener(n,function(){keys.Fire=false;fire.classList.remove('on')})});
var ab=document.getElementById('auto');
ab.onclick=function(){auto=!auto;ab.textContent='Auto-fire: '+(auto?'ON':'OFF')};
document.getElementById('fs').onclick=function(){
  var f=document.fullscreenElement;f?document.exitFullscreen():(document.documentElement.requestFullscreen||function(){}).call(document.documentElement)};
document.addEventListener('visibilitychange',function(){if(document.hidden)paused=true});

var s,best=0;try{best=+localStorage.galaxicaBest||0}catch(e){}
function reset(){s={x:W/2,cd:0,bullets:[],foes:[],parts:[],t:0,score:0,lives:3,over:false}}
reset();
function boom(x,y,c){for(var i=0;i<14;i++){var a=Math.random()*6.28,v=1+Math.random()*3;
  s.parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:30,c:c})}}
function step(){
  if(paused)return;
  s.parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.l--});s.parts=s.parts.filter(function(p){return p.l>0});
  if(s.over){if(keys.Space||keys.Enter)reset();return}
  s.t++;
  var v=(keys.ArrowLeft||keys.KeyA?-1:0)+(keys.ArrowRight||keys.KeyD?1:0);
  s.x+=v*6;
  if(touchX!==null)s.x+=Math.max(-12,Math.min(12,touchX-s.x))*.6;
  s.x=Math.max(20,Math.min(W-20,s.x));
  if(s.cd>0)s.cd--;
  if((keys.Space||keys.Fire||(auto&&Device.mobile))&&s.cd===0){s.bullets.push({x:s.x,y:H-50});s.cd=12}
  if(s.t%Math.max(18,60-Math.floor(s.t/300)*4)===0)s.foes.push({x:20+Math.random()*(W-40),y:-20,vy:1.5+Math.random()+s.t/3000});
  s.bullets.forEach(function(b){b.y-=9});s.foes.forEach(function(f){f.y+=f.vy});
  s.foes.forEach(function(f){s.bullets.forEach(function(b){
    if(!f.dead&&!b.dead&&Math.abs(f.x-b.x)<16&&Math.abs(f.y-b.y)<16){f.dead=b.dead=true;s.score+=10;boom(f.x,f.y,'#ff5fd2')}})});
  s.foes.forEach(function(f){if(!f.dead&&f.y>H-30){f.dead=true;boom(f.x,H-30,'#ff5555');
    if(--s.lives<=0){s.over=true;if(s.score>best){best=s.score;try{localStorage.galaxicaBest=best}catch(e){}}}}});
  s.bullets=s.bullets.filter(function(b){return !b.dead&&b.y>-10});s.foes=s.foes.filter(function(f){return !f.dead});
}
function glow(c,b){ctx.shadowColor=c;ctx.shadowBlur=b;ctx.fillStyle=c}
function draw(){
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  ctx.clearRect(0,0,W,H);
  glow('#5ee7ff',18);ctx.beginPath();ctx.moveTo(s.x,H-48);ctx.lineTo(s.x-17,H-14);ctx.lineTo(s.x,H-22);ctx.lineTo(s.x+17,H-14);ctx.fill();
  glow('#ffe066',14);s.bullets.forEach(function(b){ctx.fillRect(b.x-2,b.y,4,14)});
  s.foes.forEach(function(f){glow('#a06bff',20);ctx.beginPath();ctx.arc(f.x,f.y,12,0,7);ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.fillRect(f.x-6,f.y-2,3,3);ctx.fillRect(f.x+3,f.y-2,3,3)});
  s.parts.forEach(function(p){ctx.globalAlpha=p.l/30;glow(p.c,10);ctx.fillRect(p.x,p.y,3,3)});ctx.globalAlpha=1;
  ctx.shadowBlur=0;ctx.fillStyle='#e9ecff';ctx.font='600 16px system-ui';ctx.textAlign='left';
  ctx.fillText('Score '+s.score,14,26);ctx.textAlign='right';
  ctx.fillText('♥'.repeat(Math.max(0,s.lives))+'  Best '+best,W-14,26);
  if(s.over||paused){ctx.fillStyle='rgba(4,4,12,.6)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';
    glow('#5ee7ff',20);ctx.font='800 34px system-ui';ctx.fillText(paused&&!s.over?'PAUSED':'GAME OVER',W/2,H/2);
    ctx.shadowBlur=0;ctx.fillStyle='#e9ecff';ctx.font='16px system-ui';
    ctx.fillText(paused&&!s.over?(Device.mobile?'Tap to resume':'Press P to resume'):(Device.mobile?'Tap to restart':'Space to restart'),W/2,H/2+34)}
}
cv.addEventListener('pointerdown',function(){if(paused)paused=false});
(function loop(){step();draw();requestAnimationFrame(loop)})();
</script>
</body>
</html>
