#stage{padding:0}

.gk-b.rot{min-width:50px}
.gk-b.rot.on{background:var(--gk-ink);color:#e8d7b0}

.gk-b{border-radius:46% 54% 42% 58%/55% 45% 55% 45%;padding:0 12px}.gk-b:nth-child(3n){border-radius:58% 42% 52% 48%/45% 58% 42% 55%}.gk-b:nth-child(3n+1){border-radius:50% 50% 44% 56%/60% 52% 48% 40%}
.gk-b.on,.gk-b.md.on,.gk-b.gk-auto:not(.ghost){background:#d4572a;border-color:#2e2a24;color:#e8d7b0}

function newRun(seed){if(run&&!run.over&&run.count>0&&!tut.active)recordBest();PW=MODE==='reach'?130:230;eng=Engine.create({gravity:{x:0,y:1,scale:.0009},positionIterations:12,velocityIterations:8});

function hull(pts){pts=pts.slice().sort(function(a,b){return a.x-b.x||a.y-b.y});function cr(o,a,b){return(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x)}var lo=[],up=[],i,p;

  var area=Vertices.area(hl,true);if(area<500)return makeStone();return{verts:hl,col:col,seed:(rn()*1e6)|0,tone:rn(),kind:kind}}
function spawnHeld(){if(!tut.active&&mode==='play'&&run.count>=run.relicAt&&MODE!=='zen'){run.relicAt+=6;openRelic();return}spawnHeld0()}

/* ============ input ============ */

/* ============ dropping ============ */

  if(tut.active)tutFlag.dropped++}
/* ============ sim ============ */
function hoverY(){return Math.min(camY+110,stoneTop()-140)}

function step(){T++;GK.goals.tick();if(mode==='title'){return}
  if(mode==='over'){run.deadT++;if(Auto.on&&run.deadT>90)newRun();return}
  if(mode==='relic'){run.relicT++;if(Auto.on&&run.relicT>40)chooseRelic(run.relics[0]);return}
  if(mode!=='play')return;run.t++;

  if(run.held){var r=rotKeys();if(r)run.held.a+=r*.03;run.held.x+=(GK.clamp(ptx,40,W-40)-run.held.x)*.35}
  /* wind: gusts scale with the tower */
  windT+=1/60;var hgt=Math.max(0,(PY-stoneTop())/100);var base=(Math.sin(windT/2.7)+.7*Math.sin(windT/1.3+1.7)+.4*Math.sin(windT/.7+4))*(.0018+Math.min(.016,hgt*.0016))*run.windMul;wind+= (base-wind)*.05;

  Engine.update(eng,1000/60);

  if(run.strikes>=run.strikeMax&&!run.over){run.over=true;mode='over';run.deadT=0;recordBest();GK.audio.tone(200,.6,'sawtooth',.06,.4);return}

  if(run.dropped){run.settle++;if((moving===0&&run.settle>30)||run.settle>260){var h=Math.max(0,PY-stoneTop());run.h=h;scoreRun();if(h>run.hmax){run.hmax=h;if(!tut.active&&Math.floor(h/120)>run.milestone){run.milestone=Math.floor(h/120);[523,659,784,1047].forEach(function(f,i){GK.audio.tone(f,.3,'triangle',.05,1,GK.audio.ctx&&GK.audio.ctx.currentTime+i*.09)});run.pops.push({t:0,k:'mile',h:run.milestone})}}
      if(Auto.on)botPlan=null;spawnHeld()}}
  /* camera */
  var top=stoneTop();camT=Math.max(0,(PY-top)-360);camY+=(-camT-camY)*.04;

/* ============ AUTO: simulates candidate drops in a copy of the world ============ */
var botPlan=null;
function sim(cand){var e2=Engine.create({gravity:{x:0,y:1,scale:.0009},positionIterations:8,velocityIterations:6}),w=e2.world;Composite.add(w,Bodies.rectangle(W/2,PY+30,PW,60,{isStatic:true,friction:1}));
  var copies=run.stones.filter(function(s){return!s.fell}).map(function(s){var c=Bodies.fromVertices(s.position.x,s.position.y,[s.plugin.verts],{friction:.9,frictionStatic:1.3,restitution:.02,density:.0025,slop:.03},true);if(!c)return null;Body.setAngle(c,s.angle);Body.setPosition(c,s.position);return c}).filter(Boolean);

  var topY=PY;copies.concat([nb]).forEach(function(c){if(c.position.y<=PY+30)topY=Math.min(topY,c.bounds.min.y)});
  var speed=Math.hypot(nb.velocity.x,nb.velocity.y);if(MODE==='reach'){var mx=0;copies.concat([nb]).forEach(function(c){var o=Math.max(c.bounds.max.x-(W/2+PW/2),(W/2-PW/2)-c.bounds.min.x);if(c.position.y<=PY+30)mx=Math.max(mx,o)});return mx-fallen*400-speed*80}

function botTick(){if(!botPlan||botPlan.stone!==run.held){var h=run.held,top=null;run.stones.forEach(function(s){if(!s.fell&&(!top||s.position.y<top.position.y))top=s});var cxm=top?top.position.x:W/2,cands=[];if(MODE==='reach'){var rm=W/2+PW/2-50;run.stones.forEach(function(s){if(!s.fell)rm=Math.max(rm,s.bounds.max.x-40)});cxm=rm}

    var bestC=null,bs=-1e18;cands.forEach(function(c){var s=sim(c);if(s>bs){bs=s;bestC=c}});botPlan={stone:h,c:bestC||{x:W/2,a:0},wait:20}}
  var c=botPlan.c;ptx=c.x;if(Math.abs(run.held.a-c.a)>.04){run.held.a+=Math.sign(c.a-run.held.a)*Math.min(.06,Math.abs(c.a-run.held.a))}else if(Math.abs(run.held.x-c.x)<4&&--botPlan.wait<=0){drop()}}
/* ============ drawing ============ */
var CL=[['#cdb98f','#b9a47a'],['#b49a6e','#a1895e'],['#8f7a58','#7d6a4c']];
function drawBackdrop(){var par=[.15,.3,.5],cols=['#d6c39a','#bfa774','#9a8560'];ctx.fillStyle=SAND;ctx.fillRect(0,0,W,H);
  /* sun */ ctx.fillStyle=ORANGE;ctx.beginPath();ctx.arc(360,170-camY*.04,54,0,6.3);ctx.fill();ctx.fillStyle='rgba(232,215,176,.35)';ctx.beginPath();ctx.arc(360,170-camY*.04,70,0,6.3);ctx.fill();
  for(var l=0;l<3;l++){var oy=-camY*par[l],base=330+l*120+oy;ctx.fillStyle=cols[l];ctx.beginPath();ctx.moveTo(0,H+400);ctx.lineTo(0,base);var rn=GK.rng(l*91+5);for(var x=0;x<=W+40;x+=40){ctx.lineTo(x,base-rn()*70-(l===0?60:0)-(x>W*.6&&l===2?0:0))}ctx.lineTo(W+40,H+400);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(46,42,36,.5)';ctx.lineWidth=2;ctx.stroke()}

  ctx.globalAlpha=alpha==null?1:alpha;polyPath(vs,4,5);ctx.fillStyle='rgba(46,42,36,.32)';ctx.fill();polyPath(vs,0,0);ctx.fillStyle=col;ctx.fill();

var RELICS=['glue','heavy','net','calm','wide'];

function relicRect(i){var cw=130,gap=14,x0=(W-(3*cw+2*gap))/2;return[x0+i*(cw+gap),250,cw,210]}
function clickRelic(x,y){if(run.relicT<20)return;for(var i=0;i<3;i++){var r=relicRect(i);if(x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3]){chooseRelic(run.relics[i]);return}}}
function chooseRelic(k){ST.relics++;if(k==='glue')run.glue=5;else if(k==='heavy')run.heavy=5;else if(k==='net')run.net++;else if(k==='calm')run.windMul*=.5;else if(k==='wide'){var np=PW+50;Body.scale(run.ground,np/PW,1);PW=np}

function drawRelic(){ctx.fillStyle='rgba(232,215,176,.88)';ctx.fillRect(0,0,W,H);run.relicT=run.relicT||0;
  for(var i=0;i<3;i++){var r=relicRect(i),k=run.relics[i],cx=r[0]+r[2]/2,cy=r[1]+95,a=Math.min(1,Math.max(0,(run.relicT-i*5)/10));ctx.save();ctx.translate(0,(1-a)*30);ctx.globalAlpha=a;ctx.fillStyle='#f3e8c8';ctx.fillRect(r[0],r[1],r[2],r[3]);ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.strokeRect(r[0],r[1],r[2],r[3]);
    ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.fillStyle=ORANGE;
    if(k==='glue'){ctx.beginPath();ctx.moveTo(cx-30,cy-10);ctx.quadraticCurveTo(cx,cy-40,cx+30,cy-10);ctx.lineTo(cx+30,cy+8);ctx.quadraticCurveTo(cx+24,cy+32,cx+16,cy+12);ctx.quadraticCurveTo(cx+4,cy+36,cx-6,cy+12);ctx.quadraticCurveTo(cx-18,cy+30,cx-30,cy+8);ctx.closePath();ctx.fill();ctx.stroke()}
    else if(k==='heavy'){ctx.fillStyle='#6a6a70';ctx.beginPath();ctx.moveTo(cx-34,cy-20);ctx.lineTo(cx+34,cy-20);ctx.lineTo(cx+20,cy);ctx.lineTo(cx+14,cy+8);ctx.lineTo(cx+22,cy+28);ctx.lineTo(cx-22,cy+28);ctx.lineTo(cx-14,cy+8);ctx.lineTo(cx-20,cy);ctx.closePath();ctx.fill();ctx.stroke()}
    else if(k==='net'){ctx.beginPath();for(var q=-2;q<=2;q++){ctx.moveTo(cx-34,cy+q*14);ctx.lineTo(cx+34,cy+q*14);ctx.moveTo(cx+q*16,cy-30);ctx.lineTo(cx+q*16,cy+30)}ctx.stroke()}
    else if(k==='calm'){ctx.beginPath();ctx.moveTo(cx-34,cy-14);ctx.bezierCurveTo(cx-10,cy-30,cx+20,cy-4,cx+34,cy-16);ctx.moveTo(cx-34,cy+4);ctx.bezierCurveTo(cx-10,cy-10,cx+20,cy+16,cx+34,cy+2);ctx.moveTo(cx-34,cy+22);ctx.bezierCurveTo(cx-10,cy+8,cx+20,cy+34,cx+34,cy+20);ctx.stroke();ctx.beginPath();ctx.moveTo(cx-38,cy-34);ctx.lineTo(cx+38,cy+38);ctx.stroke()}
    else{ctx.fillStyle='#8f7a58';ctx.fillRect(cx-22,cy+4,44,24);ctx.strokeRect(cx-22,cy+4,44,24);ctx.beginPath();ctx.moveTo(cx-44,cy-8);ctx.lineTo(cx-28,cy-18);ctx.lineTo(cx-28,cy-2);ctx.closePath();ctx.moveTo(cx+44,cy-8);ctx.lineTo(cx+28,cy-18);ctx.lineTo(cx+28,cy-2);ctx.closePath();ctx.fillStyle=ORANGE;ctx.fill();ctx.stroke()}
    ctx.restore()}}
