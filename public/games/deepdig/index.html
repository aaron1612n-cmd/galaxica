<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ece2cc">
<title>Deepdig</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/gk.css">
<script src="../../shared/device.js"></script>
<script src="../../shared/auto.js"></script>
<script src="../../shared/speed.js"></script>
<script src="../../shared/gk.js"></script>
<script src="../../shared/gk2.js"></script>
<style>
/* Deepdig: a hand-coloured geological section, c. 1850. Laid paper, iron-gall ink, watercolour strata, one vermilion. */
:root{--gk-ty:80;--gk-toy:96;--gk-bg:#ece2cc;--gk-ink:#2b2219;--gk-acc:#c8432a;--gk-font:"IM Fell English",Georgia,serif;--gk-bw:1px;--gk-r:0;--gk-sh:none;--gk-h:40px}
body{background:#ece2cc}
#stage{padding:4px}
canvas#c{touch-action:none}
/* bar skin: museum specimen labels with clipped corners */
.gk-bar{border-top:3px double #2b2219;background:#e4d8bd}
.gk-b{background:#f6efdc;border:1px solid #2b2219;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px);font:15px "IM Fell English SC",serif;padding:0 12px}
.gk-b.on,.gk-b.md.on,.gk-b.gk-auto:not(.ghost){background:#c8432a;color:#f6efdc;border-color:#c8432a}
.gk-names .gk-b[data-cap]{padding:4px 10px}
#pad{display:flex;gap:8px;justify-content:center;padding:6px 10px 2px;flex:none}
#pad button{flex:1;max-width:96px;height:64px;background:#f6efdc;border:1px solid #2b2219;color:#2b2219;clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 9px,100% calc(100% - 9px),calc(100% - 9px) 100%,9px 100%,0 calc(100% - 9px),0 9px);display:flex;align-items:center;justify-content:center;touch-action:none}
#pad button svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#pad button.dn{background:#c8432a;color:#f6efdc}
html:not([data-device=mobile]) #pad{display:none}
#pad .bm{display:none;flex:.9;margin-left:6px}html[data-mode=exp] #pad .bm{display:flex}
.gk-mh span{display:flex;align-items:center;gap:6px}.gk-mh span svg{width:24px;height:24px}
.shop{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid rgba(43,34,25,.25);padding:4px 0}
.srow svg{width:30px;height:30px}
.pips{display:flex;gap:4px}.pips i{width:12px;height:12px;border:1px solid #2b2219;transform:rotate(45deg)}.pips i.on{background:#2b2219}
.buy{display:flex;align-items:center;gap:4px;height:38px;padding:0 12px;border:1px solid #2b2219;background:#f6efdc;color:#2b2219;font:18px "IM Fell English",serif;cursor:pointer}
.buy svg{width:18px;height:18px}.buy:disabled{opacity:.35;cursor:default}.buy.max{visibility:hidden}
.srow.cnt,.srow .cnt{font:20px "IM Fell English",serif}
button.srow.rel{grid-template-columns:40px 1fr;background:#f6efdc;border:1px solid #2b2219;color:#2b2219;padding:8px 10px;cursor:pointer;text-align:left}
button.srow.rel b{font:18px "IM Fell English SC",serif;font-weight:400}
.plates{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.plate{padding:0;border:1px solid #2b2219;background:transparent;aspect-ratio:1;cursor:default}.plate.got{cursor:pointer;background:#f6efdc}
.plate canvas{width:100%;height:100%;display:block}
.plate-sheet{align-items:center;text-align:center}.plate-sheet canvas{width:min(240px,70vw);height:auto;aspect-ratio:1}
.plate-sheet .cap{font:italic 20px "IM Fell English",serif;margin:0;max-width:22em}
.buy.hint,.srow.rel.hint{outline:2px solid #c8432a;animation:hintring 1.1s ease-in-out infinite}
@keyframes hintring{0%,100%{outline-offset:2px}50%{outline-offset:6px}}
@media (prefers-reduced-motion:reduce){.buy.hint,.srow.rel.hint{animation:none;outline-offset:3px}}
</style>
</head>
<body>
<div id="app"><div id="stage"><canvas id="c"></canvas></div><div id="pad"><button data-d="2" aria-label="Left"><svg viewBox="0 0 22 22"><path d="M14 4L7 11l7 7"/></svg></button><button data-d="3" aria-label="Up"><svg viewBox="0 0 22 22"><path d="M4 14l7-7 7 7"/></svg></button><button data-d="1" aria-label="Down"><svg viewBox="0 0 22 22"><path d="M4 8l7 7 7-7"/></svg></button><button data-d="0" aria-label="Right"><svg viewBox="0 0 22 22"><path d="M8 4l7 7-7 7"/></svg></button><button class="bm" aria-label="Bomb"><svg viewBox="0 0 22 22"><circle cx="10" cy="13" r="6"/><path d="M14 8l3-3M16 4l2 2"/></svg></button></div><div id="bar"></div></div>
<script src="expedition.js"></script>
<script src="deepdig.js"></script>
</body>
</html>
