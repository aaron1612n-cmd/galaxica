<style>
/* Tidewater: a woodblock print. Washi paper, indigo bands, black keylines, one vermilion seal. */
:root{--gk-bg:#eadfc2;--gk-ink:#1b1b26;--gk-acc:#c8442a;--gk-font:"Shippori Mincho","Hiragino Mincho ProN",Georgia,serif;--gk-bw:3px;--gk-r:0;--gk-sh:none;--gk-h:40px}
body{background-color:#eadfc2;background-image:repeating-linear-gradient(90deg,rgba(120,90,50,.05) 0 1px,transparent 1px 7px),repeating-linear-gradient(0deg,rgba(120,90,50,.035) 0 1px,transparent 1px 11px)}
#stage{padding:8px}
#lvls{position:fixed;inset:0;z-index:20;background:rgba(27,27,38,.55);display:flex;align-items:center;justify-content:center;padding:14px}
#lvls .sheet{background:#eadfc2;border:3px solid var(--gk-ink);width:min(680px,100%);max-height:100%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
#lvls h2{margin:0;display:flex;justify-content:space-between;align-items:center;font:700 22px var(--gk-font)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
#grid button{aspect-ratio:1;border:3px solid var(--gk-ink);background:#f4ecd4;font:700 20px var(--gk-font);color:var(--gk-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative}
#grid button.cur{outline:3px solid var(--gk-acc);outline-offset:2px}
#grid button.lock{opacity:.35}
#grid button i{display:flex;gap:2px}#grid button i b{width:8px;height:8px;border:2px solid var(--gk-ink)}#grid button i b.on{background:var(--gk-acc);border-color:var(--gk-acc)}
.gk-b.num{font:700 15px var(--gk-font);min-width:72px}
/* bar skin: carved seals on a dark plank rail */
.gk-bar{background:#1b1b26}.gk-bar .gk-b{color:#eadfc2;border:3px solid #eadfc2;outline:1px solid #eadfc2;outline-offset:-7px}
.gk-bar .spd input,.gk-bar .spd .btn{color:#eadfc2;border-color:#eadfc2}.gk-bar .spd b{color:#eadfc2}
.gk-b.on,.gk-b.gk-auto:not(.ghost){background:#c8442a;border-color:#c8442a;outline-color:#eadfc2;color:#eadfc2}
.gk-more .gk-b{color:#1b1b26;border-color:#1b1b26;outline-color:#1b1b26}
.gk-names .gk-bar .gk-b[data-cap]{outline:none}
</style>
</head>
<body>
<div id="app"><div id="stage"><canvas id="c"></canvas></div><div id="bar"></div></div>
<script>
GK.id('tidewater');
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
var INK='#1b1b26',PAPER='#eadfc2',SAND='#d9c18a',SANDD='#b99d62',VERM='#c8442a',ROCK='#3a3a46';
var WB=['#1d3558','#27487a','#32599a','#3d6cb0','#4d7fc2']; /* water by depth, deepest first */
var WS=['#2d4d7c','#3a62a0','#4a76b8','#5b8bcc','#6c9ad4'];
var TS=64,MAXL=4;
/* ============ levels ============ */
var DIRS=[[0,-1],[0,1],[-1,0],[1,0]];
function passable(Lv,x,y,L,m){if(x<0||y<0||x>=Lv.w||y>=Lv.h)return false;var i=y*Lv.w+x;if(Lv.blk[i]||Lv.lo[i]>L||L>Lv.hi[i])return false;if(Lv.lock&&Lv.lock[i]&&!((m||0)&Lv.keyBit))return false;return true}
function pickup(Lv,x,y,m){for(var k=0;k<Lv.pearls.length;k++)if(Lv.pearls[k][0]===x&&Lv.pearls[k][1]===y)m|=1<<k;if(Lv.key&&Lv.key[0]===x&&Lv.key[1]===y)m|=Lv.keyBit;return m}
/* one step plus any current that carries the boat further */
function resolveMove(Lv,x,y,L,m,dx,dy){var nx=x+dx,ny=y+dy;if(!passable(Lv,nx,ny,L,m))return null;var path=[[nx,ny]];m=pickup(Lv,nx,ny,m);x=nx;y=ny;
  for(var g=0;g<5;g++){var c=Lv.cur?Lv.cur[y*Lv.w+x]:-1;if(c==null||c<0)break;var cx=x+DIRS[c][0],cy=y+DIRS[c][1];if(!passable(Lv,cx,cy,L,m))break;x=cx;y=cy;m=pickup(Lv,x,y,m);path.push([x,y])}
  return{x:x,y:y,m:m,path:path}}
function solve(Lv,noTide,from){
  var w=Lv.w,np=Lv.pearls.length,nb=np+(Lv.key?1:0),full=(1<<np)-1,B=1<<nb,SZ=w*Lv.h*5*B,seen=new Int32Array(SZ).fill(-1),act=new Int8Array(SZ),q=[],head=0;
  function enc(x,y,L,m){return((y*w+x)*5+L)*B+m}
  var f=from||{x:Lv.start[0],y:Lv.start[1],L:Lv.L0,m:0},s0=enc(f.x,f.y,f.L,f.m);seen[s0]=s0;q.push(s0);var goal=-1;
  while(head<q.length){var c=q[head++],m=c%B,r=(c-m)/B,L=r%5;r=(r-L)/5;var x=r%w,y=(r-x)/w;
    if((m&full)===full&&x===Lv.home[0]&&y===Lv.home[1]){goal=c;break}
    for(var d=0;d<4;d++){var mv=resolveMove(Lv,x,y,L,m,DIRS[d][0],DIRS[d][1]);if(mv){var n=enc(mv.x,mv.y,L,mv.m);if(seen[n]<0){seen[n]=c;act[n]=d;q.push(n)}}}
    if(!noTide)for(var dl=-1;dl<=1;dl+=2){var nl=L+dl;if(nl<0||nl>MAXL||!passable(Lv,x,y,nl,m))continue;var n2=enc(x,y,nl,m);if(seen[n2]<0){seen[n2]=c;act[n2]=4+(dl>0?1:0);q.push(n2)}}}
  if(goal<0)return null;var out=[],c2=goal;while(c2!==s0){out.push(act[c2]);c2=seen[c2]}out.reverse();return out}
function build(rows,pearls,start,home,L0,bridges){ /* rows: strings, digit=lo, #=blocked */
  var h=rows.length,w=rows[0].length,Lv={w:w,h:h,lo:[],hi:[],blk:[],pearls:pearls,start:start,home:home,L0:L0,cur:null,key:null,lock:null,keyBit:0};
  for(var y=0;y<h;y++)for(var x=0;x<w;x++){var ch=rows[y][x];Lv.blk.push(ch==='#'?1:0);Lv.lo.push(ch==='#'?4:+ch);Lv.hi.push(4)}
  (bridges||[]).forEach(function(b){Lv.hi[b[1]*w+b[0]]=b[2]});Lv.par=(solve(Lv)||[]).length;return Lv}
var TUT=[
 build(['0000','0#00','0000'],[[3,0]],[0,2],[0,0],2),
 build(['00300','00300','00300'],[[4,2]],[0,1],[0,0],0)];
TUT[2]=build(['000#0','00000','000#0'],[[4,1]],[0,1],[4,0],3,[[3,1,1]]);
TUT[2].blk[0*5+3]=1;TUT[2].blk[2*5+3]=1;
var cache={};
function gen(n){if(cache[n])return cache[n];var pl=n>=1000?60+(n%30):n;
  var size=pl<8?5:pl<20?6:pl<35?7:pl<55?8:pl<80?9:10,np=1+Math.min(3,Math.floor(pl/20)),minPar=Math.min(8+Math.floor(pl*.5),46),best=null,bestPar=-1;
  for(var att=0;att<900;att++){
    var rn=GK.rng(n*7919+att*131+1),w=size,h=size;if(pl>3&&rn()<.3){w=size+1}
    var f=[],i,x,y;for(i=0;i<w*h;i++)f.push(rn());
    for(var pass=0;pass<2;pass++){var g=f.slice();for(y=0;y<h;y++)for(x=0;x<w;x++){var s=0,c=0;for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){var xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<w&&yy<h){s+=f[yy*w+xx];c++}}g[y*w+x]=s/c}f=g}
    var order=f.map(function(v,i){return[v,i]}).sort(function(a,b){return a[0]-b[0]}),Lv={w:w,h:h,lo:new Array(w*h),hi:new Array(w*h).fill(4),blk:new Array(w*h).fill(0),pearls:[],start:null,home:null,L0:0,cur:null,key:null,lock:null,keyBit:0},cuts=[.24,.48,.7,.86,1];
    order.forEach(function(o,k){var p=(k+1)/order.length,lv=0;while(p>cuts[lv])lv++;Lv.lo[o[1]]=lv});
    for(i=0;i<w*h;i++){if(Lv.lo[i]===4&&rn()<.55)Lv.blk[i]=1;else if(Lv.lo[i]<=1&&rn()<.2+pl/300)Lv.hi[i]=Math.max(Lv.lo[i],1+((rn()*3)|0))}
    var ok=[];for(i=0;i<w*h;i++)if(!Lv.blk[i]&&Lv.lo[i]<=2)ok.push(i);if(ok.length<np+6)continue;
    function pick(){return ok.splice((rn()*ok.length)|0,1)[0]}
    var a=pick(),b=pick(),tries=0;while(Math.abs(a%w-b%w)+Math.abs((a/w|0)-(b/w|0))<Math.floor((w+h)/2)&&tries++<30){b=pick();ok.push(b);b=pick()}
    Lv.start=[a%w,a/w|0];Lv.home=[b%w,b/w|0];Lv.L0=Lv.lo[a];if(Lv.hi[a]<Lv.L0)Lv.hi[a]=4;

    if(pl>=20){var nc=Math.min(7,2+Math.floor((pl-20)/15));Lv.cur=new Array(w*h).fill(-1);var cand2=[];for(i=0;i<w*h;i++)if(!Lv.blk[i]&&i!==a&&i!==b)cand2.push(i);for(var q2=0;q2<nc&&cand2.length;q2++){Lv.cur[cand2.splice((rn()*cand2.length)|0,1)[0]]=(rn()*4)|0}}
    if(pl>=40&&ok.length>3){var pk=pick();Lv.key=[pk%w,pk/w|0];Lv.keyBit=1<<np;Lv.lock=new Array(w*h).fill(0);var nl2=Math.min(5,2+Math.floor((pl-40)/20)),cand3=[];for(i=0;i<w*h;i++)if(!Lv.blk[i]&&i!==a&&i!==b&&i!==pk)cand3.push(i);for(var q3=0;q3<nl2&&cand3.length;q3++)Lv.lock[cand3.splice((rn()*cand3.length)|0,1)[0]]=1}
    var sol=solve(Lv);if(!sol)continue;

    var tides=0;sol.forEach(function(a){if(a>=4)tides++});if(tides<Math.min(2,1+Math.floor(pl/10)))continue;
    var par=sol.length;if(par>bestPar){best=Lv;bestPar=par}if(par>=minPar)break}
  if(!best)best=TUT[1];best.par=bestPar>0?bestPar:(solve(best)||[]).length;best.n=n;cache[n]=best;return best}
/* ============ state ============ */
var NLV=120,ST=GK.ls.get('st',{pearls:0,tides:0,perfect:0,daily:0,keys:0}),inDaily=false,prog=GK.ls.get('prog',{done:0,stars:{}}),lv=null,lvN=0,inTut=false,tutI=0;
var S={x:0,y:0,L:0,mask:0,moves:0,hist:[],won:false,bx:0,by:0,bdir:0,aq:[],winT:0,tideV:0};
var T=0,mode='play',W=0,H=0,OX=0,OY=0,GX=0;
function loadLevel(n,tut){inDaily=n>=1000&&!tut;GK.fx.clear();inTut=!!tut;tutI=tut?n:0;lvN=n;lv=tut?TUT[n]:gen(n);S.x=lv.start[0];S.y=lv.start[1];S.L=lv.L0;S.mask=0;S.moves=0;S.hist=[];S.hint=0;S.hints=0;S.won=false;S.aq=[];S.bx=S.x;S.by=S.y;S.bdir=0;S.tideV=S.L;S.winT=0;layout()}
function layout(){W=lv.w*TS+86;H=lv.h*TS+16;OX=8;OY=8;GX=lv.w*TS+OX+26;GK.fit(cv,stage,W,H,1.6)}
function pearlAt(x,y){for(var k=0;k<lv.pearls.length;k++)if(lv.pearls[k][0]===x&&lv.pearls[k][1]===y)return k;return-1}
function push(){S.hist.push([S.x,S.y,S.L,S.mask,S.moves])}
function doMove(dx,dy){if(S.won||mode!=='play')return false;var mv=resolveMove(lv,S.x,S.y,S.L,S.mask,dx,dy);if(!mv){bump();return false}
  push();var m0=S.mask;S.x=mv.x;S.y=mv.y;S.mask=mv.m;S.moves++;S.hint=0;S.bdir=Math.atan2(dy,dx);var np=lv.pearls.length,got=mv.m&~m0,px=OX+S.x*TS+TS/2,py=OY+S.y*TS+TS/2;
  for(var k=0;k<np;k++)if(got>>k&1){ST.pearls++;GK.audio.tone(880+k*220,.25,'sine',.06);GK.audio.tone(1320+k*220,.4,'sine',.04,.8,GK.audio.ctx&&GK.audio.ctx.currentTime+.08);GK.fx.burst(px,py,14,{col:'#fff',speed:3.4,life:30,shape:'ci',size:3})}
  if(lv.keyBit&&got&lv.keyBit){ST.keys++;GK.audio.tone(520,.1,'square',.05);GK.audio.tone(780,.2,'square',.05,1,GK.audio.ctx&&GK.audio.ctx.currentTime+.08);GK.fx.burst(px,py,16,{col:'#d9a521',speed:3,life:30,shape:'ci',size:3})}
  if(!got)GK.audio.tone(300,.07,'triangle',.04,.7);if(mv.path.length>1)GK.audio.tone(200,.2,'sine',.04,1.8);
  GK.fx.burst(OX+(S.x-dx)*TS+TS/2,OY+(S.y-dy)*TS+TS/2,4,{col:'rgba(255,255,255,.8)',speed:1.2,life:20,shape:'ci',size:2});GK.ls.set('st',ST);
  checkWin();return true}
function doTide(d){if(S.won||mode!=='play')return false;var nl=S.L+d;if(nl<0||nl>MAXL||!passable(lv,S.x,S.y,nl,S.mask)){bump();return false}
  push();S.L=nl;S.moves++;S.hint=0;ST.tides++;GK.fx.burst(OX+S.x*TS+TS/2,OY+S.y*TS+TS/2,8,{col:'rgba(255,255,255,.7)',speed:2,life:24,shape:'ci',size:2.4});GK.audio.noise(.25,.05,0,800);GK.audio.tone(120+nl*30,.3,'sine',.05);return true}
function bump(){S.bumpT=8;GK.fx.shake(3,7);GK.audio.tone(110,.08,'square',.04,.6)}
function checkWin(){if((S.mask&((1<<lv.pearls.length)-1))===(1<<lv.pearls.length)-1&&S.x===lv.home[0]&&S.y===lv.home[1]){S.won=true;S.winT=0;
  var st=S.moves<=lv.par?3:S.moves<=lv.par+3?2:1;if(S.hints)st=Math.min(st,2);S.stars=st;if(st===3&&!inTut)ST.perfect++;if(inDaily){var dd=GK.daily.claim(1000-S.moves);ST.daily=dd.n}GK.ls.set('st',ST);GK.fx.burst(W/2,H/2,60,{col:'#c8442a',speed:5,life:50,shape:'sq',size:5,grav:.08});if(!inTut&&!inDaily){var o=prog.stars[lvN]||0;if(st>o)prog.stars[lvN]=st;if(lvN>prog.done)prog.done=lvN;GK.ls.set('prog',prog)}
  [523,659,784,1047].forEach(function(f,i){GK.audio.tone(f,.35,'triangle',.06,1,GK.audio.ctx&&GK.audio.ctx.currentTime+i*.12)})}}
function undo(){var h=S.hist.pop();if(!h||S.won)return;S.x=h[0];S.y=h[1];S.L=h[2];S.mask=h[3];S.moves=h[4];S.aq=[]}
function restart(){loadLevel(lvN,inTut)}
function nextLevel(){if(inTut){if(tutI<2){loadLevel(tutI+1,true)}else{tut.end();loadLevel(Math.min(NLV,prog.done+1),false)}}else if(inDaily)loadLevel(Math.min(NLV,Math.max(1,prog.done+1)),false);else loadLevel(Math.min(NLV,lvN+1),false)}
/* ============ path assist ============ */
function pathTo(tx,ty){var w=lv.w,seen={},q=[{x:S.x,y:S.y,m:S.mask,p:[]}];seen[S.x+','+S.y+','+S.mask]=1;
  for(var h=0;h<q.length;h++){var c=q[h];if(c.x===tx&&c.y===ty)return c.p;if(c.p.length>40)continue;
    for(var d=0;d<4;d++){var mv=resolveMove(lv,c.x,c.y,S.L,c.m,DIRS[d][0],DIRS[d][1]);if(!mv)continue;var k=mv.x+','+mv.y+','+mv.m;if(!seen[k]){seen[k]=1;q.push({x:mv.x,y:mv.y,m:mv.m,p:c.p.concat([d])})}}}return null}
var DD=[[0,-1],[0,1],[-1,0],[1,0]];
/* ============ input ============ */
function cellAt(x,y){var cx=Math.floor((x-OX)/TS),cy=Math.floor((y-OY)/TS);return(cx>=0&&cy>=0&&cx<lv.w&&cy<lv.h)?[cx,cy]:null}
GK.pointer(cv,{down:function(x,y){if(mode!=='play')return;if(S.won){if(S.winT>30)nextLevel();return}
    if(x>GX-14){var l=MAXL-Math.round((y-OY-30)/((lv.h*TS-60)/MAXL));l=GK.clamp(l,0,MAXL);setTideTarget(l);return}
    var c=cellAt(x,y);if(!c)return;var dx=c[0]-S.x,dy=c[1]-S.y;

  key:function(c,d){if(!d)return;if(S.won&&(c==='Space'||c==='Enter')){nextLevel();return}
    var map={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
    if(c==='KeyA'&&Auto.on){return}
    if(map[c])doMove(map[c][0],map[c][1]);else if(c==='KeyQ'||c==='PageDown'||c==='BracketLeft')doTide(-1);else if(c==='KeyE'||c==='PageUp'||c==='BracketRight')doTide(1);
    else if(c==='KeyZ'||c==='Backspace')undo();else if(c==='KeyR')restart()}});
GK.autoKey=true;
function setTideTarget(l){var d=l>S.L?1:-1,q=[];for(var i=S.L;i!==l;i+=d)q.push({t:'t',d:d});S.aq=q}
/* ============ drawing ============ */
function rr(x,y,w,h){ctx.beginPath();ctx.rect(x,y,w,h)}
function seigaiha(x,y,col,col2,t){ctx.save();ctx.beginPath();ctx.rect(x,y,TS,TS);ctx.clip();var r=TS/4;
  for(var row=-1;row<7;row++){for(var col2i=-1;col2i<5;col2i++){var cx=x+col2i*r*2+(row&1?r:0),cy=y+row*r*.55+Math.sin(t*.03+row+col2i)*.8;
      for(var k=3;k>=1;k--){ctx.beginPath();ctx.arc(cx,cy+r*.5,r*k/3,Math.PI,0);ctx.fillStyle=k%2?col:col2;ctx.fill();ctx.strokeStyle='rgba(15,25,50,.55)';ctx.lineWidth=1;ctx.stroke()}}}
  ctx.restore()}
function drawTile(x,y){var i=y*lv.w+x,px=OX+x*TS,py=OY+y*TS,lo=lv.lo[i],hi=lv.hi[i],L=S.tideV;
  var wet=lo<=L+.001;
  if(lv.blk[i]){ctx.fillStyle=lv.lo[i]<=0?WB[0]:WB[1];rr(px,py,TS,TS);ctx.fill();
    /* rock pile */ var rn=GK.rng(i*31+7);ctx.fillStyle=ROCK;ctx.strokeStyle=INK;ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(px+6,py+TS-6);ctx.lineTo(px+14,py+22);ctx.lineTo(px+30,py+10+rn()*8);ctx.lineTo(px+46,py+24);ctx.lineTo(px+TS-6,py+TS-6);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.strokeStyle='#6a6a78';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px+22,py+30);ctx.lineTo(px+34,py+44);ctx.moveTo(px+38,py+28);ctx.lineTo(px+44,py+40);ctx.stroke();return}
  if(wet){var di=Math.min(4,Math.max(0,Math.round(L)-lo));seigaiha(px,py,WB[4-di],WS[4-di],T);}
  else{ /* exposed bar: raised sand block */
    var h=Math.min(16,(lo-L)*5+4);ctx.fillStyle=SANDD;rr(px,py+TS-h,TS,h);ctx.fill();ctx.fillStyle=SAND;rr(px,py,TS,TS-h);ctx.fill();
    ctx.strokeStyle='rgba(120,90,40,.55)';ctx.lineWidth=2;for(var k=0;k<3;k++){ctx.beginPath();var yy=py+12+k*14;ctx.moveTo(px+8,yy);ctx.quadraticCurveTo(px+TS/2,yy-5,px+TS-8,yy);ctx.stroke()}}
  ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.strokeRect(px+1,py+1,TS-2,TS-2);
  /* depth pips (lo) */
