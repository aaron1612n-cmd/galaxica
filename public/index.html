<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1016">
<title>Galaxica Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/theme.css">
<script src="shared/device.js"></script>
<script src="shared/auto.js"></script>
<script src="shared/speed.js"></script>
<style>
  .wrap{max-width:780px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 20px 60px}
  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;font-size:11px;color:var(--dim);border-bottom:2px solid var(--paper);padding-bottom:8px}
  h1{font:700 clamp(2.4rem,13vw,5.6rem)/.95 var(--px);text-transform:uppercase;margin:34px 0 40px;letter-spacing:-.01em}
  h1 span{color:var(--amber)}
  .lede{max-width:46ch;color:var(--dim);margin:0 0 36px}
  .head{display:none}
  .row{display:grid;grid-template-columns:3em 132px 1fr auto;gap:16px;align-items:center}
  .head{font-size:11px;color:var(--dim);border-bottom:1px solid var(--line);padding:6px 0}
  a.row{padding:14px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
  a.row:hover,a.row:focus-visible{background:var(--ink2);outline:none;box-shadow:-14px 0 0 var(--ink2),14px 0 0 var(--ink2)}
  a.row:hover .go,a.row:focus-visible .go{background:var(--amber);color:var(--ink)}
  .no{color:var(--amber);font-family:var(--px)}
  .t{font:700 1.25rem var(--px);text-transform:uppercase}
  .th{width:132px;height:99px;object-fit:cover;object-position:center;border:2px solid var(--paper);background:var(--ink2);display:block;image-rendering:auto}
  .tx{min-width:0}.b{color:var(--dim);font-size:13px;margin-top:6px;max-width:52ch}
  @media(max-width:560px){.row{grid-template-columns:96px 1fr;gap:12px}.no{display:none}.go{grid-column:1/-1;justify-self:start}.th{width:96px;height:72px}.t{font-size:1rem}}
  .go{font:700 11px var(--px);border:2px solid var(--paper);padding:6px 10px;align-self:center}
  .empty{color:var(--dim);padding:18px 0;font-size:13px}
  .pyl{color:var(--paper);text-decoration:none;border:2px solid var(--paper);padding:7px 10px;font-size:10px;margin-right:auto}
  .wsl{margin-right:8px}.wsl+.pyl{margin-right:auto}.top .wsl{margin-right:0}
  .pyl:hover,.pyl:focus-visible{background:var(--amber);color:var(--ink);border-color:var(--amber);outline:none}
  footer{margin-top:40px;font-size:11px;color:var(--dim)}
  .cursor{display:inline-block;width:.55em;height:1em;background:var(--amber);vertical-align:-.12em;animation:b 1s steps(1) infinite}
  @keyframes b{50%{opacity:0}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <div class="top px"><span>Galaxica Arcade · Cat. 01</span><a class="pyl wsl" href="workshop/" title="Build bots that play the games for you">Bot workshop</a><a class="pyl" href="python/" title="Searchable answers for Python and tkinter">Python answers</a><div class="cl"><button class="btn ghost" id="bot" title="Auto-play: every game plays itself" style="min-height:34px;padding:0 10px;font-size:10px;box-shadow:3px 3px 0 var(--paper)">AUTO</button><span data-speed></span></div></div>
  <h1>Galax<span>ica</span></h1>
  <div class="head px"><span>No.</span><span>Title</span><span></span></div>
  <div id="games"><div class="empty"><span class="cursor"></span></div></div>
</div>
<script src="shared/stars.js"></script>
<script>
Auto.bind(document.getElementById('bot'));
fetch('games.json').then(function(r){return r.json()}).then(function(list){
  var el=document.getElementById('games');el.textContent='';
  list.forEach(function(g,i){
    var a=document.createElement('a');a.className='row';a.href='games/'+g.id+'/';
    var n=document.createElement('span');n.className='no';n.textContent=String(i+1).padStart(3,'0');
    var im=document.createElement('img');im.className='th';im.src=g.thumb||('games/'+g.id+'/thumb.jpg');im.alt='';im.loading='lazy';im.width=132;im.height=99;
    var tx=document.createElement('div');tx.className='tx';var t=document.createElement('div');t.className='t';t.textContent=g.title;tx.appendChild(t);
    if(g.blurb){var b=document.createElement('div');b.className='b';b.textContent=g.blurb;tx.appendChild(b)}
    var go=document.createElement('span');go.className='go';go.textContent='PLAY';
    a.append(n,im,tx,go);el.append(a);
  });
});
</script>
</body>
</html>
