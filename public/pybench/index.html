<!doctype html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#f3eee3">
<title>Pybench</title>
<meta name="description" content="A Python workbench in the browser: editor, shell, debugger, turtle and lessons, in the spirit of IDLE.">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="vendor/cm/codemirror.min.css">
<link rel="stylesheet" href="vendor/cm/addon/dialog/dialog.min.css">
<link rel="stylesheet" href="vendor/cm/addon/hint/show-hint.min.css">
<style>
/* Pybench. Palette "Workbench": paper, board, ink, graphite, rule + one accent (kiln). Type: Atkinson Hyperlegible for words, IBM Plex Mono for code. */
:root{
  --paper:#f3eee3; --board:#e9e2d3; --well:#fbf8f1; --ink:#211f1a; --graphite:#6b6457; --rule:#d3c9b6; --kiln:#c2410c; --kiln-ink:#fff8f0;
  --err:#a8261a; --ok:#3f6212; --sel:#f0d9c4; --line:#efe7d8;
  --k:#8f2d0f; --b:#2d5a52; --s:#4d6a10; --c:#8a8170; --n:#9a5200; --d:#2f4373; --m:#7a4d6e;
  --ui:'Atkinson Hyperlegible',ui-sans-serif,system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --fs:15px; --rail:78px; --side:330px; --hdr:44px; --stat:26px;
}
:root[data-theme=night]{
  --paper:#1a1916; --board:#24221e; --well:#141310; --ink:#ebe5d8; --graphite:#9b9383; --rule:#3a3630; --kiln:#e8743b; --kiln-ink:#1a1916;
  --err:#ff8a75; --ok:#a5c46a; --sel:#4a3426; --line:#211f1b;
  --k:#f0915f; --b:#8cc4b4; --s:#b5cc73; --c:#857d6e; --n:#e7b560; --d:#9fb3e8; --m:#d39ec4;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:14px/1.45 var(--ui);-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{display:grid;grid-template-rows:var(--hdr) 1fr var(--stat);overflow:hidden;height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--kiln);outline-offset:1px}
.ui,header,nav,footer,.phead,.tabs,#rail,.keys,.mnav,.menu,.btn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}

/* ---------- menubar */
header{display:flex;align-items:stretch;border-bottom:1px solid var(--ink);background:var(--paper);position:relative;z-index:30;padding-left:env(safe-area-inset-left)}
.mark{display:flex;align-items:center;gap:8px;padding:0 14px 0 14px;font:600 15px var(--mono);color:var(--ink);text-decoration:none;border-right:1px solid var(--rule);letter-spacing:-.02em}
.mark i{width:9px;height:9px;background:var(--kiln);display:inline-block}
#menus{display:flex}
.mt{padding:0 11px;display:flex;align-items:center;height:100%;font-size:14px}
.mt:hover,.mt[aria-expanded=true]{background:var(--board)}
.menu{position:absolute;top:100%;min-width:250px;background:var(--well);border:1px solid var(--ink);box-shadow:4px 4px 0 var(--rule);padding:4px 0;z-index:40;max-height:calc(100dvh - 60px);overflow:auto}
.mi{display:flex;width:100%;text-align:left;padding:6px 14px;gap:18px;align-items:baseline;white-space:nowrap}
.mi .kb{margin-left:auto;font:12px var(--mono);color:var(--graphite)}
.mi:hover,.mi:focus{background:var(--board);outline:none}
.mi[aria-checked]::before{content:'';width:10px;height:10px;border:1.5px solid var(--ink);flex:none;align-self:center;margin-right:-8px}
.mi[aria-checked=true]::before{background:var(--kiln);border-color:var(--kiln)}
.mi[disabled]{color:var(--graphite);cursor:default}
.msep{height:1px;background:var(--rule);margin:4px 0}
.hsp{flex:1}
.state{display:flex;align-items:center;gap:7px;padding:0 12px;font:12px var(--mono);color:var(--graphite);white-space:nowrap}
.state b{width:8px;height:8px;border:1.5px solid var(--graphite);border-radius:50%}
.state[data-s=ready] b{background:var(--ok);border-color:var(--ok)}
.state[data-s=busy] b,.state[data-s=input] b,.state[data-s=paused] b{background:var(--kiln);border-color:var(--kiln)}
.run{background:var(--kiln);color:var(--kiln-ink);font-weight:700;padding:0 18px;display:flex;align-items:center;gap:8px;margin-right:env(safe-area-inset-right)}
.run svg{width:11px;height:11px}
.run:hover{filter:brightness(1.07)}
#mmenu{display:none;padding:0 14px;font-weight:700}

/* ---------- layout */
main{display:grid;grid-template-columns:minmax(0,1.15fr) 6px minmax(0,1fr) var(--rail) var(--side);min-height:0}
main.noside{grid-template-columns:minmax(0,1.15fr) 6px minmax(0,1fr) var(--rail) 0}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--paper)}
.split{background:var(--board);border-left:1px solid var(--rule);border-right:1px solid var(--rule);cursor:col-resize;touch-action:none}
.split:hover{background:var(--rule)}
.phead{display:flex;align-items:center;gap:2px;height:36px;padding:0 6px 0 12px;border-bottom:1px solid var(--rule);flex:none;background:var(--paper)}
.lbl{font:700 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--graphite)}
.ver{font:12px var(--mono);color:var(--graphite);margin-left:8px}
.sp{flex:1}
.hb{padding:5px 9px;font-size:13px;border:1px solid transparent}
.hb:hover{border-color:var(--rule);background:var(--board)}

/* file tabs */
.tabs{display:flex;align-items:flex-end;height:36px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none;flex:none;padding-left:6px;gap:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;font:13px var(--mono);border:1px solid transparent;border-bottom:0;white-space:nowrap;color:var(--graphite);position:relative;top:1px}
.tab[aria-selected=true]{background:var(--well);border-color:var(--rule);color:var(--ink);box-shadow:inset 0 2px 0 var(--kiln)}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--kiln);display:none}
.tab.dirty .dot{display:block}
.tab .x{width:20px;height:20px;display:grid;place-items:center;color:var(--graphite);font-size:15px;line-height:1}
.tab .x:hover{background:var(--board);color:var(--ink)}
.tab.ro{font-style:italic}
.newtab{height:30px;width:30px;color:var(--graphite);font-size:18px;flex:none}
.ctx{font:12.5px var(--mono);background:var(--board);border-bottom:1px solid var(--rule);padding:3px 0 3px 12px;color:var(--graphite);white-space:pre;overflow:hidden;flex:none}
.ctx div{cursor:pointer}.ctx div:hover{color:var(--ink)}
#ed{flex:1;min-height:0;position:relative;background:var(--well)}
.CodeMirror [contenteditable],.CodeMirror textarea{outline:none!important}

/* ---------- CodeMirror skin */
.CodeMirror{height:100%;font:var(--fs)/1.55 var(--mono);background:var(--well);color:var(--ink)}
.CodeMirror-gutters{background:var(--paper);border-right:1px solid var(--rule)}
.CodeMirror-linenumber{color:var(--graphite);padding:0 6px 0 4px;font-size:.82em}
.CodeMirror-cursor{border-left:2px solid var(--kiln)}
.CodeMirror-selected,.CodeMirror-focused .CodeMirror-selected,.CodeMirror-line::selection,.CodeMirror-line>span::selection,.CodeMirror-line>span>span::selection{background:var(--sel)!important}
.CodeMirror-activeline-background{background:var(--line)}
.CodeMirror-matchingbracket{color:var(--kiln)!important;text-decoration:underline;text-underline-offset:3px;font-weight:600}
.CodeMirror-nonmatchingbracket{color:var(--err)!important;background:var(--sel)}
.cm-s-default .cm-keyword,.pyhl .cm-keyword{color:var(--k);font-weight:600}
.cm-s-default .cm-builtin,.pyhl .cm-builtin{color:var(--b)}
.cm-s-default .cm-string,.cm-s-default .cm-string-2,.pyhl .cm-string,.pyhl .cm-string-2{color:var(--s)}
.cm-s-default .cm-comment,.pyhl .cm-comment{color:var(--c);font-style:italic}
.cm-s-default .cm-number,.pyhl .cm-number{color:var(--n)}
.cm-s-default .cm-def,.pyhl .cm-def{color:var(--d);font-weight:600}
.cm-s-default .cm-meta,.pyhl .cm-meta{color:var(--m)}
.cm-s-default .cm-variable-2,.pyhl .cm-variable-2{color:var(--b)}
.cm-s-default .cm-property,.pyhl .cm-property{color:var(--ink)}
.cm-s-default .cm-operator,.pyhl .cm-operator{color:var(--graphite)}
.cm-s-default .cm-error,.pyhl .cm-error{color:var(--err);text-decoration:underline wavy}
.bp-gutter{width:16px}
.bp{width:10px;height:10px;border-radius:50%;background:var(--err);margin:6px 0 0 3px}
.bpline{background:color-mix(in srgb,var(--err) 10%,transparent)}
.dbgline{background:color-mix(in srgb,var(--kiln) 22%,transparent)!important;box-shadow:inset 3px 0 0 var(--kiln)}
.errline{background:color-mix(in srgb,var(--err) 13%,transparent)}
.squig{text-decoration:underline wavy var(--err);text-decoration-skip-ink:none;text-underline-offset:3px}
.CodeMirror-dialog{background:var(--board);color:var(--ink);font:13px var(--ui);padding:6px 10px;border-color:var(--rule)!important}
.CodeMirror-dialog input{font:13px var(--mono);color:var(--ink);background:var(--well);border:1px solid var(--rule);padding:3px 6px;width:16em}
.CodeMirror-dialog button{border:1px solid var(--rule);padding:2px 8px;margin-left:4px;background:var(--well)}
.CodeMirror-hints{font:13px var(--mono);background:var(--well);border:1px solid var(--ink);box-shadow:3px 3px 0 var(--rule);border-radius:0;padding:2px 0;max-height:16em;z-index:50}
.CodeMirror-hint{color:var(--ink);padding:2px 10px;border-radius:0}
li.CodeMirror-hint-active{background:var(--kiln);color:var(--kiln-ink)}

/* ---------- shell */
#shell{flex:1;min-height:0;overflow-y:auto;background:var(--well);padding:8px 0 14px;font:var(--fs)/1.5 var(--mono);overscroll-behavior:contain}
#out{white-space:pre-wrap;word-break:break-word;padding:0 12px;-webkit-user-select:text;user-select:text}
#out .er{color:var(--err)}
#out .ps{color:var(--graphite)}
#out .in{color:var(--ok)}
#out .hint{display:block;margin:6px 0 8px;padding:7px 10px;border-left:3px solid var(--kiln);background:var(--board);font:14px/1.45 var(--ui);color:var(--ink);white-space:normal}
#out .hint b{font-weight:700;margin-right:6px}
#out .loc{text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px;cursor:pointer}
#out .loc:hover{text-decoration-color:var(--err)}
#out .sys{color:var(--graphite)}
#out .restart{display:flex;align-items:center;gap:10px;color:var(--graphite);margin:8px 0 4px;white-space:nowrap}
#out .restart::before,#out .restart::after{content:'';height:1px;background:var(--graphite);flex:1;transform-origin:left;animation:rule .55s cubic-bezier(.2,.7,.2,1) both}
#out .restart::after{transform-origin:right}
@keyframes rule{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){#out .restart::before,#out .restart::after{animation:none}}
.inrow{padding:0 12px 0 0}
#shin .CodeMirror{height:auto;background:transparent}
#shin .CodeMirror-gutters{background:transparent;border:0}
.ps-gutter{width:3.4em}
.psm{color:var(--graphite);padding-left:12px;font:var(--fs)/1.55 var(--mono)}
#shin.stdin .CodeMirror{color:var(--ok)}
#shin.stdin .ps-gutter{width:12px}
#shin.busy .CodeMirror-cursor{border-left-color:var(--graphite)}

/* ---------- rail + side panels */
#rail{display:flex;flex-direction:column;border-left:1px solid var(--ink);background:var(--board);overflow-y:auto;scrollbar-width:none}
.rb{padding:12px 4px;font:700 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--graphite);border-bottom:1px solid var(--rule);text-align:center;position:relative}
.rb:hover{color:var(--ink);background:var(--paper)}
.rb[aria-selected=true]{color:var(--ink);background:var(--well)}
.rb[aria-selected=true]::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--kiln)}
.rb .badge{display:block;margin:4px auto 0;width:6px;height:6px;background:var(--kiln);border-radius:50%}
#side{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--well);border-left:1px solid var(--rule)}
main.noside #side{display:none}
.panel{flex:1;overflow-y:auto;min-height:0;overscroll-behavior:contain}
.pad{padding:12px 14px}
.empty{color:var(--graphite);font-size:13px;padding:14px}
table.vt{width:100%;border-collapse:collapse;font:12.5px var(--mono)}
.vt th{font:700 10.5px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--graphite);text-align:left;padding:8px 10px 4px;border-bottom:1px solid var(--rule)}
.vt td{padding:5px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.vt td:first-child{font-weight:600;white-space:nowrap}
.vt td.ty{color:var(--b);white-space:nowrap}
.vt td.vl{word-break:break-all}
.vt tr.chg td{background:color-mix(in srgb,var(--kiln) 10%,transparent)}
.sec{font:700 10.5px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--graphite);padding:12px 14px 4px}
.list{list-style:none;margin:0;padding:0}
.list li>button,.list li>a{display:flex;gap:8px;width:100%;text-align:left;padding:7px 14px;border-bottom:1px solid var(--line);font:13px var(--mono);align-items:baseline;color:inherit;text-decoration:none}
.list li>button:hover{background:var(--board)}
.list .k{color:var(--k);font-weight:600;min-width:2.8em}
.list .mut{color:var(--graphite);margin-left:auto;font-size:12px}
.dbar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--rule)}
.btn{border:1px solid var(--ink);padding:6px 12px;background:var(--well);font-weight:700;font-size:13px}
.btn:hover{background:var(--board)}
.btn.pri{background:var(--kiln);border-color:var(--kiln);color:var(--kiln-ink)}
.btn[disabled]{opacity:.45;cursor:default}
.where{padding:8px 14px;font:13px var(--mono);border-bottom:1px solid var(--rule)}
.where .k{color:var(--kiln);font-weight:600}
#turtle{position:relative;flex:1;min-height:0;background:var(--well)}
#turtle canvas{position:absolute;inset:0;width:100%;height:100%}
.tbar{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--rule);align-items:center;flex-wrap:wrap}
.tbar select{font:13px var(--ui);background:var(--well);color:var(--ink);border:1px solid var(--rule);padding:4px}
.doc{font:13px/1.5 var(--mono);white-space:pre-wrap;padding:10px 14px;margin:0}
.search{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--rule)}
.search input,.fld input,.fld select,.fld textarea{flex:1;font:14px var(--mono);background:var(--well);color:var(--ink);border:1px solid var(--rule);padding:6px 8px;min-width:0;border-radius:0}
.search input:focus,.fld input:focus{outline:2px solid var(--kiln);outline-offset:-1px}

/* lessons */
.lesson-list li>button{font-family:var(--ui);font-size:14px;padding:9px 14px}
.lesson-list .no{font:12px var(--mono);color:var(--graphite);width:2em}
.lesson-list .tick{margin-left:auto;width:14px;height:14px;border:1.5px solid var(--rule);flex:none;align-self:center}
.lesson-list .done .tick{background:var(--ok);border-color:var(--ok)}
.prose{padding:6px 16px 16px;font-size:14.5px;line-height:1.55}
.prose h2{font:700 19px/1.25 var(--ui);margin:10px 0 8px}
.prose p{margin:0 0 10px}
.prose code{font:.92em var(--mono);background:var(--board);padding:1px 4px}
.prose pre{font:13px/1.5 var(--mono);background:var(--paper);border:1px solid var(--rule);padding:8px 10px;margin:0 0 4px;white-space:pre-wrap;position:relative}
.prose .try{font:700 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--kiln);padding:2px 0 10px;display:inline-block}
.task{border:1px solid var(--ink);margin:14px 0 6px;padding:10px 12px;background:var(--paper)}
.task h3{margin:0 0 6px;font:700 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--kiln)}
.verdict{margin-top:10px;padding:8px 10px;font-size:14px;border-left:3px solid var(--rule)}
.verdict.ok{border-color:var(--ok);color:var(--ok);font-weight:700}
.verdict.no{border-color:var(--err)}
.backlink{padding:10px 14px 0;font-size:13px;color:var(--graphite)}
.cheat h4{font:700 12px var(--ui);margin:14px 14px 4px;letter-spacing:.04em}
.cheat pre{margin:0 14px 6px;font:12.5px/1.5 var(--mono);background:var(--paper);border:1px solid var(--line);padding:6px 9px;white-space:pre-wrap;cursor:pointer}
.cheat pre:hover{border-color:var(--kiln)}

/* status bar */
footer{display:flex;align-items:center;gap:16px;border-top:1px solid var(--ink);padding:0 12px;font:12px var(--mono);color:var(--graphite);background:var(--paper);white-space:nowrap;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
#st-msg{overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-family:var(--ui);font-size:13px}
#st-msg.bad{color:var(--err)}
#st-msg button{text-decoration:underline;color:inherit;padding:0}

/* dialogs */
.veil{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 35%,transparent);display:grid;place-items:center;z-index:60;padding:16px}
.dlg{background:var(--well);border:1px solid var(--ink);box-shadow:6px 6px 0 color-mix(in srgb,var(--ink) 25%,transparent);width:min(460px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column}
.dlg.wide{width:min(720px,100%)}
.dlg h2{margin:0;padding:12px 16px;font:700 16px var(--ui);border-bottom:1px solid var(--rule)}
.dlg .body{padding:14px 16px;overflow:auto}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--rule)}
.fld{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.fld>span{width:44%;font-size:14px}
.fld input[type=checkbox]{flex:none;width:18px;height:18px;accent-color:var(--kiln)}
.keytable{width:100%;border-collapse:collapse;font-size:13.5px}
.keytable td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.keytable td:first-child{font:12.5px var(--mono);white-space:nowrap;color:var(--k);width:13.5em}
.keytable h3{font:700 11px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--graphite);margin:14px 0 4px}

/* mobile key row + nav */
.keys{display:none}
.mnav{display:none}
@media (max-width:899px){
  :root{--hdr:48px;--stat:0px}
  body{grid-template-rows:var(--hdr) 1fr auto auto}
  footer{display:none}
  #menus,.state .tx,.mark span{display:none}
  .mark{padding:0 12px;border-right:0}
  #mmenu{display:flex;align-items:center;border-left:1px solid var(--rule)}
  header .hsp{order:2}
  .state{order:3}
  #mmenu{order:4}
  .run{order:5;padding:0 16px}
  main,main.noside{grid-template-columns:100%;grid-template-rows:100%}
  main>*{grid-area:1/1}
  .split,#rail{display:none!important}
  main[data-view=code] #shpane,main[data-view=code] #side{display:none}
  main[data-view=shell] #edpane,main[data-view=shell] #side{display:none}
  main[data-view=side] #edpane,main[data-view=side] #shpane{display:none}
  main[data-view=side] #side,main.noside[data-view=side] #side{display:flex;border-left:0}
  .menu{position:fixed;left:0;right:0;top:var(--hdr);min-width:0;max-height:calc(100dvh - var(--hdr));box-shadow:none;border-width:0 0 1px}
  .mi{padding:11px 18px;font-size:15px}
  .mi .kb{display:none}
  .mgroup{font:700 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--graphite);padding:12px 18px 2px}
  .keys{display:flex;gap:4px;padding:5px 6px;background:var(--board);border-top:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
  .keys button{flex:none;min-width:42px;height:38px;border:1px solid var(--rule);background:var(--well);font:600 15px var(--mono);padding:0 8px}
  .keys button.w{font:700 12px var(--ui);letter-spacing:.04em}
  .keys button.pri{background:var(--kiln);border-color:var(--kiln);color:var(--kiln-ink)}
  .keys:not(.on){display:none}
  .mnav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--ink);background:var(--paper);padding-bottom:env(safe-area-inset-bottom)}
  .mnav button{padding:9px 0 10px;font:700 12px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--graphite);position:relative}
  .mnav button[aria-selected=true]{color:var(--ink)}
  .mnav button[aria-selected=true]::before{content:'';position:absolute;left:22%;right:22%;top:0;height:3px;background:var(--kiln)}
  .mnav.kb{display:none}
  .phead .lbl{font-size:12px}
  .CodeMirror,#shell{font-size:calc(var(--fs) - 1px)}
  .sheet{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
  .sheet button{border:1px solid var(--rule);background:var(--well);padding:16px 10px;text-align:left;font-weight:700}
  .sheet button small{display:block;font-weight:400;color:var(--graphite);margin-top:2px}
}
@media print{header,#rail,#side,footer,.split,#shpane,.tabs{display:none!important}main{display:block}}
</style>
</head>
<body>
<header>
  <a class="mark" href="../" title="Back to the arcade"><i></i>pybench</a>
  <nav id="menus" role="menubar" aria-label="Menu"></nav>
  <span class="hsp"></span>
  <span class="state" id="pystate" data-s="load"><b></b><span class="tx">starting Python</span></span>
  <button id="mmenu" aria-haspopup="menu">Menu</button>
  <button class="run" id="runbtn" title="Run Module (F5)"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0l9 5-9 5z" fill="currentColor"/></svg>Run</button>
</header>
<main id="main" data-view="code">
  <section class="pane" id="edpane" aria-label="Editor">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="ctx" id="ctx" hidden></div>
    <div id="ed"></div>
  </section>
  <div class="split" id="split" title="Drag to resize"></div>
  <section class="pane" id="shpane" aria-label="Shell">
    <div class="phead"><span class="lbl">Shell</span><span class="ver" id="ver"></span><span class="sp"></span>
      <button class="hb" data-act="interrupt" title="Interrupt Execution (Ctrl+C)">Stop</button>
      <button class="hb" data-act="restart" title="Restart Shell (Ctrl+F6)">Restart</button>
      <button class="hb" data-act="clearshell" title="Clear the shell (Ctrl+L)">Clear</button></div>
    <div id="shell"><div id="out" aria-live="polite"></div><div class="inrow"><div id="shin"></div></div></div>
  </section>
  <nav id="rail" role="tablist" aria-label="Tools"></nav>
  <aside id="side" aria-label="Tool panel">
    <div class="phead"><span class="lbl" id="sidettl"></span><span class="sp"></span><span id="sideacts"></span></div>
    <div class="panel" id="panel"></div>
  </aside>
</main>
<footer id="status"><span id="st-pos">Ln 1, Col 0</span><span id="st-file"></span><span id="st-msg"></span></footer>
<div class="keys ui" id="keys"></div>
<nav class="mnav" id="mnav"></nav>

<script src="vendor/cm/codemirror.min.js"></script>
<script src="vendor/cm/mode/python/python.min.js"></script>
<script src="vendor/cm/addon/edit/matchbrackets.min.js"></script>
<script src="vendor/cm/addon/edit/closebrackets.min.js"></script>
<script src="vendor/cm/addon/comment/comment.min.js"></script>
<script src="vendor/cm/addon/dialog/dialog.min.js"></script>
<script src="vendor/cm/addon/search/searchcursor.min.js"></script>
<script src="vendor/cm/addon/search/search.min.js"></script>
<script src="vendor/cm/addon/search/jump-to-line.min.js"></script>
<script src="vendor/cm/addon/hint/show-hint.min.js"></script>
<script src="vendor/cm/addon/selection/active-line.min.js"></script>
<script src="vendor/cm/addon/display/placeholder.min.js"></script>
<script src="lessons.js"></script>
<script src="app.js"></script>
</body>
</html>
